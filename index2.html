he interior of the service, because the statute asks whether the outcome was achieved, not how, provided other guardrails are respected.\n\nRough rule: the more guardrails a service carries, the less of it can plausibly be made fully agentic, and the more the role of AI is assistance to a human decision-maker. Services with few guardrails — corporate transactions, internal workflows, self-service — have most latitude. Services with all four — child protection, safeguarding of adults at risk, homelessness relief — have least.\n\nFor the full typology including edge cases and worked examples, see `references/guardrails.md`.\n\n## 5. The agentic classification\n\nEach service entry classifies its end-state into one of four categories. The classification is a judgement about the destination, not a prediction of pace.\n\n- **Fully agentic.** The service or a coherent sub-service can plausibly be delivered end-to-end by software agents with minimal human oversight of individual cases. Typically rule-based, low-stakes, high-volume transactions.\n- **Human-in-the-loop.** Agents do most of the work — triage, drafting, coordination, summarisation — but a human makes the decision or holds accountability. Most statutory services with actor or outcome guardrails sit here.\n- **AI-assisted.** The service remains fundamentally a human practice. AI augments the human in targeted ways — summarising a case file, drafting a letter, surfacing a risk — but the shape of the work does not change.\n- **Human-only.** The service is so bound up with professional judgement, face-to-face presence, or relational trust that substantive AI involvement is neither defensible nor desirable. Rare, but real.\n\nWhen classifying or being asked to assess feasibility, name the category and tie the reasoning to the guardrails. *Do not* default to \"fully agentic\" because it sounds modern, or to \"human-only\" because it sounds safe. The work is the assessment.\n\n## 6. The directorate archetypes\n\nEnglish local authorities organise their delivery services into variations of six directorates. The labels vary — Place may be called Regeneration and Environment, Resources may be called Finance and Corporate Services, Corporate may be called Chief Executive's or Policy and Strategy — but the underlying functional groupings are consistent.\n\n| Directorate | Scope | Reference file |\n|---|---|---|\n| Adult Social Care and Health | Care Act duties, public health, safeguarding of adults at risk | `references/services/asch.md` |\n| Children and Education | Safeguarding, children looked after, SEND, school place planning, youth justice | `references/services/cype.md` |\n| Housing | Homelessness, allocations, HRA stock, private sector housing, enforcement | `references/services/housing.md` |\n| Place | Planning, highways, licensing, environmental services, regulatory, cultural, economic development | `references/services/place.md` |\n| Resources | Finance, revenues and benefits, HR, ICT, legal, procurement, property | `references/services/resources.md` |\n| Corporate | Democratic services, electoral, policy and performance, communications, customer contact, complaints, information rights | `references/services/corporate.md` |\n\nFor the full directorate descriptions including dominant structural features, scale, and political exposure, see `references/directorates.md`.\n\n## 7. The recommendation patterns\n\nWhen recommending operating model change, do not generate ad-hoc \"AI ideas\". Draw on the recommendation patterns library in `references/patterns.md`, which contains reusable patterns extracted from cross-cutting analysis — shared evidence assembly, directorate triage, practitioner judgement model, market stewardship, risk-based review, data and performance cell, shared scheduling, AI-assisted drafting, proactive prevention, shared customer contact, and others.\n\nEach pattern in the library has:\n\n- **Operating model problem it addresses** — what kind of pressure or gap triggers the pattern\n- **People change** — what roles, skills, or capacity changes\n- **Process change** — what workflows, handoffs, or decision points change\n- **Technology change** — what platforms or systems are needed\n- **Data and AI enabler** — what data, integration, or AI work supports the change\n- **Shared capability potential** — whether the pattern can serve multiple services\n- **Human accountability** — what stays with the qualified or accountable human\n- **Risks** — typical risks the pattern introduces or fails to handle\n\nWhen applying patterns, name the pattern explicitly in the recommendation, cite which trigger conditions in the diagnosis pulled it in, and surface its risks alongside its benefits. Patterns are reusable building blocks, not slogans.\n\n## 8. The current reform context\n\nThree forces shape the operating environment of every English council. Any analysis that does not touch on at least one is likely to be missing something.\n\n- **Financial compression.** Sustained real-terms grant reduction, rising demand in adult social care, children's services, and temporary accommodation. Several councils under Section 114 or commissioner oversight. The 2026/27 settlement consolidates ring-fenced grants into the revenue support grant.\n- **Structural reform in flight.** Local government reorganisation across 21 areas. Surrey unitaries vest 1 April 2027; most other reorganisation areas working to a 2028 vesting day. Mayoral strategic authorities being established across much of England.\n- **Directorate-specific reform waves.** Children's Wellbeing and Schools Act 2025 (commencing). Schools White Paper SEND reforms (implementation from 2029). Renters' Rights Act 2025 (main provisions commence 1 May 2026). Casey Commission on Adult Social Care reporting through 2026 and 2028.\n\nFor the full reform context including legislation specifics, commencement dates, and what to read alongside each directorate's services file, see `references/reform-context.md`.\n\n## 9. Out of scope\n\nThis skill does not contain:\n\n- A statutory duties register (it identifies primary legislation but does not enumerate all duties)\n- Current commencement status of each provision (legislation is in flight; commencement dates change; check official sources for live status)\n- Legal advice (the skill identifies legislation but does not substitute for legal sign-off)\n- Council-specific information (use a council adapter loaded alongside this skill)\n- Specific product or vendor recommendations (the skill describes lever categories — translation to specific products is a separate step)\n- A transformation roadmap (the skill describes destinations and patterns; sequencing for a specific council is bespoke)\n\n## 10. Loading guidance summary\n\n| Diagnostic type | Load this | Plus |\n|---|---|---|\n| Directorate-level diagnostic | SKILL.md, `directorates.md`, `guardrails.md`, `patterns.md` | The directorate's services file |\n| Service-level diagnostic | SKILL.md, `guardrails.md`, `patterns.md` | The specific service's section |\n| Cross-cutting question (reform impact, agentic feasibility, shared capability) | SKILL.md, `guardrails.md`, `patterns.md`, `reform-context.md` | All directorates' services files only if the question genuinely spans them |\n| Briefing on a specific service | SKILL.md, the specific service's section | (Nothing else unless the brief asks for context) |\n\nSelective loading is the point. The reference content is large; loading all of it on every interaction wastes context. Identify which slice the task needs and load that slice.\n","directorates.md":"# Directorate archetypes\n\nEnglish local authorities organise their delivery services into variations of six directorates. The labels vary — Place may be called Regeneration and Environment, Resources may be called Finance and Corporate Services, Corporate may be called Chief Executive's or Policy and Strategy — but the underlying functional groupings are consistent. This file describes each archetype in enough depth to ground a directorate-level conversation.\n\nThe directorate archetypes used here cover the organisational shape of most upper-tier and unitary English councils. London boroughs, metropolitan districts, and county councils divide services in broadly similar ways, though the split between upper and lower tiers in non-unitary areas affects where some services sit (planning, licensing, environmental health, and waste). Where a service is materially different in a two-tier context, the relevant services file flags it. The programme of local government reorganisation is progressively eliminating the two-tier model in the areas it covers (see `reform-context.md`).\n\n## Table of contents\n\n1. [Adult Social Care and Health (ASCH)](#1-adult-social-care-and-health-asch)\n2. [Children and Education (CYPE)](#2-children-and-education-cype)\n3. [Housing](#3-housing)\n4. [Place — Regeneration, Environment, Economy](#4-place--regeneration-environment-economy)\n5. [Resources](#5-resources)\n6. [Corporate and Chief Executive's](#6-corporate-and-chief-executives)\n7. [A note on public health](#7-a-note-on-public-health)\n8. [A note on two-tier areas](#8-a-note-on-two-tier-areas)\n\n---\n\n## 1. Adult Social Care and Health (ASCH)\n\n### Scope\n\nCare Act 2014 duties (assessment, planning, safeguarding, market shaping); Mental Capacity Act and DoLS work; mental health social work; learning disability and autism services; public health (since 2013); occupational therapy and equipment; sexual health, substance misuse, and 0–19 public health services.\n\n### Dominant structural features\n\nThree structural features dominate:\n\n- **A very large commissioned provider market.** Home care, residential, nursing, supported living, specialist placements. Most ASCH spend is commissioned, not directly delivered. The market is fragile in places, capacity-constrained, politically sensitive at the cost end, and difficult to see clearly without active stewardship.\n- **A statutory NHS interface.** Hospital discharge (Pathways 1, 2, 3), continuing healthcare, intermediate care, s75 partnership arrangements for mental health, safeguarding interfaces. Volume- and time-pressured.\n- **High-volume, high-complexity statutory casework.** Assessments, plans, reviews, safeguarding enquiries, DoLS authorisations, mental capacity assessments. Tight statutory frames; substantial documentation burden.\n\n### Scale and political exposure\n\nTypically the largest single area of council spending in upper-tier and unitary authorities. Politically exposed because of cost growth, hospital discharge dynamics, provider failures, and safeguarding incidents. The Casey Commission is in flight and expected to reshape parts of the operating model from 2028 onwards.\n\n### Statutory regime\n\nCare Act 2014 (consolidated framework with explicit wellbeing principle, outcome-mandated duties, market-shaping duty); Mental Capacity Act 2005; Mental Health Act 1983 (s75 arrangements); Health and Social Care Act 2012 (public health transfer).\n\n### Where pressures concentrate\n\nHospital discharge throughput; assessment waiting lists; carer assessment under-delivery; provider market capacity and failure; safeguarding triage backlog; workforce vacancies and agency spend; mental capacity and DoLS authorisation delays.\n\n### Where digital and AI investment typically lands first\n\nDrafting and summarisation in statutory casework (assessments, safeguarding records); demand forecasting from referral data; provider market intelligence; review prioritisation; hospital discharge coordination.\n\n---\n\n## 2. Children and Education (CYPE)\n\n### Scope\n\nChildren's safeguarding (referral, assessment, child in need, child protection); looked-after children, fostering, adoption; care leavers; SEND (current EHCP regime, future ISP/SPP regime); home-to-school transport; school admissions and place planning; attendance, exclusions, children missing education; early help and family support; youth offending; early years sufficiency; virtual school for looked-after children.\n\n### Dominant structural features\n\nTwo structural features dominate:\n\n- **Two parallel statutory regimes.** The Children Act framework (1989, 2004) for safeguarding and looked-after children, and the Children and Families Act 2014 for SEND. Both are in live reform.\n- **A heavy interface with schools and education settings.** SEND, attendance, exclusions, early help, virtual school, transport. The council is a coordinating actor in a system it does not directly run.\n\n### Scale and political exposure\n\nIn most councils, the second-largest area of directorate spending after ASCH, with the largest statutory exposure (looked-after children placements, SEND high-needs block) and the highest political sensitivity. SEND high-needs block deficits are projected to reach approximately £6 billion nationally by March 2026.\n\n### Statutory regime\n\nChildren Act 1989 (safeguarding, child in need, looked after); Children Act 2004 (multi-agency arrangements); Children and Families Act 2014 (EHCP, SEND); Children's Wellbeing and Schools Act 2025 (commencing — family group decision-making, multi-agency child protection, single unique identifier, staying close support to 25, children-not-in-school register); Education Act 1996 (school place planning, exclusions, attendance).\n\n### Where pressures concentrate\n\nEHCP assessment backlog (20-week statutory clock); SEND high-needs block deficit; looked-after children placement cost and out-of-area placements; care leaver outcomes; child protection enquiry volume; multi-agency coordination friction; school place planning against demographic shift; transport cost.\n\n### Where digital and AI investment typically lands first\n\nDrafting and summarisation in statutory casework (assessments, court reports, EHCPs); MASH triage and partner referral coordination; placement matching and market intelligence; transport route optimisation; school admissions automation.\n\n### Reform note\n\nBoth statutory regimes are in flight. The 2025 Act is commencing through 2026/27. The Schools White Paper (February 2026) proposes a restructured SEND system from 2029 — Individual Support Plans, Specialist Provision Packages, four-tier model — with no changes to existing EHCPs before September 2030. Investment decisions in 2026 and 2027 must be reform-resilient (see `patterns.md`, pattern 13).\n\n---\n\n## 3. Housing\n\n### Scope\n\nHomelessness prevention and relief; temporary accommodation; housing register and allocations; HRA stock management (where retained); rent collection; responsive repairs; planned maintenance and capital works; anti-social behaviour; private sector housing enforcement; HMO licensing; Disabled Facilities Grants; housing advice and options; supported housing commissioning; Gypsy, Roma and Traveller sites; leasehold services.\n\n### Dominant structural features\n\nTwo structural features dominate:\n\n- **A bifurcated business.** A statutory homelessness and allocations service for residents of any tenure, plus a landlord service for HRA stock where retained. The two are governed differently, funded differently, and managed differently — but residents move between them and the council is accountable for both.\n- **Heavy private rented sector exposure.** Most homelessness demand and most enforcement work concerns private rented sector tenants and landlords. The Renters' Rights Act 2025 substantially extends the council's investigatory and enforcement role.\n\n### Scale and political exposure\n\nHigh political sensitivity. Temporary accommodation cost is a primary driver of council financial pressure in many areas. Awaab's Law, the Renters' Rights Act, and the Building Safety Act all create new duties or extend existing ones.\n\n### Statutory regime\n\nHousing Act 1996 (Part 6 allocations, Part 7 homelessness); Homelessness Reduction Act 2017; Housing Act 1985 (HRA); Homes (Fitness for Human Habitation) Act 2018; Housing Act 2004 (HMO licensing, housing health and safety rating); Renters' Rights Act 2025 (commencing — main provisions 1 May 2026); Building Safety Act 2022; Awaab's Law (social landlord duties, in force).\n\n### Where pressures concentrate\n\nTemporary accommodation cost; homelessness application throughput (56-day decision clock); private sector enforcement capacity; HRA repair backlog and damp-and-mould compliance; housing register management; supported housing market fragility; allocations scheme volume and bidding cycles.\n\n### Where digital and AI investment typically lands first\n\nHomelessness application triage and decision drafting; allocations bidding and matching; repairs reporting and triage; private sector enforcement case management; data integration for prevention (housing benefit, council tax, complaint signals).\n\n### Two-tier note\n\nIn two-tier areas, housing typically sits with the district council. Most reorganisation areas are moving to unitary structures by 2028.\n\n---\n\n## 4. Place — Regeneration, Environment, Economy\n\n### Scope\n\nPlanning (development management and policy); building control; highways and transportation; licensing; environmental health (food safety, environmental protection, public health protection); trading standards; waste collection and disposal; parks, libraries, leisure, culture; economic development and inward investment; emergency planning; coroners service.\n\n### Dominant structural features\n\nThree structural features dominate:\n\n- **Regulatory work alongside service delivery.** Planning, licensing, environmental health, and trading standards are regulatory functions with statutory frames; parks, libraries, and leisure are service-delivery functions with mostly discretionary frames.\n- **High commissioned spend.** Waste, leisure, highways maintenance, and increasingly libraries are heavily commissioned to private or third-sector delivery. Market stewardship matters.\n- **Heavy two-tier impact.** In two-tier areas, planning policy, building control, environmental health, and waste sit with district councils; highways and transportation with the county. Local government reorganisation collapses this.\n\n### Scale and political exposure\n\nModerate spend, high political sensitivity. Planning is politically exposed because of housing delivery and member casework. Waste is politically exposed because of service visibility. Cultural and leisure provision is politically exposed because of discretionary cuts.\n\n### Statutory regime\n\nTown and Country Planning Act 1990 (development management, planning policy); Planning and Compulsory Purchase Act 2004; Building Act 1984 (building control); Highways Act 1980; Environmental Protection Act 1990 (waste, statutory nuisance); Food Safety Act 1990; Licensing Act 2003 (alcohol, entertainment); Gambling Act 2005; Coroners and Justice Act 2009; Civil Contingencies Act 2004 (emergency planning).\n\n### Where pressures concentrate\n\nPlanning application volume against statutory determination clocks (8 or 13 weeks); housing delivery against local plan trajectory; building control competition with approved inspectors (since 2024 reforms); environmental health enforcement against demand spikes; waste contract cost; cultural and leisure provision under financial compression; member casework volume in planning.\n\n### Where digital and AI investment typically lands first\n\nPlanning application triage and case management; planning policy evidence base management; licensing application processing; environmental health complaint triage; waste route optimisation; library transactional automation; coroners service case management.\n\n### Two-tier note\n\nMost Place services are split between districts (planning, environmental health, waste, licensing, building control) and counties (highways, transportation, libraries, coroners) in two-tier areas. Local government reorganisation will eliminate this split in reorganising areas by 2028.\n\n---\n\n## 5. Resources\n\n### Scope\n\nFinance (treasury, financial planning, financial control); revenues and benefits (council tax, business rates, housing benefit, council tax support); HR (workforce planning, payroll, employee relations); ICT and digital; legal services (corporate, contentious, regulatory); procurement and commercial; property and estates; internal audit; risk management.\n\n### Dominant structural features\n\nThree structural features dominate:\n\n- **Internal-facing core.** Most Resources services serve the rest of the council, not residents directly. The customer is internal teams.\n- **High transactional volume in revenues and benefits.** The exception to internal-facing — revenues and benefits is among the highest-volume resident-facing services in the council, with rule-based work suitable for substantial automation.\n- **Statutory and regulatory shape.** Finance is heavily regulated (CIPFA, Section 151 officer); HR by employment law; legal by professional regulation; ICT by cyber and data protection; procurement by public contracts regulations.\n\n### Scale and political exposure\n\nModerate spend (excluding HRA and benefit pass-through). Lower political exposure in routine state — but Section 114 notices, audit qualifications, cyber incidents, and Best Value interventions are high-impact.\n\n### Statutory regime\n\nLocal Government Act 1972 (general framework); Local Government Finance Acts 1988, 1992 (council tax, business rates); Welfare Reform Act 2012 (council tax support); Social Security Contributions and Benefits Act 1992 (housing benefit); Employment Rights Act 1996; Equality Act 2010; Public Contracts Regulations 2015 (replaced by Procurement Act 2023); Local Government Act 2003 (capital and prudential framework); UK GDPR and Data Protection Act 2018.\n\n### Where pressures concentrate\n\nCouncil tax collection rates against rising demand; council tax support caseload; housing benefit caseload and Universal Credit transition; payroll accuracy under HR system change; legal services capacity against rising demand (homelessness, SEND tribunals, child protection); ICT modernisation against legacy debt; cyber resilience; procurement compliance and value.\n\n### Where digital and AI investment typically lands first\n\nRevenues and benefits transactional automation; council tax collection contact automation; HR self-service; legal triage and drafting; ICT service desk automation; procurement document review.\n\n---\n\n## 6. Corporate and Chief Executive's\n\n### Scope\n\nDemocratic services (member support, council and committee servicing, member development); electoral services (registration, elections, referendums); policy and performance; communications and engagement; customer contact (corporate front door, switchboard, channels); complaints and information rights (FOI, EIR, SAR); insurance; partnership working; transformation programme office; equality and diversity; consultation and engagement.\n\n### Dominant structural features\n\nTwo structural features dominate:\n\n- **Cross-cutting position.** Corporate services support the whole council and are the primary interface with members and residents at the institutional level. Decisions made here affect every directorate.\n- **Heavy regulatory exposure on transparency.** Information rights, electoral integrity, complaints handling, and transparency obligations are regulated by the ICO, the Electoral Commission, and the LGSCO. Failures are high-profile.\n\n### Scale and political exposure\n\nLower spend than delivery directorates. High political and reputational exposure — the chief executive's office, member services, complaints, and communications are where council reputation is shaped.\n\n### Statutory regime\n\nLocal Government Act 1972 (democratic structures); Local Government Act 2000 (executive arrangements, member conduct); Representation of the People Act 1983 (electoral); Freedom of Information Act 2000; Environmental Information Regulations 2004; UK GDPR and Data Protection Act 2018; Localism Act 2011 (member conduct, transparency); Local Government and Public Involvement in Health Act 2007 (community engagement).\n\n### Where pressures concentrate\n\nFOI and SAR volume against 20-day statutory clock; complaint volume across services; member casework volume; communications crisis response; electoral cycle preparation; transformation programme delivery; corporate transparency and reputation.\n\n### Where digital and AI investment typically lands first\n\nFOI and complaint triage, redaction, and drafting; customer contact AI and self-service; member casework tracking; communications drafting; consultation analysis.\n\n---\n\n## 7. A note on public health\n\nPublic health sits uneasily between directorates. Since the Health and Social Care Act 2012 moved the public health function from the NHS to local authorities, most councils place it within Adult Social Care and Health. Some position it corporately, reporting to the chief executive or to the director of public health as a chief officer in their own right. The director of public health is a statutory chief officer with a direct reporting line to the chief executive under statutory guidance, regardless of which directorate hosts the function operationally.\n\nThis skill treats public health as part of the ASCH archetype because most councils do, while flagging the structural ambiguity. A council adapter may override this placement to reflect local arrangements.\n\n## 8. A note on two-tier areas\n\nIn two-tier areas, county councils hold ASCH, CYPE, highways and transportation, libraries, and coroners; district councils hold housing, planning, environmental health, waste, licensing, and building control. Resources and Corporate are duplicated at both tiers. This split materially affects the operating model conversation:\n\n- A county council's \"directorate\" map omits Housing entirely (apart from supported housing commissioning) and has a different Place archetype focused on highways and transport.\n- A district council's \"directorate\" map omits ASCH and CYPE entirely and concentrates on Housing and Place.\n- In a two-tier area, customer-facing services often need cross-tier coordination that does not exist contractually.\n\nThe local government reorganisation programme is progressively eliminating the two-tier model in 21 areas, with Surrey vesting on 1 April 2027 and most other areas on 1 April 2028. For councils inside reorganisation areas, the operating model conversation has a transition dimension that other councils do not face: running business-as-usual while merging finance systems, harmonising policies, novating contracts, and designing the successor operating model in parallel.\n\nFor councils outside reorganisation areas, the pressure is to demonstrate sustainable unitary performance against the reorganised cohort — i.e. the comparator group is shifting underneath them.\n\nWhen working with a two-tier authority or a reorganisation area, identify the tier and reorganisation status early. The conversation differs.\n","guardrails.md":"# Statutory guardrails and agentic feasibility\n\nThe full reference for the four-guardrail typology, the four-tier agentic classification, and how to apply them to specific council services. SKILL.md contains an introduction; this file goes deeper, with edge cases, worked examples, and guidance for difficult classifications.\n\n## 1. Why a binary is not enough\n\nMost analysis of council services treats the statutory/discretionary split as a binary — is this service a duty or a power? The binary is necessary but not sufficient. Almost every council service has a statutory core surrounded by a discretionary wrapper. The Care Act 2014 mandates a needs assessment, but the way a council delivers reablement is largely discretionary. The Children Act 1989 mandates child protection enquiries, but the way a council commissions early help is largely discretionary. The Housing Act 1996 mandates a homelessness decision, but the design of the prevention offer is largely discretionary.\n\nThe interesting analytical question is not whether the duty exists. It is *where, specifically, does the statutory frame bind?*\n\nThe four-guardrail typology answers that question. A given duty may carry one, some, or all four guardrails. The combination of guardrails determines what can change, what cannot, and where AI or agentic systems can sit relative to the statutory work.\n\n## 2. The four guardrails\n\n### 2.1 Actor-mandated\n\nThe statute specifies *who* must perform the act.\n\n**Worked examples:**\n\n- A Care Act 2014 needs assessment must be carried out by a person who appears to the local authority to have the skills, knowledge, and competence to do so — in practice, a qualified social worker or occupational therapist.\n- A child protection enquiry under s47 Children Act 1989 must be led by a qualified social worker.\n- A building regulations inspection must be carried out by an authorised building control officer.\n- An Approved Mental Health Professional (AMHP) acting under the Mental Health Act must hold the AMHP qualification.\n- A Best Interests Assessor (BIA) acting under DoLS must hold the BIA qualification.\n- A registered planning officer signs off planning decisions.\n- A returning officer (and deputies) is the statutory actor for elections.\n\n**What this means for AI and agents:**\n\nWhere the statute names a professional actor, the decision cannot be delegated to an unqualified person — nor, by extension, to an autonomous software agent. The agent can assist, draft, summarise, check, and surface — but the decision itself stays with the prescribed human actor.\n\n**Edge cases:**\n\n- *Delegated authority within the actor mandate.* Some duties allow delegation to officers acting under scheme of delegation. Council tax decisions, for example, are statutorily the responsibility of the s151 officer but routinely delegated. The actor mandate sits at the level of the named accountable officer; delegation is permitted within the council's governance.\n- *Multi-actor processes.* A homelessness decision is taken by an officer acting under delegated authority, but with an internal review duty that requires a different officer. This is process-mandated more than actor-mandated, but creates similar constraints.\n\n### 2.2 Process-mandated\n\nThe statute specifies *how* the act must be carried out.\n\n**Worked examples:**\n\n- Allocation of social housing must follow the scheme published under s166A Housing Act 1996.\n- Homelessness decisions must follow the procedure set out in Part 7 Housing Act 1996 and the Homelessness Code of Guidance.\n- Planning applications must follow the procedures in the Town and Country Planning Act 1990 and associated regulations (consultation, publicity, decision notice).\n- Section 47 child protection enquiries must follow Working Together to Safeguard Children procedures.\n- Adult safeguarding enquiries must follow Making Safeguarding Personal principles set out in the Care and Support Statutory Guidance chapter 14.\n- FOI requests must follow the procedure in the Freedom of Information Act 2000 (s1, s10, s17).\n\n**What this means for AI and agents:**\n\nProcess-mandated duties limit how an agent can restructure a workflow. The agent can accelerate steps within the prescribed process, but cannot skip or reorder steps the statute requires. A homelessness decision still requires inquiry, decision, notification, and (on request) review — an agent can speed each step but cannot collapse them.\n\n**Edge cases:**\n\n- *Process specified at low resolution.* Some duties specify outcome but not procedure (e.g. the Care Act eligibility decision). These are outcome-mandated rather than process-mandated. The procedure is up to the council.\n- *Process specified by guidance, not statute.* Working Together, Care and Support Statutory Guidance, and the Homelessness Code of Guidance carry statutory force in different ways. Practical analysis treats them as binding.\n- *Multi-stage process with decision points.* A homelessness application has prevention duty, relief duty, and main duty stages. Each is a separate decision point. Process-mandated for the procedure within each stage and for the transitions between them.\n\n### 2.3 Timescale-mandated\n\nThe statute specifies *when* the act must be completed.\n\n**Worked examples:**\n\n- An EHCP assessment must be completed within 20 weeks of a request.\n- A homelessness application must receive a decision within 56 days of the relief duty starting.\n- Most planning applications must be determined within 8 weeks (13 weeks for major applications).\n- A freedom of information request must normally be answered within 20 working days.\n- A subject access request must be responded to within one month under UK GDPR.\n- Building regulations applications have specific decision timescales depending on type.\n- Council tax appeals to the Valuation Tribunal have prescribed timescales.\n\n**What this means for AI and agents:**\n\nTimescale-mandated duties are where agentic speed has the most immediate operational value. The agent compresses elapsed time within the prescribed process — assembling evidence, drafting, scheduling, coordinating partners, tracking progress against the clock. The statutory timescale is a hard ceiling; the operational target is usually well inside it.\n\n**Edge cases:**\n\n- *Soft timescales.* Some duties have non-statutory but expected timescales (e.g. ADASS guidance for adult safeguarding). These are operational targets, not legal limits, but failure to meet them is a complaint and inspection issue.\n- *Stop-the-clock provisions.* Some statutory clocks have stop conditions (planning may stop the clock during consultation; EHCP has limited stop provisions). These complicate operational tracking.\n- *Reasonableness rather than fixed clock.* Some duties require completion \"in a reasonable time\" rather than a specific period. These are not strictly timescale-mandated but operationally similar.\n\n### 2.4 Outcome-mandated\n\nThe statute specifies *what* must be achieved.\n\n**Worked examples:**\n\n- A council must meet the eligible needs of an adult under s18 Care Act 2014 — the test is whether eligible needs are met.\n- A council must secure accommodation for a person owed the main housing duty under s193 Housing Act 1996 — the test is whether suitable accommodation is secured.\n- A council must promote the welfare of children in care under s22 Children Act 1989 — the test is whether welfare is promoted (a complex outcome standard).\n- A council must respond to nuisance complaints under the Environmental Protection Act 1990 — the test is whether the nuisance is abated.\n\n**What this means for AI and agents:**\n\nOutcome-mandated duties give an agent the most latitude in the interior of the service, because the statute asks whether the outcome was achieved, not how it was achieved — provided other guardrails (actor, process) are respected. The agent can redesign the path to outcome more freely, but is judged against whether the outcome is reached, not against the redesign.\n\n**Edge cases:**\n\n- *Outcome with process specification.* Some duties combine outcome and process — the outcome must be achieved by following the prescribed process. Both apply.\n- *Outcome standards that are inherently judgemental.* \"Suitable accommodation\", \"welfare promoted\", \"needs met\" — each requires professional judgement. The outcome mandate does not specify a measurable threshold.\n- *Outcome failures are litigation triggers.* Outcome-mandated duties are the primary subject of judicial review and ombudsman determinations. Service redesign that misses the outcome creates legal as well as operational risk.\n\n## 3. Combining the guardrails\n\nA given duty may carry one, some, or all four guardrails. The combination determines what can change.\n\n### Common guardrail combinations\n\n| Combination | Typical services | Implication |\n|---|---|---|\n| Actor + process + outcome | Adult safeguarding, child protection, homelessness relief, DoLS, mental capacity assessment | Heaviest constraint. Decision is bound by actor mandate, process is bound by procedure, outcome is bound by statutory test. AI assists; the human decides; the procedure runs. |\n| Process + timescale | EHCP, FOI, SAR, planning applications | Heavy procedural constraint, hard timescale. AI value concentrates in throughput compression and procedural coordination. |\n| Outcome only | Adult care eligibility (the determination itself), homelessness suitability decisions | Greatest interior latitude. The path to outcome can be redesigned; the outcome cannot be missed. |\n| Timescale only | Some corporate transactional services, license renewals | Light constraint. AI value concentrates in throughput. |\n| None / discretionary | Early help, reablement design, leisure services, cultural provision | Greatest latitude. The discretionary wrapper around statutory cores. |\n\n### How the combination affects feasibility\n\nA rough but useful rule: the more guardrails a service carries, the less of it can plausibly be made fully agentic, and the more the role of AI is assistance to a human decision-maker.\n\n- Services with all four guardrails (child protection, safeguarding of adults at risk, homelessness relief): least latitude. Human-in-the-loop is the ceiling; AI assists statutory professionals.\n- Services with three guardrails: human-in-the-loop typical.\n- Services with two guardrails: AI-assisted to human-in-the-loop, depending on which two.\n- Services with one guardrail: AI-assisted to fully agentic possible.\n- Services with none (purely discretionary): fully agentic possible if other conditions support it (rule-based, low-stakes, well-understood).\n\nOther conditions also matter — stakes per case, public legitimacy, equity considerations, audit needs — but the guardrail count is the first filter.\n\n## 4. The agentic classification\n\nEach service entry classifies its end-state into one of four categories. The classification is a judgement about the destination, not a prediction of pace.\n\n### 4.1 Fully agentic\n\nThe service or a coherent sub-service can plausibly be delivered end-to-end by software agents with minimal human oversight of individual cases. Typically rule-based, low-stakes, high-volume transactions.\n\n**Examples:** Council tax single person discount renewal; library book reservations; routine licence renewals; parking permit issue for stable cases; council tax direct debit setup.\n\n**Conditions:**\n\n- Few or no statutory guardrails (or guardrails fully encoded in rules).\n- High volume.\n- Low stakes per case (errors are recoverable).\n- Well-defined rules with low edge-case incidence.\n- Clear audit trail and exception escalation path.\n\n### 4.2 Human-in-the-loop\n\nAgents do most of the work — triage, drafting, coordination, summarisation — but a human makes the decision or holds accountability for the outcome. Most statutory services with actor or outcome guardrails sit here.\n\n**Examples:** Adult needs assessment; child protection enquiry; homelessness decision; EHCP assessment; planning application determination; safeguarding enquiry.\n\n**Conditions:**\n\n- Actor-mandated and/or outcome-mandated.\n- Substantial work surrounding the decision (evidence, drafting, coordination) that does not require the actor's professional judgement.\n- Decision itself remains with the prescribed human actor.\n- Audit trail captures both the agent's contribution and the human decision.\n\n### 4.3 AI-assisted\n\nThe service remains fundamentally a human practice. AI augments the human in targeted ways — summarising a case file, drafting a letter, surfacing a risk — but the shape of the work does not change.\n\n**Examples:** Public health commissioning; reablement clinical practice; community engagement; member casework support; complex commissioning.\n\n**Conditions:**\n\n- Work is fundamentally relational, judgemental, or strategic.\n- Volume per case is low; complexity per case is high.\n- AI can augment specific tasks (summarisation, drafting, analysis) but cannot reshape the work.\n- Different from human-in-the-loop in that the work is *not* primarily a series of statutory decision points with substantial surrounding work — it is sustained human practice with point AI augmentation.\n\n### 4.4 Human-only\n\nThe service is so bound up with professional judgement, face-to-face presence, or relational trust that substantive AI involvement is neither defensible nor desirable. Rare, but real.\n\n**Examples:** The home visit in a safeguarding case; face-to-face best interests decisions for someone losing capacity; coroner's inquest hearing; member-constituent meetings on sensitive matters; emergency response command-and-control during incident.\n\n**Conditions:**\n\n- Trust, presence, or relational dynamics are the substance of the work.\n- AI involvement would degrade the work, not enhance it.\n- The classification applies to the specific activity, not the surrounding service. The home visit is human-only; the case management around it is not.\n\n## 5. How to classify a service\n\nWhen asked to classify or to assess feasibility:\n\n1. **Identify the guardrails.** Read the statute or the service entry's guardrails section. Name which of the four apply.\n2. **Identify the decision points.** Where in the workflow does a statutory decision get made? Who must make it under the actor mandate?\n3. **Identify the surrounding work.** What activities happen before, between, and after the decision points? How much practitioner time do they consume?\n4. **Apply the classification rubric:**\n   - All four guardrails, with statutory decisions at the centre → human-in-the-loop is the ceiling.\n   - Process and timescale only, no actor mandate → AI-assisted to human-in-the-loop, depending on stakes.\n   - Few guardrails, high volume, rule-based → fully agentic possible.\n   - Relational core, presence-based work → AI-assisted or human-only.\n5. **Surface the reasoning.** State which guardrails drove the classification, which conditions on the rubric were met, and where the boundary sits within the service (because the same service often combines classifications across sub-processes).\n\n### Worked classification: Adult safeguarding\n\n- **Guardrails:** Actor (qualified safeguarding lead), process (Making Safeguarding Personal, partner involvement), outcome (action necessary to protect the adult). Three guardrails.\n- **Decision points:** s42 threshold decision; enquiry conclusion (action necessary).\n- **Surrounding work:** Evidence assembly across systems and partners; SAR drafting; partner agency coordination; case recording; risk screening.\n- **Classification:** Human-in-the-loop. Actor mandate prevents fully agentic. Substantial surrounding work justifies more than AI-assisted.\n- **Boundary:** Triage screening could be more agentic; the s42 enquiry decision cannot be.\n\n### Worked classification: Council tax single person discount\n\n- **Guardrails:** None on the eligibility side — it is rule-based on resident composition. Process for disputes (Valuation Tribunal). Outcome only in the trivial sense that the discount is correct.\n- **Decision points:** Discount eligibility; recovery decisions on default.\n- **Surrounding work:** Application processing; renewal; verification against electoral roll.\n- **Classification:** Fully agentic for the standard path. Human-in-the-loop for disputes, fraud investigation, and recovery edge cases.\n- **Boundary:** The standard path is most of the volume; the residual human team handles exceptions.\n\n### Worked classification: Children's home visit during a safeguarding investigation\n\n- **Guardrails:** Process-mandated (Working Together); actor-mandated for the investigation (qualified social worker); outcome-mandated (welfare).\n- **Decision points:** What action is necessary to safeguard the child.\n- **Surrounding work:** Substantial — case recording, risk assessment, family chronology, partner agency liaison.\n- **Classification at activity level:** The home visit itself is human-only — relational, presence-based, judgemental in real time. The wider safeguarding service is human-in-the-loop.\n- **Boundary:** Surface this classification carefully. Saying \"child protection is human-only\" is wrong (the surrounding work is heavily augmentable). Saying \"child protection is human-in-the-loop\" is right at service level but loses the human-only core of the home visit.\n\n## 6. What this typology does not do\n\n- **It does not predict pace of change.** Classifying a service as fully agentic does not mean change happens fast. Workforce, technology, political appetite, and procurement all set pace.\n- **It does not specify product or vendor.** The classification is a destination shape, not a tool selection.\n- **It does not replace legal advice.** Identifying the guardrails is the first step, not the final word. Council legal services and the IG team must sign off on actual deployments.\n- **It does not handle every duty.** The reference covers around 100 services and the duties that frame them. Edge cases, niche statutory work, and locally specific arrangements may not classify cleanly. Surface the ambiguity rather than forcing it.\n\n## 7. When the classification is contested\n\nClassifications are sometimes contested between professionals, leadership, and digital teams. Common patterns:\n\n- **Practitioners pull towards human-only.** Out of professional protectiveness; out of unfamiliarity with what AI assistance actually looks like; out of well-founded concern about specific deployments. The right response is usually to narrow the classification to the genuinely human-only activity (the home visit, the disclosure interview, the best interests judgement) and to be specific about where assistance can sit in the surrounding work.\n- **Digital teams pull towards fully agentic.** Out of optimism about technology; out of underestimation of the actor mandate; out of unfamiliarity with the operational texture. The right response is usually to narrow the fully-agentic claim to specific sub-processes and to be honest about where the actor mandate or the relational substance sits.\n- **Leadership pulls towards human-in-the-loop everywhere.** As a safe middle ground. Sometimes right, sometimes a hedge. The right response is to push for specifics — which decisions, which work, which actors.\n\nThe classification is most useful when it is precise about which activity, at which level of the service, sits in which category. Service-level classifications hide the detail that matters.\n","patterns.md":"# Operating model recommendation patterns\n\nA library of reusable operating model patterns for English local government. Each pattern describes a recognisable shape of change — a way of reorganising people, process, technology, data, and AI to address a specific class of operating model problem.\n\nThe patterns are not solutions to be applied wholesale. They are starting points for design. Most operating model recommendations combine two or three patterns; some councils invent variations the library does not anticipate. The point of the library is to ground the conversation in proven shapes rather than ad-hoc ideas.\n\n## How to use this file\n\nWhen recommending operating model change in response to a diagnostic, work through the patterns and select those whose trigger conditions match what the diagnostic surfaced. For each selected pattern:\n\n1. Name the pattern explicitly in the recommendation.\n2. Cite the trigger conditions from the diagnosis that pulled it in.\n3. Adapt the shape to the specific service or directorate context.\n4. Surface the pattern's risks alongside its benefits.\n5. Note which other patterns stack with it.\n\nAvoid generating patterns the library does not contain unless the diagnostic genuinely surfaces a gap. If the diagnostic seems to call for a new pattern, name what is novel and why the existing library does not fit.\n\n## Pattern index\n\n| Pattern | Primary trigger | Common co-stack |\n|---|---|---|\n| 1 | [Shared evidence assembly](#1-shared-evidence-assembly) | High admin burden across multiple services | Practitioner judgement, AI-assisted drafting |\n| 2 | [Continuous evidence fabric](#2-continuous-evidence-fabric) | Episodic, crisis-triggered services with rich data signals | Proactive prevention, risk-based review |\n| 3 | [Practitioner judgement model](#3-practitioner-judgement-model) | Scarce statutory professionals consumed by non-decision work | Shared evidence assembly, AI-assisted drafting |\n| 4 | [Directorate triage](#4-directorate-triage) | Multiple inconsistent front doors driving avoidable demand | One-council front door, transactional automation |\n| 5 | [Market stewardship](#5-market-stewardship) | Commissioned market with weak visibility, fragile capacity, cost pressure | Data and performance cell |\n| 6 | [Risk-based review](#6-risk-based-review) | Fixed-cadence reviews producing backlog and low-value work | Continuous evidence fabric, proactive prevention |\n| 7 | [Data and performance cell](#7-data-and-performance-cell) | Leadership cannot see demand, backlog, cost, and outcomes clearly | Almost all other patterns |\n| 8 | [Shared scheduling](#8-shared-scheduling) | Multiple teams doing visits, appointments, inspections, assessments | Practitioner judgement, market stewardship |\n| 9 | [AI-assisted drafting](#9-ai-assisted-drafting) | High document burden with clear templates and human sign-off | Practitioner judgement, shared evidence assembly |\n| 10 | [Proactive prevention](#10-proactive-prevention) | Data signals could identify risk before crisis | Continuous evidence fabric, data and performance cell |\n| 11 | [One-council front door](#11-one-council-front-door) | Residents bounced between services with no single picture | Directorate triage, shared customer contact |\n| 12 | [Transactional automation](#12-transactional-automation) | High-volume, rule-based, low-stakes work | Directorate triage, data and performance cell |\n| 13 | [Reform-resilient design](#13-reform-resilient-design) | Service in flight statutory reform | Market stewardship, practitioner judgement |\n\n---\n\n## 1. Shared evidence assembly\n\n### Operating model problem\n\nProfessionals across multiple services spend a substantial proportion of their time assembling evidence — chasing documents, requesting records, building chronologies, summarising case files, copying data between systems. The work is similar in shape across services but is duplicated by team. Practitioner time is the binding constraint, and most of it is consumed by activities that do not require professional judgement.\n\n### Trigger conditions\n\n- Multiple services report high admin burden in their pressures.\n- Practitioners report spending more than half their time on documentation rather than direct work.\n- Evidence requests cross organisational boundaries (NHS, police, partner agencies).\n- Case file assembly precedes most statutory decision points.\n- Workforce vacancies and agency spend are high; productivity gain matters.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Create a shared case preparation function — administrative or paraprofessional roles dedicated to evidence assembly, supporting multiple statutory teams. |\n| **Process** | Standardise evidence request, document upload, chronology preparation, and case file assembly across the services that draw on the function. |\n| **Technology** | Shared document management; case management integration; structured request templates. |\n| **Data and AI** | AI summarises evidence packs; identifies gaps in the evidence base; drafts chronologies from raw documents and notes; flags inconsistencies for human review. |\n| **Shared capability** | Same function can serve ASCH, CYPE, Housing, complaints, FOI, legal, and any other service that prepares case files. |\n| **Human accountability** | The statutory decision remains with the qualified professional. The function prepares; the practitioner decides. |\n\n### Risks\n\n- Quality assurance — variable evidence preparation degrades professional decisions.\n- Data protection — concentrating evidence access in one function creates a high-value target and complicated DPIA picture.\n- Professional trust — practitioners must trust the prepared pack or they will redo the work, defeating the purpose.\n- Audit trail — every gap, addition, and source must be traceable for SAR, complaint, or court use.\n\n### Worked example\n\nASCH adult needs assessment, Housing homelessness assessment, and CYPE child in need assessment all begin with evidence assembly: requesting medical records, housing history, financial information, partner agency views, and previous case history. A shared function assembles the evidence pack with AI assistance, returns it to the assessing practitioner, and tracks the requests and responses. The eligibility, threshold, or relief decision remains entirely with the qualified professional.\n\n---\n\n## 2. Continuous evidence fabric\n\n### Operating model problem\n\nServices are organised as episodes — referral, assessment, plan, review — each triggered by crisis, each producing a document, each spawning a contract, each measured by compliance with timescales. Between episodes, the service does not know what is happening to the person. Deterioration is detected at the next planned contact, which is often too late.\n\n### Trigger conditions\n\n- Service is reactive: most demand arrives in crisis state.\n- Rich data signals exist (NHS, utilities, finance, partner agencies) but are not used between episodes.\n- Outcomes data shows poor anticipation of deterioration.\n- Review cadence is fixed (e.g. annual) regardless of risk or change.\n- The service has scale (large enough to justify infrastructure investment).\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Smaller statutory casework workforce; new coordination roles managing the fabric and its alerts; redirected practitioner time to complex casework. |\n| **Process** | Replace fixed review cadence with signal-triggered contact. Statutory decision points retained but pulled from the fabric rather than scheduled. |\n| **Technology** | Data fabric integrating signals from health, utilities, housing, finance, partner agencies, and care providers (subject to lawful basis). |\n| **Data and AI** | Pattern-detection across signals; deterioration indicators; coordinating agent triggers contact through preferred channel. |\n| **Shared capability** | Most powerful where the same fabric serves ASCH, CYPE, Housing, and adult protection. The fabric is the shared layer; statutory decisions remain directorate-specific. |\n| **Human accountability** | All statutory decisions stay with the qualified professional. The fabric surfaces; the practitioner decides. |\n\n### Risks\n\n- Lawful basis — the legal basis for cross-organisational data flow is fragmented and constrained, particularly for ASCH where DEA powers do not apply.\n- Equity — pattern-based detection works best for people visible to the fabric. Those disengaged, culturally distant, or with absent signals are deprioritised by design unless consciously sought.\n- Surveillance risk — public legitimacy depends on the fabric being seen as a service, not a watcher. Communications design matters.\n- Algorithmic accountability — deterioration models must be auditable, equity-monitored, and explainable.\n\n### Worked example\n\nThe reimagined ASCH model in `services/asch.md` describes the continuous evidence fabric for adult social care. The same shape applies to CYPE early help (substantially harder because of the consent and capacity dynamics with children) and to Housing where private rented sector deterioration could be anticipated through complaint, tenancy, and housing benefit signals.\n\n---\n\n## 3. Practitioner judgement model\n\n### Operating model problem\n\nScarce statutory professionals — social workers, AMHPs, BIAs, planning officers, environmental health officers, registrars — spend the majority of their working week on activities that do not require their professional judgement: documentation, scheduling, evidence chasing, drafting, system data entry, partner liaison. The professional contribution that justifies the role is squeezed into the remaining time.\n\n### Trigger conditions\n\n- Service is actor-mandated (statute names a qualified professional).\n- Workforce vacancies, agency spend, or recruitment difficulty are reported.\n- Practitioners report low job satisfaction or describe the work as administrative.\n- Service has clear statutory decision points that justify the actor mandate.\n- Surrounding work (recording, drafting, coordination) is heavy.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Practitioner role redesigned around statutory decision-making and complex casework. New paraprofessional, administrative, and coordinating roles absorb the work that does not require the professional. |\n| **Process** | Practitioner is pulled into a case at decision points. Between decision points, the case is held by the supporting infrastructure. |\n| **Technology** | Case management systems redesigned around decision events rather than chronological case records. |\n| **Data and AI** | Pre-decision packs prepared by AI and paraprofessional review. Drafting of decision narratives from practitioner input. Standard outcome statements re-used. |\n| **Shared capability** | The supporting infrastructure (drafting, scheduling, evidence assembly) can serve every actor-mandated service across the council. |\n| **Human accountability** | The statutory decision is owned and signed off by the qualified actor. Everything else can be delegated to people, paraprofessionals, or AI. |\n\n### Risks\n\n- Role clarity — drift between the practitioner role and supporting roles must be actively managed.\n- Professional regulation — registered professions (social work, occupational therapy, planning) have CPD and accountability frameworks that shape what can be delegated.\n- Quality of supporting work — if the support is poor, the practitioner redoes it, and the model fails.\n- Career path — if the practitioner role becomes purely decision-making, the entry-level pipeline must be redesigned.\n\n### Worked example\n\nASCH adult needs assessment redesigned around the practitioner judgement model: paraprofessionals conduct the proportionate assessment conversation, AI drafts the assessment narrative, the case management system pulls the practitioner in for the eligibility determination. The practitioner spends 30 to 45 minutes on the decision and signing the plan rather than the current four to six hours per case.\n\n---\n\n## 4. Directorate triage\n\n### Operating model problem\n\nA directorate has multiple front doors — phone, online form, partner referral, walk-in, post — each routing inconsistently. Demand reaches the wrong team, gets re-routed, drops between services, or is duplicated across them. A material proportion of the demand reaching specialist teams could have been resolved earlier, somewhere else, or not at all.\n\n### Trigger conditions\n\n- Multiple entry points reported in the diagnostic.\n- High proportion of contacts re-routed between teams.\n- Specialist teams report low-value contacts they cannot easily filter.\n- Resident experience metrics show repetition and bouncing.\n- Statutory decisions are taken on contacts that should not have reached that team.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Single triage function for the directorate, staffed by trained generalists who can route across services. |\n| **Process** | All demand routes through triage. Triage applies a directorate-wide screening to identify the right pathway. |\n| **Technology** | Single intake platform with branching routes. Integration with case management systems for handoff. |\n| **Data and AI** | AI-assisted screening; pattern-detection on repeat contacts; recommendation of pathway based on stated needs. |\n| **Shared capability** | The triage layer can be shared across directorates (especially ASCH and CYPE, which share many contacts). |\n| **Human accountability** | The statutory decision (eligibility, threshold) remains with the receiving service. Triage routes; it does not decide. |\n\n### Risks\n\n- Triage threshold — set wrongly, the function either lets too much through (defeating the purpose) or filters too hard (creating gateway risk).\n- Equity — triage is where bias risks concentrate; equity monitoring of outcomes by demographic is essential.\n- Workforce — triage is harder than it looks; the function needs experienced staff and good supervision.\n- Integration cost — handoff between triage and specialist teams introduces friction unless the technology is well-designed.\n\n### Worked example\n\nASCH first contact team consolidates calls from the public, partner agencies, hospital discharge teams, and self-referrals. The team applies a directorate-wide screening, routing to assessment, signposting, safeguarding, or community services. AI surfaces previous contact history, partner agency views, and suggested pathway for the triage worker.\n\n---\n\n## 5. Market stewardship\n\n### Operating model problem\n\nA significant proportion of council spend is commissioned to a fragile market — care, placements, temporary accommodation, waste, leisure, regulatory services. The council buys services through fixed contracts, with limited visibility of capacity, quality, and provider health between procurement cycles. Provider failure surprises the council. Cost rises faster than budget.\n\n### Trigger conditions\n\n- Service has substantial commissioned spend (typically >£10m annually for the directorate).\n- Provider market is fragile, capacity-constrained, or politically sensitive.\n- Procurement cycles are infrequent (multi-year contracts).\n- Quality data is patchy or lagging.\n- Provider failure has occurred or is plausibly imminent.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Commissioning role redesigned from contract administration to market analysis. Provider relationship managers added. |\n| **Process** | Continuous data flow between commissioner and provider replaces episodic contract review. Market interventions (capacity development, quality improvement, exit support) are planned actions, not surprises. |\n| **Technology** | Provider data platform receiving capacity, quality, financial, and workforce signals. Market intelligence dashboards. |\n| **Data and AI** | Predictive provider failure models; capacity forecasting; cost analytics; quality signal detection from CQC, complaints, and operational data. |\n| **Shared capability** | Same shape applies across ASCH provider markets, CYPE placements, Housing temporary accommodation, and Place commissioned services. |\n| **Human accountability** | Commissioning decisions, market interventions, and provider exit are managerial and political judgements — supported by data, made by humans. |\n\n### Risks\n\n- Provider trust — providers will only share data if the relationship is collaborative; punitive use of data destroys it.\n- Information governance — provider data may include service user data that is governed by the same constraints as the council's own.\n- Market concentration — better market intelligence does not automatically produce a more diverse market; intervention is required.\n- Cost — building the data platform and the analyst capability is a real investment with a long payback.\n\n### Worked example\n\nASCH homecare commissioning redesigned around market stewardship: live capacity feed from providers, quality signals from CQC and complaints, financial health monitoring, predictive modelling for provider failure. The commissioning team intervenes early on capacity gaps and works with at-risk providers before crisis.\n\n---\n\n## 6. Risk-based review\n\n### Operating model problem\n\nReviews are scheduled at fixed cadence — annual, biennial, statutory-driven — regardless of whether anything has changed. Most reviews find no significant change and consume practitioner time without value. The few cases where significant change has occurred between scheduled reviews are not detected until the next contact, which may be too late.\n\n### Trigger conditions\n\n- Service has fixed review cadence (e.g. annual care plan reviews, fostering reviews, EHCP reviews).\n- Most reviews record no significant change.\n- Backlog of overdue reviews exists.\n- Some cases deteriorate between reviews and are detected late.\n- Data signals exist that could indicate change.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Practitioner time redirected from low-change reviews to deeper engagement with high-change cases. |\n| **Process** | Reviews triggered by signal change, not by date. Light-touch confirmatory reviews for stable cases. |\n| **Technology** | Signal monitoring; review trigger logic; case management integration. |\n| **Data and AI** | Pattern-detection on signals indicating change. AI summarises signal evidence for the practitioner. Standard light-touch confirmation by self-service or paraprofessional contact. |\n| **Shared capability** | Same shape for ASCH care plan reviews, CYPE looked-after-children reviews, Housing tenancy reviews, EHCP reviews. |\n| **Human accountability** | Review decisions and statutory plan updates remain with the qualified professional. The signal triggers; the practitioner reviews. |\n\n### Risks\n\n- Statutory compliance — many reviews are statutorily mandated at minimum frequencies (e.g. LAC reviews). The pattern accelerates *additional* reviews and lightens *some* reviews; it cannot remove the statutory minimum.\n- Signal coverage — cases not visible to the signal layer fall back to fixed cadence, which must be retained as a floor.\n- Practitioner trust — practitioners must trust the signal trigger or they will revert to fixed cadence to be safe.\n- Equity — same data-coverage equity concern as continuous evidence fabric.\n\n### Worked example\n\nASCH care plan reviews redesigned around risk-based review: stable cases receive a light-touch annual confirmation; cases with signal change (rising arrears, missed appointments, carer overload, hospital contact) trigger an early full review. Practitioner time concentrates on the change-detected cases.\n\n---\n\n## 7. Data and performance cell\n\n### Operating model problem\n\nLeadership cannot see — accurately, currently, or comparably — what is happening across the directorate or the service. Demand, backlog, cost, outcomes, and quality are reported in silos, on different cycles, in incompatible formats. Operational decisions are made on lagging or partial data. Strategic decisions are made on consultancy reports.\n\n### Trigger conditions\n\n- Leadership reports difficulty getting a current picture.\n- Reporting is heavily manual.\n- Multiple performance teams across services, none cross-cutting.\n- Data reaches leadership through monthly or quarterly reports.\n- Decisions are made on instinct because the data is not available in time.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Cross-cutting data and performance function reporting to the directorate or chief executive — analysts, data engineers, BI specialists. |\n| **Process** | Single source of truth for directorate KPIs. Real-time or near-real-time dashboards replacing monthly reports. Targeted deep-dives on demand. |\n| **Technology** | Data platform integrating case management, finance, HR, partner data. BI tooling on top. |\n| **Data and AI** | Standard KPIs across services; cohort analytics; outcome attribution; AI-summarised narrative reports for leadership. |\n| **Shared capability** | This is itself a shared capability — one cell serving the directorate or the council, not one per service. |\n| **Human accountability** | Strategic and operational decisions remain with leadership. The cell informs; it does not decide. |\n\n### Risks\n\n- Data quality — without source-system data quality work, the dashboards lie faster.\n- Politicisation — KPI design embeds judgements about what matters; transparent KPI governance matters.\n- Capability — analyst capability is scarce and competed-for nationally; recruitment and retention need active investment.\n- Tooling sprawl — councils typically have multiple BI tools accreted over years; consolidation is part of the work.\n\n### Worked example\n\nA council establishes a directorate-level data and performance cell for ASCH, replacing three separate service-level performance teams. The cell publishes a single weekly directorate dashboard, runs cohort analytics on hospital discharge outcomes, and supports the commissioning team with market analytics.\n\n---\n\n## 8. Shared scheduling\n\n### Operating model problem\n\nMultiple teams across the council undertake similar field activities — visits, appointments, inspections, assessments — each with their own scheduling, their own routing, their own utilisation rate. Field staff drive past each other to overlapping locations. Capacity is unevenly used. Resident experience is multiple disconnected appointments.\n\n### Trigger conditions\n\n- Multiple teams undertake field visits.\n- Travel time is reported as a substantial proportion of the working day.\n- Utilisation varies significantly across teams.\n- Residents report multiple appointments for related issues.\n- Data exists on appointment outcomes but is not used to optimise routing.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Scheduling consolidated into a shared function. Field staff remain in service teams but their diaries are managed centrally. |\n| **Process** | Standard appointment booking, routing, and confirmation across services. Joint visits where appropriate. |\n| **Technology** | Shared scheduling platform integrated with case management. Mobile-first field-staff interface. |\n| **Data and AI** | Routing optimisation; capacity forecasting; appointment-outcome learning to refine durations. |\n| **Shared capability** | Single scheduling layer across ASCH visits, OT visits, social work visits, Housing inspections, environmental health inspections, and trading standards visits. |\n| **Human accountability** | Field workers remain accountable for what happens at the visit. Scheduling routes them; it does not decide what they do. |\n\n### Risks\n\n- Service identity — teams resist losing scheduling control because it is part of how they manage their work.\n- Joint visits — politically and practically harder than they look (different statutory frames, different consent, different professional cultures).\n- IT integration cost — case management systems are not built for shared scheduling and require integration work.\n- Field staff experience — central scheduling can feel like surveillance; the design must respect professional autonomy.\n\n### Worked example\n\nA council consolidates scheduling across ASCH, OT, mental health social work, and Housing inspections. Field staff retain professional discretion at the visit; routing is centrally optimised. Travel time falls; utilisation rises; some joint visits where statutory frames allow.\n\n---\n\n## 9. AI-assisted drafting\n\n### Operating model problem\n\nPractitioners spend a substantial proportion of their time drafting documents — assessment narratives, decision letters, court statements, complaint responses, reports, plans. The drafts follow recognisable templates, draw on standard phrasing, and require professional judgement only at specific decision points. Without assistance, drafting consumes hours per case.\n\n### Trigger conditions\n\n- High document burden reported.\n- Documents follow recognisable templates.\n- Standard phrasing recurs across cases.\n- Final document requires professional sign-off.\n- Practitioners report drafting time as a primary frustration.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Practitioner time freed from drafting, redirected to direct work. |\n| **Process** | Practitioner provides structured input (key facts, judgement, decision); AI drafts the document; practitioner reviews and signs. |\n| **Technology** | AI drafting integrated with case management. Template library. Sign-off workflow. |\n| **Data and AI** | LLM with appropriate guardrails. Re-use of standard outcome statements. Tone consistency. Personalisation from case context. |\n| **Shared capability** | Same drafting capability across ASCH assessments, CYPE case records, homelessness decisions, EHCPs, planning decision letters, complaint responses, FOI responses. |\n| **Human accountability** | The practitioner reads, edits, and signs. The signed document is the practitioner's own; the AI is a drafting aid. |\n\n### Risks\n\n- Quality drift — practitioner over-reliance can erode professional drafting skill over time. Training and supervision must adapt.\n- Hallucination — AI-drafted facts must be grounded in case data, not invented. Citation discipline is essential.\n- Tone — generated text must reflect the council's voice, not generic AI tone. Style guidance is part of the configuration.\n- Recipient experience — recipients of AI-drafted letters care that they are read and signed by a human. Transparency about the drafting process is sometimes required.\n\n### Worked example\n\nCare Act assessment narratives drafted by AI from practitioner notes and structured assessment data. The practitioner reviews, edits, and signs. Drafting time per assessment falls from 90 minutes to 15.\n\n---\n\n## 10. Proactive prevention\n\n### Operating model problem\n\nMost council services are reactive: they engage when crisis arrives. Data signals — held by the council, partners, or accessible through DEA powers — could identify risk before crisis. The signals are not used because the data is not joined, the consent or lawful basis is unclear, the service has no capacity to act on prevention, or the political and ethical questions have not been worked through.\n\n### Trigger conditions\n\n- Service is dominantly reactive.\n- Crisis presentation is a substantial cost driver.\n- Data signals exist that correlate with deterioration.\n- Some kind of preventative action is plausible (early help, advice, light-touch contact, adjustment of provision).\n- Political and ethical climate supports preventative engagement.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | New preventative engagement roles. Existing reactive roles become more specialist. |\n| **Process** | Signal-triggered contact precedes crisis presentation. Contact tone is supportive, not investigative. |\n| **Technology** | Signal-aggregation platform with appropriate lawful basis. Contact channel matched to person preference. |\n| **Data and AI** | Pattern-detection. Bias and equity monitoring. Explainable triggers. |\n| **Shared capability** | Strongest where signals span directorates — ASCH, CYPE, Housing all benefit from common signal infrastructure. |\n| **Human accountability** | The decision to engage, the tone of engagement, and any service offered remain human. The signal triggers; people respond. |\n\n### Risks\n\n- Lawful basis — particularly fragile in ASCH (DEA exclusion) and in family contexts.\n- Equity — signals are unevenly distributed; people invisible to the signal layer are deprioritised by design.\n- Public legitimacy — proactive contact is welcome from a service, intrusive from an authority. Communications design and consent management determine which.\n- Capacity to act — if the council has no preventative offer, identifying need but doing nothing is worse than not identifying it. The model requires the offer to exist.\n\n### Worked example\n\nCouncil combines housing benefit, council tax, complaints, and (with consent) social care signals to identify households at rising risk of homelessness. Housing options team makes a supportive contact early, offering advice and signposting. A proportion of households resolve without needing the homelessness service. Lawful basis is DEA public service delivery.\n\n---\n\n## 11. One-council front door\n\n### Operating model problem\n\nResidents dealing with complex situations interact with multiple parts of the council that do not visibly know about each other, each asking for information the others already have. The citizen experiences fragmentation; the council experiences duplication. The legal and operational separation between services is invisible to the resident and irrelevant to their need.\n\n### Trigger conditions\n\n- Residents report repetition and bouncing in feedback.\n- Multiple services touch the same household.\n- Customer-contact teams cannot see across service systems.\n- Service-level satisfaction is acceptable but overall council perception is poor.\n- The council has political appetite for citizen-facing integration.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Customer-contact and digital teams gain cross-service visibility. Service teams retain their own statutory work but operate behind a unified front. |\n| **Process** | Single citizen identity. Single point of contact for cross-service issues. Joint case coordination where multiple services apply. |\n| **Technology** | Citizen identity layer. Cross-service customer record (subject to lawful basis). Digital channels integrated. |\n| **Data and AI** | Shared view of touchpoints. AI identifies cross-service relevance and routes accordingly. |\n| **Shared capability** | This is the shared capability — the citizen-facing fabric is one. |\n| **Human accountability** | Statutory accountability stays distinct (each service decides its own statutory questions). The unification is in the citizen experience, not in the decisions. |\n\n### Risks\n\n- Information governance — cross-service records are governed by separate legal bases and consent regimes. Integration must respect this.\n- Service identity — services resist being subsumed into a generic council voice; the design must protect their professional identity where it matters.\n- Cost — citizen identity layers, cross-service records, and digital integration are substantial investments.\n- Equity — digital-first integration risks excluding people without digital access; non-digital channels must remain.\n\n### Worked example\n\nA council establishes a single sign-in for residents covering housing benefit, council tax, social care self-assessment, complaints, and FOI. Cross-service touchpoints are visible to customer-contact staff. Residents report fewer repeat conversations.\n\n---\n\n## 12. Transactional automation\n\n### Operating model problem\n\nA category of work is high-volume, rule-based, low-stakes, and well-understood — revenues, benefits, allocations, parking, library transactions, licensing, registration. The work is structurally suitable for full automation but is often delivered by large operational teams using legacy systems. Productivity gain is substantial and the route to deployment is well-understood.\n\n### Trigger conditions\n\n- High volume.\n- Rules are well-defined and rarely require judgement.\n- Stakes per transaction are low.\n- Errors are recoverable.\n- Existing staff are doing work the system could do.\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Operational team reduces to exception handling, complex cases, and customer support. Some redeploy
