ment to higher-judgement work elsewhere in the council. |\n| **Process** | Standard cases flow through automation end-to-end. Exceptions route to humans. Customer-facing channels remain. |\n| **Technology** | Automation platform (RPA, low-code, workflow engine) integrated with the system of record. |\n| **Data and AI** | Rule engine for the standard path. AI for edge cases (intent detection, document understanding, anomaly detection). |\n| **Shared capability** | Same shape across revenues, benefits, allocations, licensing, registration, library, and any other rule-based service. |\n| **Human accountability** | Automated decisions remain auditable, explainable, and challengeable. Standard cases flow without human review; exceptions are escalated to humans. |\n\n### Risks\n\n- Edge cases — the long tail of unusual cases is bigger than the rule design assumes; ongoing rule maintenance is required.\n- Exception escalation — the residual human team must handle everything the automation cannot, which is often the hardest work.\n- Customer experience — automation that gets simple things wrong is more frustrating than human service; the bar for accuracy is high.\n- Workforce — the redeployment plan is the hardest part; without it, automation generates resistance, not productivity.\n\n### Worked example\n\nCouncil tax single person discount automated end-to-end: digital application, rule check against electoral roll and council tax data, auto-decision, auto-confirmation, audit trail. Existing single-person discount team redeployed to council tax recovery and exception handling.\n\n---\n\n## 13. Reform-resilient design\n\n### Operating model problem\n\nService is in flight statutory reform — SEND restructure, Renters' Rights commencement, Casey Commission outputs, local government reorganisation. Investment made now must remain useful through the reform. Designs closely coupled to current statutory forms (current EHCP, current AST, current Better Care Fund grant conditions) will be obsolete within the project lifetime.\n\n### Trigger conditions\n\n- Service is named in a current Act, white paper, or commission.\n- Reform timeline overlaps with the proposed investment.\n- Current statutory forms are likely to change.\n- Reform direction is reasonably clear (even if specific details are not).\n\n### Pattern shape\n\n| Dimension | Change |\n|---|---|\n| **People** | Workforce designed around the function (assess, support, decide, review) rather than the current form (EHCP, AST, BCF). |\n| **Process** | Process shape modular: each statutory step is a clearly bounded unit that can be replaced when the statute changes. |\n| **Technology** | Configurable systems that allow form changes without code changes. Data structures that survive nomenclature shifts. |\n| **Data and AI** | Mappings between current and likely-future statutory forms documented and tested. |\n| **Shared capability** | Reform-resilient design is itself a capability the council develops once and applies across reforming services. |\n| **Human accountability** | Statutory professionals retain their decision authority; the support layer adapts to whichever statutory form is in force. |\n\n### Risks\n\n- Premature design — designing for reform that does not happen, or happens differently, wastes effort.\n- Underdesign — designing for current forms only, then having to redo when reform lands.\n- Modelling assumptions — the reform direction is rarely fully clear; assumptions must be transparent and revisable.\n- Sequencing — service investment and reform implementation must align; mismatched sequencing produces stranded systems.\n\n### Worked example\n\nA council designing an EHCP case management system in 2026 builds it around the function (assess, plan, review) with configurable forms, anticipating the 2029 SEND reforms. When ISPs replace EHCPs, the system reconfigures rather than rebuilds.\n\n---\n\n## How patterns combine\n\nPatterns rarely apply alone. Common stacks:\n\n- **The continuous-presence stack**: Continuous evidence fabric + Risk-based review + Practitioner judgement model + Proactive prevention + Data and performance cell. The reimagined ASCH model.\n- **The high-volume stack**: Transactional automation + Directorate triage + Data and performance cell. Revenues, benefits, licensing, registration.\n- **The complex-casework stack**: Practitioner judgement model + Shared evidence assembly + AI-assisted drafting. Statutory casework.\n- **The market stack**: Market stewardship + Data and performance cell + Risk-based review. Commissioned services.\n- **The citizen stack**: One-council front door + Directorate triage + Shared customer contact + Transactional automation. The customer experience layer.\n\nWhen recommending a stack, surface that it is a stack — name each pattern, name what it brings, and name the sequencing. Stacks built without sequencing usually fail because the technology dependencies between patterns are not sequenced correctly.\n\n## What is not in this library\n\n- **Vendor or product recommendations.** Patterns describe shapes, not specific tools.\n- **Cost estimates.** Cost depends on council scale, existing infrastructure, and procurement context.\n- **Sequencing for a specific council.** Patterns describe destinations; the journey is bespoke.\n- **Brand-new patterns.** If the diagnostic surfaces something the library does not contain, name what is novel and propose adding it back to the library.\n","reform-context.md":"# Current reform context\n\nThe reform environment shaping English local government in 2026. Three forces — financial compression, structural reform, and directorate-specific reform waves — operate in parallel. Any operating model conversation needs to touch at least one. This file gives the specifics: what each piece of legislation does, when it commences, and which services are affected.\n\nThe information in this file has a half-life. Statutory commencement dates change; consultation outcomes shift; new white papers land. Treat this file as orientation, not as a substitute for current government sources. Where commencement dates matter operationally, verify against legislation.gov.uk, departmental announcements, or council legal advice.\n\n## 1. Financial compression\n\n### What it is\n\nSustained real-terms pressure on council finances combining:\n\n- A decade of central grant reduction in real terms.\n- Rising demand in adult social care, children's services, and temporary accommodation.\n- Council tax cap dynamics that constrain own-source revenue growth.\n- The 2026/27 settlement consolidating ring-fenced grants (Market Sustainability and Improvement Fund, Social Care Grant) into the revenue support grant — greater flexibility, greater responsibility for allocation.\n\n### How it shows up in services\n\n- A number of councils are under Section 114 notices or equivalent commissioner oversight.\n- Discretionary services (early help, prevention, leisure, libraries) face cuts ahead of statutory services.\n- The discretionary wrapper around statutory cores narrows. Reablement, prevention, supported housing, family support all compress.\n- Commissioning becomes more cost-led; provider markets feel the pressure first.\n- Workforce pressure: vacancies, agency spend, recruitment difficulty.\n- Audit qualifications and Best Value concerns rise.\n\n### Implications for operating model work\n\n- Any recommendation must be honest about its cost profile. \"Save money first, then invest\" is the typical sequencing demand.\n- Productivity gains that release practitioner time are easier to fund than gains that require new infrastructure.\n- The discretionary wrapper is where design choice has the most room — and where financial compression bites first.\n- LGR areas have a one-off opportunity to redesign at vesting day; non-LGR areas have to redesign in flight.\n\n## 2. Structural reform: local government reorganisation\n\n### What it is\n\nThe English Devolution White Paper (December 2024) and the ensuing programme of local government reorganisation (LGR) progressively replacing two-tier county and district structures with unitary authorities across 21 areas.\n\n### Timeline\n\n| Date | Event |\n|---|---|\n| April 2027 | Surrey's two new unitary councils begin operation |\n| April 2028 (target) | Most other reorganisation areas vesting day |\n| 2026–2028 | Concurrent design, consultation, and transition for reorganising areas |\n\nIn parallel, mayoral strategic authorities are being established across much of England, creating a regional tier of governance for transport, skills, economic development, and (in some cases) housing.\n\n### How it shows up\n\n- Reorganising councils run business-as-usual while merging finance systems, harmonising policies, novating contracts, and designing the successor operating model.\n- The successor unitary often consolidates services that were split between districts and the county — housing, planning, environmental health, waste join with ASCH, CYPE, and highways.\n- IT integration and data migration are major workstreams.\n- Workforce harmonisation, terms and conditions, and TUPE create programme risk.\n- Brand, identity, member structures, governance arrangements all need redesign.\n\n### Implications for operating model work\n\n- For councils inside reorganisation areas: vesting day is a one-off chance to design the operating model from a clean slate. Investment decisions need to be on the right side of the vesting line.\n- For councils outside reorganisation areas: the comparator group is shifting. Demonstrate sustainable unitary performance against the reorganised cohort.\n- For LGR programmes: operating model work runs alongside (not after) the technical merger work. The risk is that the merger consumes the bandwidth and the operating model design defaults to the largest predecessor's pattern.\n\n## 3. Directorate-specific reform waves\n\nThe reform calendar in 2026/27 is unusually intense. Each directorate has at least one major piece of in-flight reform.\n\n### 3.1 Children's Wellbeing and Schools Act 2025\n\n**Status:** Royal Assent received; commencement staged through 2026 and 2027.\n\n**Key duties:**\n\n- **Family group decision-making.** New duty on local authorities to offer family group decision-making to families before initiating care proceedings, where appropriate.\n- **Multi-agency child protection arrangements.** Strengthened duties on local authorities, integrated care boards, and police to work together; new statutory framework for multi-agency child protection teams.\n- **Single unique identifier for children.** A consistent identifier across services — health, education, social care — to enable better information sharing.\n- **Staying close support to age 25.** Extended duty to provide accommodation-related support to care leavers.\n- **Children-not-in-school register.** New duty for local authorities to maintain a register of children not in school.\n\n**Services affected:** Most CYPE services, particularly child protection, looked-after children, care leavers, and education attendance.\n\n**Implications:** Information-sharing infrastructure and case management redesign. The single unique identifier is a multi-year integration project.\n\n### 3.2 Schools White Paper — SEND reform (February 2026)\n\n**Status:** White Paper published February 2026; consultation through May 2026; legislation expected 2027–2028; implementation from 2029.\n\n**Key proposals:**\n\n- **Individual Support Plans (ISPs)** replace EHCPs in most cases — a less formal plan with broader cohort coverage.\n- **Specialist Provision Packages (SPPs)** for the highest-needs cohort — a more focused statutory plan.\n- **Four-tier model** of SEND support: Universal, Targeted, Targeted Plus, Specialist.\n- **No changes to existing EHCPs before September 2030** — transition arrangements protect current plans.\n\n**Services affected:** EHCP needs assessment; school admissions for SEND; home-to-school transport (eligibility criteria likely to change); virtual school for looked-after children with SEND; commissioning of specialist provision.\n\n**Implications:** EHCP-coupled investments in 2026/27 must be reform-resilient. See `patterns.md` pattern 13. The high-needs block deficit (~£6 billion nationally projected by March 2026) is the financial driver behind reform.\n\n### 3.3 Renters' Rights Act 2025\n\n**Status:** Royal Assent 2025; investigatory and enforcement duties for local housing authorities in force from 27 December 2025; main tenancy provisions commence 1 May 2026.\n\n**Key provisions:**\n\n- **Section 21 (\"no fault\") evictions abolished.**\n- **Periodic tenancies replace assured shorthold tenancies (ASTs).**\n- **New decent homes standard** applied to private rented sector.\n- **Awaab's Law extended** to private rented sector.\n- **PRS database (Property Portal)** establishing a national register of private landlords and properties.\n- **PRS Ombudsman** for tenant complaints against landlords.\n- **New investigatory and enforcement powers** for local housing authorities.\n\n**Services affected:** Private sector housing enforcement; HMO licensing; housing advice and options; homelessness prevention (changes to eviction patterns).\n\n**Implications:** Substantial increase in workload for private sector housing teams. New data infrastructure (the Property Portal). Operational design needed for the new PRS Ombudsman interface. Awaab's Law compliance regime extension.\n\n### 3.4 Awaab's Law (in force for social landlords)\n\n**Status:** Already in force for social landlords; extension to private rented sector under the Renters' Rights Act 2025.\n\n**What it does:** Sets statutory time limits for social landlords to investigate and remedy hazards (particularly damp and mould). Named after Awaab Ishak, who died from prolonged exposure to mould in his family's social housing.\n\n**Services affected:** HRA tenancy management; responsive repairs; planned maintenance and capital works.\n\n**Implications:** Repairs services must operate against statutory clocks for hazard investigation and remedy. Case management, contractor coordination, and communication with tenants must be structured around the statutory timescales.\n\n### 3.5 Casey Commission on Adult Social Care\n\n**Status:** Commission established 2024; medium-term recommendations expected during 2026; longer-term recommendations expected 2028.\n\n**Likely scope:** Funding model for adult social care; workforce reform; integration with NHS; market regulation; carer support; means test reform.\n\n**Services affected:** All ASCH services, particularly assessment, eligibility, charging, commissioning, and the NHS interface.\n\n**Implications:** Major operating model implications expected from 2028. ASCH investment decisions in 2026 and 2027 should anticipate reform direction without committing to specifics. Some of the reimagined ASCH model in `services/asch.md` reflects directional bets on Casey-aligned reforms.\n\n### 3.6 Building Safety Act 2022 (continuing implementation)\n\n**Status:** Royal Assent 2022; implementation continuing through 2026.\n\n**Key provisions:**\n\n- **Building Safety Regulator** at the Health and Safety Executive.\n- **Higher-risk buildings regime** for residential buildings 18 metres or seven storeys and above.\n- **Accountable person** and **principal accountable person** duties.\n- **Reform of building control** including competition with approved inspectors.\n- **Building Safety Manager role** and resident engagement requirements.\n\n**Services affected:** Building control; HRA stock management; tall building tenancy management; planning (interface with the gateway regime).\n\n**Implications:** Building control faces material competition pressure. HRA landlord teams operating tall buildings have new duties.\n\n### 3.7 Procurement Act 2023 (in force February 2025)\n\n**Status:** Replaced the Public Contracts Regulations 2015 from February 2025.\n\n**Key changes:**\n\n- **Simpler procurement procedures** with greater flexibility.\n- **Central debarment list** replacing previous exclusion grounds.\n- **Modified open procedure and competitive flexible procedure** as primary routes.\n- **Stronger focus on social value and SME participation.**\n- **Procurement Pathway** as the standard approach.\n\n**Services affected:** All commissioned services across the council; corporate procurement; legal services.\n\n**Implications:** Procurement process redesign. Contract documentation standards updated. Provider market engagement patterns shifted.\n\n### 3.8 Other reforms in flight\n\n- **Fair Funding simplification** landing in 2026/27 — overhaul of the local government finance settlement formula.\n- **Devolution Bill** — extension of mayoral strategic authorities; new powers; potential for further LGR.\n- **NHS reform** — ICS development; primary care reform; community services; all affecting the ASCH-NHS interface.\n- **Welfare reform** — Universal Credit transition; PIP review; impact on revenues and benefits caseload.\n- **Court reform** — backlog and capacity affecting child protection, homelessness review, and SEND tribunals.\n\n## 4. The reform calendar pattern\n\nReading across the reform wave, four practical implications:\n\n### 4.1 Designs must be reform-resilient\n\nInvestment decisions in 2026 and 2027 must be robust to reform-driven change in the underlying service. Designs closely coupled to a specific statutory form (the current EHCP, the current AST, the current Better Care Fund grant conditions) will be obsolete within the lifetime of the project. See `patterns.md` pattern 13 (Reform-resilient design).\n\n### 4.2 Information-sharing infrastructure is the dominant common requirement\n\nFamily group decision-making, multi-agency child protection arrangements, single unique identifier, NHS interface, PRS database, building safety occupant data — all require information to flow across organisational boundaries with appropriate lawful basis. Councils that invest in information-sharing governance (DPIAs, ISAs, common identifiers, consent management) move faster than those that do not.\n\n### 4.3 LGR is a multiplier on reform pressure\n\nCouncils inside reorganisation areas face every reform on top of vesting-day work. Sequencing matters — a service should not be in the middle of reform implementation at vesting day. This is a real operational constraint on transformation timing.\n\n### 4.4 The reform direction is clearer than the reform detail\n\nMost current reforms have a clear direction (more multi-agency working, less episodic service, more data-driven prevention, more market regulation) but uncertain detail. Operating model design should follow the direction without committing to detail that may shift.\n\n## 5. How to use this file in conversation\n\nWhen discussing operating model work for a service:\n\n- **Identify the relevant reforms.** Cross-reference the service against the legislation in this file.\n- **Surface the timeline.** Reforms that commence within the project lifetime are constraints. Reforms that commence after the project's normal payback are influences but not constraints.\n- **Surface the direction.** Even where detail is unclear, the direction often is. Designs aligned with direction survive; designs in tension with direction risk obsolescence.\n- **Be honest about uncertainty.** The reform calendar is not a forecast. Some reforms slip. Some accelerate. Some change scope after consultation. Surface this rather than presenting reform timelines as fixed.\n\n## 6. What this file does not contain\n\n- **Live commencement status.** Commencement dates are dates from this skill's authoring; check legislation.gov.uk for live status.\n- **Detailed legal analysis.** This file identifies the legislation; legal advice on application to a specific case is for council legal services.\n- **Localised reform impact.** Some reforms affect specific councils more than others (LGR areas, councils with high tall-building exposure, councils with large care leaver populations). Council adapters should overlay local impact where material.\n- **Reform proposals not yet legislated.** Where a white paper has been published but legislation has not been laid, the file flags it as proposed rather than as current law. Do not treat consultations or white papers as binding.\n","services/asch.md":"# Adult Social Care and Health — services reference\n\nThe largest single area of council spending in most upper-tier and unitary authorities, and typically the most politically exposed. The Care Act 2014 consolidated adult social care law into a single statute with an explicit wellbeing principle, outcome-mandated duties to meet eligible needs, and a market-shaping duty. Public health transferred from the NHS to local authorities in 2013 under the Health and Social Care Act 2012. The Casey Commission on Adult Social Care is in flight and expected to reshape parts of the operating model from 2028 onwards.\n\nThree structural features dominate the directorate: a very large commissioned provider market (home care, residential, nursing, specialist); a statutory interface with the NHS around hospital discharge, intermediate care, continuing healthcare, and safeguarding; and high-volume, high-complexity individual casework against tight statutory timescales.\n\n## Table of contents\n\n| § | Service | Agentic classification |\n|---|---|---|\n| 1 | Adult safeguarding | Human-in-the-loop |\n| 2 | Adult needs assessment | Human-in-the-loop |\n| 3 | Care planning and personal budgets | Human-in-the-loop |\n| 4 | Direct payments administration | Human-in-the-loop, with fully-agentic sub-processes |\n| 5 | Reablement and intermediate care | Human-in-the-loop |\n| 6 | Homecare commissioning | Human-in-the-loop |\n| 7 | Residential and nursing care commissioning | Human-in-the-loop |\n| 8 | Deprivation of Liberty Safeguards | Human-in-the-loop |\n| 9 | Mental capacity and best interests | AI-assisted |\n| 10 | Learning disability and autism services | Human-in-the-loop |\n| 11 | Mental health social work (s75 arrangements) | Human-in-the-loop |\n| 12 | Occupational therapy and community equipment | Human-in-the-loop, with fully-agentic potential for self-service equipment |\n| 13 | Public health commissioning | Human-in-the-loop |\n| 14 | Sexual health services | Human-in-the-loop, with fully-agentic sub-processes |\n| 15 | Substance misuse and drug and alcohol services | Human-in-the-loop |\n| 16 | 0–19 public health services (health visiting and school nursing) | Human-in-the-loop |\n\nCross-cutting themes and reimagined operating model are at the end of this file.\n\n---\n\n## 1. Adult safeguarding\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Actor-mandated • Process-mandated • Outcome-mandated |\n| **Headline pressures** | s42 triage backlog • Threshold variability • NHS duplication • SAB capacity |\n| **Headline opportunities** | AI case recording • Triage dashboards • Predictive provider failure |\n\n*Protecting adults at risk from abuse and neglect.*\n\n### How it works\n\nConcerns reach the council from care providers, NHS, police, family, and the public — often through a single adult social care front door. A duty team screens each contact against the s42 threshold: whether the adult has care needs, is experiencing or at risk of abuse or neglect, and cannot protect themselves. Where the threshold is met, the council causes a s42 enquiry to be made, led by a safeguarding-trained social worker, usually working with partners. The enquiry concludes with a decision on what action is necessary to protect the adult, informed by what the adult wanted as outcomes.\n\n### Legal basis\n\nCare Act 2014 ss42–47 (enquiry duty, Safeguarding Adults Boards, Safeguarding Adults Reviews); Mental Capacity Act 2005; Care and Support Statutory Guidance chapter 14.\n\n### Guardrails\n\nStatutory duty. Actor-mandated (the s42 enquiry must be caused to be made by a qualified professional). Process-mandated (the enquiry process, involvement of the adult, Making Safeguarding Personal). Outcome-mandated (the duty is to decide what action is necessary to protect the adult). Timescale norms set locally but benchmarked against ADASS guidance.\n\n### Demand drivers\n\nSelf-neglect cases (rising); financial abuse in the cost-of-living context; care home concerns; domestic abuse in older people; contractual provider failures; discharges to home where capacity is uncertain.\n\n### Pressures\n\nBacklog of s42 decisions at triage. Variability in threshold application. Duplication with NHS safeguarding. Strength and staff stability of the Safeguarding Adults Board. Quality of Safeguarding Adults Review learning loops.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted case recording, automated SAR evidence assembly, standardised risk-screening prompts on case management systems.\n- **Workflows**: structured partner referral forms, real-time information sharing with police and NHS, triage dashboards.\n- **Data**: predictive indicators for provider failure, cohort analysis of repeat referrals, thematic extraction from closed enquiries to feed the SAB.\n\n### Agentic future\n\nHuman-in-the-loop. The s42 enquiry decision cannot be automated; it is a professional judgement for the safeguarding lead. Agentic value concentrates in triage, evidence gathering across systems, narrative summarisation for SAR panels, and tracking partner agency responses to referrals. Never fully agentic.\n\n---\n\n## 2. Adult needs assessment\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Actor-mandated • Process-mandated • Outcome-mandated |\n| **Headline pressures** | Assessment waiting lists • Carer assessment under-delivery • Eligibility variability • Workforce vacancies |\n| **Headline opportunities** | AI-drafted narratives • Online self-assessment with triage • Demand forecasting |\n\n*Assessing whether an adult has needs for care and support that the council should meet.*\n\n### How it works\n\nPeople approach the council by self-referral, carer referral, or referral from NHS colleagues (particularly hospital discharge teams), GPs, housing, and police. A first contact team screens against eligibility indicators and routes to the right pathway — community, hospital, mental health, learning disability, or transitions. A qualified practitioner, typically a social worker or occupational therapist, conducts a proportionate assessment of the adult's needs and the impact on wellbeing, with family and carers involved. The assessment concludes with an eligibility decision and, where eligible, a care and support plan with a personal budget.\n\n### Legal basis\n\nCare Act 2014 ss9–13 (needs and carer's assessments); Care and Support (Eligibility Criteria) Regulations 2014; Care and Support Statutory Guidance chapters 6 and 10.\n\n### Guardrails\n\nStatutory duty. Actor-mandated (a person with appropriate skills and competence). Process-mandated (proportionate assessment process, involvement of the adult and carer). Outcome-mandated (a decision on eligibility and a care and support plan where eligible). Not timescale-specific in statute but operationally bound by waiting lists.\n\n### Demand drivers\n\nAgeing population; hospital discharge pathway 1 and 2 volumes; self-referrals; carer breakdown; learning disability transitions from children's services; rising working-age physical and mental health disability.\n\n### Pressures\n\nAssessment waiting lists. Carer assessment under-delivery against statutory duty. Variability in eligibility decisions. Operational cost of face-to-face assessment against volume. Workforce vacancies and agency spend.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted assessment narratives from conversational notes; automated strengths-based prompts; structured templates that reduce rework.\n- **Workflows**: online self-assessment with triage routing to the proportionate pathway; digital pre-assessment information capture; carer self-identification forms.\n- **Data**: demand forecasting by cohort and referral source; equity monitoring of eligibility decisions; caseload analytics for team planning.\n\n### Agentic future\n\nHuman-in-the-loop. The eligibility determination is a professional judgement and remains with the practitioner. Agent roles: drafting narratives, extracting structured data from free-text, checking against the eligibility regulations, preparing the support plan for sign-off. A fully agentic model is defensible only for the most proportionate end of the spectrum (information, advice, signposting) and not for statutory assessment.\n\n---\n\n## 3. Care planning and personal budgets\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Outcome-mandated |\n| **Headline pressures** | RAS variability • Slow market response for specialist • Budget-to-spend reconciliation |\n| **Headline opportunities** | AI-drafted plans • Automated budget calculation • Spend-to-budget visibility |\n\n*Designing a plan that meets eligible needs within a published resource allocation.*\n\n### How it works\n\nOnce eligibility is confirmed, the practitioner develops a care and support plan describing how the adult's needs will be met. A resource allocation system (RAS) produces an indicative personal budget from the assessment scores, which the practitioner refines against the actual cost of the chosen services. The plan is agreed with the adult and (where applicable) their carer, signed off by a team manager, and commissioned through in-house brokerage or direct to provider. Reviews are scheduled at 12 months or earlier on a change of circumstance.\n\n### Legal basis\n\nCare Act 2014 ss24–27; Care and Support Statutory Guidance chapter 10.\n\n### Guardrails\n\nStatutory duty once eligibility established. Process-mandated (the plan must set out how needs will be met and specify a personal budget). Outcome-mandated (the plan must be sufficient to meet eligible needs).\n\n### Demand drivers\n\nFlows directly from completed assessments. Also reviews triggered by change of circumstances, hospital discharge, and carer breakdown.\n\n### Pressures\n\nPersonal budget setting against a tight resource allocation system. Variation between practitioners in brokered costs. Slow market response for specialist placements. Reconciliation of budget against actual spend.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted care plans from assessment data; automated budget calculation with practitioner override; re-use of standard outcome statements.\n- **Workflows**: digital sign-off by the adult and sharing with the provider.\n- **Data**: RAS equity monitoring; unit cost analytics by provider and placement type; spend-to-budget visibility for team managers.\n\n### Agentic future\n\nHuman-in-the-loop. Plan generation can be heavily agent-assisted from structured assessment data, but the plan is the practitioner's accountability and the adult's agreement is required.\n\n---\n\n## 4. Direct payments administration\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with fully-agentic sub-processes |\n| **Guardrails** | Statutory duty to offer • Process-mandated |\n| **Headline pressures** | Reconciliation workload • Unspent balances • PA tax/employment complexity |\n| **Headline opportunities** | Automated reconciliation • Pre-paid card analytics • Misuse pattern detection |\n\n*Delivering a personal budget as a cash payment the person uses to purchase their own care.*\n\n### How it works\n\nA person entitled to a personal budget can request a direct payment instead of council-arranged care, subject to capacity and agreement. The council sets up a pre-paid card or bank arrangement, issues guidance, and pays the budget at a regular frequency. The person then purchases their own care — frequently employing personal assistants directly under the tax and employment law framework — and the council monitors spend through card transaction data and periodic review. Unspent funds above a tolerance are recovered at review; discrepancies can trigger safeguarding or financial concerns.\n\n### Legal basis\n\nCare Act 2014 ss31–33; Care and Support (Direct Payments) Regulations 2014.\n\n### Guardrails\n\nStatutory duty to offer where the person has capacity and wants one. Process-mandated (consent, capacity, monitoring). Not actor-mandated for administration.\n\n### Demand drivers\n\nPersonal preference; self-directed support philosophy; complex needs where off-the-shelf provision is poor-fit; deferred demand from younger adults.\n\n### Pressures\n\nMonitoring and reconciliation workload. Unspent balances. Fraud and misuse. Tax and employment law complexity for people employing personal assistants. Pre-paid card reconciliation.\n\n### Digital and data opportunities\n\n- **Productivity**: automated reconciliation against pre-paid card data; AI-generated monitoring summaries.\n- **Workflows**: a portal for payment requests, timesheets, and evidence upload.\n- **Data**: programme-level spend analytics; early warning for misuse patterns.\n\n### Agentic future\n\nHuman-in-the-loop at issue and review; fully agentic for reconciliation and evidence parsing. Volume and rules-heavy nature make direct payments administration one of the most tractable ASCH workflows.\n\n---\n\n## 5. Reablement and intermediate care\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Discretionary in design • Outcome-mandated at programme level |\n| **Headline pressures** | Capacity vs discharge demand • NHS workforce pull • Outcome demonstration |\n| **Headline opportunities** | Outcome tracking • Real-time discharge referral • Demand forecasting linked to NHS data |\n\n*Short-term, outcome-focused support to restore independence, typically post-discharge.*\n\n### How it works\n\nReferrals come almost entirely from hospital discharge teams and from social work assessments that identify rehabilitation potential. The reablement team — occupational therapists, physiotherapists, and reablement workers — delivers a short, goal-focused programme in the person's home, typically four to six weeks. Progress is reviewed against goals, with exercises, equipment, and environment changes as needed. At the end of the programme the person either returns to independence, is referred for longer-term care, or is stepped up for specialist input.\n\n### Legal basis\n\nCare Act 2014 s2 (prevent, reduce, delay); Care and Support Statutory Guidance chapter 2. Funded jointly with the NHS via the Better Care Fund.\n\n### Guardrails\n\nDiscretionary in design, though the prevention duty gives a statutory anchor. Outcome-mandated at programme level (reduce need for longer-term care). No actor mandate in statute; occupational therapists and reablement workers typically lead.\n\n### Demand drivers\n\nHospital discharges; falls; post-surgical recovery; deconditioning after infection; deterioration identified through primary care.\n\n### Pressures\n\nCapacity versus discharge demand. NHS pull on the same workforce. Hand-off delays from acute to reablement. Demonstrating outcomes to justify investment in a commissioning environment that rewards step-down.\n\n### Digital and data opportunities\n\n- **Productivity**: digital outcome tracking by the reablement team; AI-drafted closure reports.\n- **Workflows**: real-time discharge referral from acute; goal-based plans shared with the person.\n- **Data**: outcome analytics by cohort; cost-avoidance modelling; demand forecasting linked to NHS discharge data.\n\n### Agentic future\n\nHuman-in-the-loop. Core reablement is relational and physical; agentic support concentrates in scheduling, goal tracking, evidence aggregation, and automated outcome reporting. Assistive technology (sensor-based, voice-led) increasingly sits inside the service itself but is not the service.\n\n---\n\n## 6. Homecare commissioning\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Outcome-mandated at market level (Care Act s5) • Process-mandated for procurement |\n| **Headline pressures** | Provider fragility • Hourly rate pressure • Workforce turnover • Unfilled calls |\n| **Headline opportunities** | Provider risk dashboards • Real-time capacity maps • Predictive provider failure |\n\n*Contracting domiciliary care providers to deliver personal and domestic support at home.*\n\n### How it works\n\nThe commissioning team sets the framework, hourly rates, and zoning arrangements for the local home care market. Individual packages are brokered against assessed need — either by in-house brokers or through an electronic dynamic purchasing system — and awarded to a provider. The provider delivers care calls on a schedule aligned to the support plan, logs attendance through electronic call monitoring, and invoices for reconciliation. Quality is managed through spot checks, contract review meetings, safeguarding concerns, and (where needed) intervention or contract termination.\n\n### Legal basis\n\nCare Act 2014 s5 (market shaping duty); Health and Social Care Act 2008 (regulation of providers); Procurement Act 2023.\n\n### Guardrails\n\nMarket-shaping duty is outcome-mandated at market level. Provider regulation is CQC's. Procurement is process-mandated.\n\n### Demand drivers\n\nVolume and cost directly driven by needs assessments and hospital discharge flows. Contract choice between zoned, framework, and spot-purchase models.\n\n### Pressures\n\nProvider fragility. Hourly rate pressure. Handback rates. Workforce turnover (national care worker pay and conditions). Unfilled calls. Zoning reduces travel time but can concentrate provider failure risk.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted contract monitoring and performance reporting.\n- **Workflows**: electronic call monitoring with real-time variance alerts; dynamic scheduling at provider level.\n- **Data**: provider risk dashboards; real-time capacity maps; predictive indicators of provider failure; fair pay data once the fair pay agreement commences.\n\n### Agentic future\n\nHuman-in-the-loop for commissioning decisions and provider relationships. Fully agentic for scheduling within providers, variance detection, and reconciliation. One of the clearest areas where operational data unlocks material cost and quality improvement.\n\n---\n\n## 7. Residential and nursing care commissioning\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Outcome-mandated • Process-mandated through procurement • Market-shaping duty |\n| **Headline pressures** | Self-funder cross-subsidy • Weekly rate escalation • Out-of-borough placements • CHC interface |\n| **Headline opportunities** | AI-assisted placement matching • Provider portal • Quality risk profiling |\n\n*Contracting placements in care homes, including for older people and specialist cohorts.*\n\n### How it works\n\nWhen home care is no longer sufficient or safe, the practitioner discusses residential or nursing care with the person and their family. A placement search is conducted against the person's needs, preferences, and the council's agreed rate structure, with choice of accommodation rules applied. The placement is agreed, a contract is signed with the provider, and the person moves. Ongoing review manages quality, cost, and changes in need. A minority of placements are made or part-funded under NHS Funded Nursing Care or Continuing Healthcare.\n\n### Legal basis\n\nCare Act 2014 ss5, 18; National Assistance Act 1948 (residual); Health and Social Care Act 2008.\n\n### Guardrails\n\nOutcome-mandated at individual placement level (duty to meet needs). Process-mandated through procurement. Market-shaping duty applies.\n\n### Demand drivers\n\nEnd of reablement pathway; dementia and frailty progression; mental health step-down; complex care where home care is inadequate or unsafe.\n\n### Pressures\n\nSelf-funder cross-subsidy dynamics. Weekly rate escalation. Contract rate disputes. Choice of accommodation policy challenges. NHS-funded nursing care interface. Out-of-borough placement oversight.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted placement search and matching against needs profile.\n- **Workflows**: provider portal for bed availability and rate negotiation.\n- **Data**: placement analytics; cost drivers; quality indicators from CQC and complaints; risk profiling of providers with high self-funder ratios.\n\n### Agentic future\n\nHuman-in-the-loop. Placement matching can be heavily agent-driven given structured needs data and provider inventory. Decision and contract remain human.\n\n---\n\n## 8. Deprivation of Liberty Safeguards\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Actor-mandated (BIA, MHA) • Process-mandated • Timescale-mandated |\n| **Headline pressures** | BIA workforce shortage • Statutory backlog • LPS implementation uncertainty |\n| **Headline opportunities** | Triage by urgency • Automated BIA scheduling • Authorisation drafting from structured evidence |\n\n*Authorising deprivations of liberty of adults lacking capacity in care homes and hospitals.*\n\n### How it works\n\nA care home or hospital (the Managing Authority) applies to the council as Supervisory Body when someone lacking capacity is, or is about to be, deprived of their liberty in the course of their care. The council allocates a Best Interests Assessor and a Mental Health Assessor from a rota. They visit, review records, and assess against the six qualifying requirements (age, mental capacity, mental health, best interests, eligibility, no refusals). An authorisation is then granted or refused, with conditions and a review date set.\n\n### Legal basis\n\nMental Capacity Act 2005 schedule A1 (DoLS); Liberty Protection Safeguards (enacted 2019, implementation delayed). Also inherent jurisdiction for s16 Court of Protection orders in the community.\n\n### Guardrails\n\nStatutory duty. Actor-mandated (Best Interests Assessor and Mental Health Assessor). Process-mandated (the statutory scheme). Timescale-mandated (standard authorisations have defined timescales).\n\n### Demand drivers\n\nCare home and hospital referrals. National backlog is substantial — DoLS applications rose by over 1,000% between 2014 and 2020 and have remained elevated.\n\n### Pressures\n\nWorkforce shortage of Best Interests Assessors. Statutory backlog. Reputational and legal risk of unauthorised deprivations. Unresolved LPS implementation timeline.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted case triage by urgency criteria; automated scheduling of BIA visits; drafting of authorisation rationales from structured evidence.\n- **Workflows**: digital referral from care homes with structured prompts for the eligibility fields.\n- **Data**: backlog analytics; equity reporting.\n\n### Agentic future\n\nHuman-in-the-loop. The assessment is statutorily the BIA's. Agentic roles are triage, scheduling, document pack assembly, and drafting — none of which reduces the assessment itself.\n\n---\n\n## 9. Mental capacity and best interests\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory duty (for professionals acting under MCA) • Process-mandated |\n| **Headline pressures** | Documentation quality • Functional test variability • IMCA availability • Court of Protection process |\n| **Headline opportunities** | Structured assessment templates • AI-drafted rationale • Audit and equity analysis |\n\n*Determining capacity for a specific decision, and where lacking, making best interests decisions.*\n\n### How it works\n\nCapacity questions arise throughout adult social care (and in children's transitions and some adult protection cases). The practitioner involved in the decision conducts the two-stage capacity test for the specific decision in question, records the rationale, and — where capacity is lacking — follows the best interests checklist, consulting those involved in the person's care. For serious decisions (long-term residence, serious medical treatment, some financial decisions), the Court of Protection may need to be involved. IMCAs are instructed where the person is unbefriended.\n\n### Legal basis\n\nMental Capacity Act 2005; MCA Code of Practice.\n\n### Guardrails\n\nStatutory duty applies to professionals acting under the Act. Process-mandated (the two-stage test, the best interests checklist). Not actor-mandated in general but professional standards apply.\n\n### Demand drivers\n\nEmbedded across adult social care, safeguarding, NHS, and some children's services around transitions. Large-decisions (accommodation, serious medical treatment, finances) drive the highest-volume best interests work.\n\n### Pressures\n\nDocumentation quality. Variability in application of the functional test. IMCA (Independent Mental Capacity Advocate) availability. Court of Protection process when disputes arise.\n\n### Digital and data opportunities\n\n- **Productivity**: structured capacity assessment templates with AI-drafted rationale.\n- **Workflows**: triage prompt in case management to surface the capacity question.\n- **Data**: audit and equity analysis of capacity decisions.\n\n### Agentic future\n\nAI-assisted. Capacity is a context-specific professional judgement. Agents support by structuring the evidence and prompting the correct test; they do not make the determination.\n\n---\n\n## 10. Learning disability and autism services\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty (Care Act) • Outcome-mandated • NHS joint responsibility (s75) |\n| **Headline pressures** | Transitions volume • Supported living capacity • Complex placements • Annual health checks |\n| **Headline opportunities** | CYPE→ASCH transitions data flow • Cohort forecasting • Placement market intelligence |\n\n*Care and support for adults with a learning disability or autism and their families.*\n\n### How it works\n\nMost people enter services through transitions from children's services at 18, with planning beginning from 14. Some join later via community mental health, primary care, or family referral. A practitioner, often an LD or autism specialist, conducts a needs assessment, with particular attention to communication, sensory needs, and co-occurring mental and physical health conditions. Support is then delivered across supported living, day opportunities, employment support, and community clubs, coordinated through a lead practitioner. Annual health checks and hospital passports manage the NHS interface.\n\n### Legal basis\n\nCare Act 2014; Autism Act 2009; Health and Care Act 2022 (training requirements); various NHS and joint funding arrangements.\n\n### Guardrails\n\nStatutory duty under the Care Act where needs are eligible. Outcome-mandated (wellbeing, community participation). NHS joint responsibility for health care under s75 NHS Act 2006.\n\n### Demand drivers\n\nTransitions from children's services at 18 (peak demand point); rising autism diagnoses; long-standing Transforming Care cohort discharged from inpatient settings; ageing parent-carers.\n\n### Pressures\n\nSupported living market capacity. High-cost placements for complex cases. Transitions planning quality. Day opportunities reshaping after COVID. Annual health check interface with NHS.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted transitions planning pulling data from CYPE records into adult records.\n- **Workflows**: structured handover from children's services; planning tool at 14+.\n- **Data**: cohort forecasting five years ahead; placement market intelligence; outcomes analysis for Transforming Care.\n\n### Agentic future\n\nHuman-in-the-loop. Person-centred planning is relational; agentic value concentrates in transitions data flow, placement matching, and outcomes tracking.\n\n---\n\n## 11. Mental health social work (s75 arrangements)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty (MHA, Care Act) • Actor-mandated (AMHP) • Process-mandated under MHA |\n| **Headline pressures** | AMHP rota pressure • s136 bed availability • s117 cost growth • Ordinary residence disputes |\n| **Headline opportunities** | AI-drafted tribunal reports • s117 NHS-integrated tracker • Detention equity monitoring |\n\n*Social work support for people with mental ill-health, typically delivered jointly with NHS trusts.*\n\n### How it works\n\nMost work comes through community mental health teams where social workers are embedded under s75 partnership, through the Approved Mental Health Professional rota for MHA assessments, and through after-care duty cases under s117. An AMHP responds to requests for assessment (often from police under s136, or following medical request), attends alongside medical colleagues, and makes the personal statutory decision on detention. Care coordinators manage care plans and reviews for people open to the service. Mental Health Tribunal preparation is intensive and timebound.\n\n### Legal basis\n\nMental Health Act 1983 (as amended); Care Act 2014; NHS Act 2006 s75 (partnership arrangements).\n\n### Guardrails\n\nStatutory duties under both the Mental Health Act (Approved Mental Health Professional role, Nearest Relative duties) and the Care Act. Actor-mandated (AMHP). Process-mandated under MHA.\n\n### Demand drivers\n\nSection 136 detentions; community mental health referrals; after-care under s117; Mental Health Tribunal preparation.\n\n### Pressures\n\nAMHP rota pressure. s136 bed availability (a police and NHS issue that lands on AMHPs). s117 after-care cost growth. Cross-boundary disputes over ordinary residence.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted tribunal reports; structured AMHP assessment templates.\n- **Workflows**: s117 tracker integrated with NHS records.\n- **Data**: s117 cost analytics; AMHP workload analytics; detention equity monitoring by ethnicity (a long-standing concern).\n\n### Agentic future\n\nHuman-in-the-loop. AMHP decisions are personal statutory decisions. Agentic value sits in scheduling, paperwork, s117 tracking, and pattern surfacing.\n\n---\n\n## 12. Occupational therapy and community equipment\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with fully-agentic potential for self-service equipment |\n| **Guardrails** | Statutory duty to assess • Outcome-mandated • Actor-mandated for complex assessment |\n| **Headline pressures** | Waiting lists (often longest in ASCH) • Equipment value-for-money • DFG interface |\n| **Headline opportunities** | Self-assessment for low-complexity equipment • Integrated DFG workflow • Equipment usage analytics |\n\n*Assessing for and providing equipment, adaptations, and strategies to support independence.*\n\n### How it works\n\nReferrals come from needs assessments, hospital discharges, falls services, primary care, and self-referral. A community occupational therapist assesses the person at home, identifies equipment, adaptations, or strategies to support independence, and arranges provision through the community equipment store, telecare, or (for significant adaptations) the DFG pathway which sits in Housing. Simple equipment is increasingly self-served through online triage with direct-dispatch. Complex assessments for major adaptations can involve architects, surveyors, and contractors across multi-month delivery.\n\n### Legal basis\n\nCare Act 2014 s2; Chronically Sick and Disabled Persons Act 1970 s2; Housing Grants, Construction and Regeneration Act 1996 (DFGs, with Housing).\n\n### Guardrails\n\nStatutory duty to assess. Outcome-mandated on need. Actor-mandated where qualification is required for complex assessment.\n\n### Demand drivers\n\nFalls; discharge; deterioration; housing unsuitability. Strong correlation with DFG demand in Housing.\n\n### Pressures\n\nWaiting lists (often the longest in ASCH after social work assessments). Equipment contract value-for-money. Interface with DFG process which sits in Housing.\n\n### Digital and data opportunities\n\n- **Productivity**: self-assessment for low-complexity equipment (community equipment store direct-dispatch); AI triage of referrals to the right pathway.\n- **Workflows**: integrated DFG referral workflow across ASCH and Housing.\n- **Data**: waiting list analytics; equipment usage data from loan returns.\n\n### Agentic future\n\nHuman-in-the-loop for complex assessment. Fully agentic plausibly achievable for self-service low-risk equipment provision via a self-assessment tool.\n\n---\n\n## 13. Public health commissioning\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Mixed — mandated services statutory, wider activity discretionary |\n| **Headline pressures** | Grant pressure • Workforce specialisation • ICB interface • Commissioning overhead |\n| **Headline opportunities** | AI-drafted JSNA updates • Population health analytics • Wastewater epidemiology |\n\n*Commissioning services to improve health and reduce health inequalities in the local population.*\n\n### How it works\n\nThe public health team identifies priority areas through the Joint Strategic Needs Assessment, the Joint Health and Wellbeing Strategy, and local political priorities. Services are commissioned — most through procurement, some through grant — with specifications and contracts covering mandated areas (sexual health, substance misuse, 0–19) and discretionary areas (mental wellbeing, weight management, tobacco control). Contract management, quality monitoring, and outcome measurement follow through the contract life. Data feeds back into the JSNA for the next cycle of commissioning.\n\n### Legal basis\n\nHealth and Social Care Act 2012 (transfer of public health); NHS Act 2006 s2B; regulations specifying mandated services.\n\n### Guardrails\n\nMixed. Mandated services (sexual health, NHS Health Check, 0–19 public health, substance misuse treatment, stop smoking) are statutory. Wider public health activity is discretionary. Ring-fenced grant to 2026/27, being consolidated into general funding thereafter.\n\n### Demand drivers\n\nPopulation health need expressed through the JSNA; high-demand cohorts include people with multiple disadvantage, rough sleepers, and children in poverty.\n\n### Pressures\n\nGrant pressure against mandated service scope. Workforce specialisation. Commissioning overhead against contract value. Public health interface with integrated care boards.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted JSNA updates from structured data.\n- **Workflows**: shared referral pathways with primary care and VCSE.\n- **Data**: population health analytics; cohort segmentation; inequality dashboards; wastewater epidemiology for emerging threats.\n\n### Agentic future\n\nHuman-in-the-loop. Commissioning decisions are policy judgements. Agentic value in data assembly, intelligence monitoring, and impact evaluation.\n\n---\n\n## 14. Sexual health services\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with fully-agentic sub-processes |\n| **Guardrails** | Mandated public health service • Process-mandated (NHS clinical standards) |\n| **Headline pressures** | Demand exceeding capacity • Channel balance (online/clinic) • Stigma barriers |\n| **Headline opportunities** | Self-testing and result delivery automation • AI-triaged symptom screening • Outbreak surveillance |\n\n*Prevention, testing, treatment, and reproductive health services.*\n\n### How it works\n\nPeople access services through self-booking (online or by phone), walk-in clinics, and through primary care and school nursing referral. Online services provide self-test kits, results, and onward referral. Clinic services cover testing, treatment, contraception, PrEP, and safeguarding. Contact tracing follows positive results. Services are commissioned by the council from NHS and third sector providers, usually across a system footprint, and are mandated under the public health framework.\n\n### Legal basis\n\nNHS Act 2006 s2B; National Health Service (Public Health Functions and Entry Level Requirements) Regulations 2013.\n\n### Guardrails\n\nMandated public health service. Process-mandated in clinical terms (NHS standards apply).\n\n### Demand drivers\n\nRising STI rates (particularly gonorrhoea and syphilis); increased demand for PrEP; routine contraception; sexual violence pathway.\n\n### Pressures\n\nDemand exceeding contract capacity. Online and clinic channel balance. Stigma barriers affecting uptake in some communities.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-triaged clinical symptom screening.\n- **Workflows**: self-testing with postal kits and app-based results; appointment booking integrated with provider.\n- **Data**: outbreak surveillance; geographic analysis of unmet need.\n\n### Agentic future\n\nHuman-in-the-loop for clinical diagnosis. Fully agentic for self-test ordering, result notification, and signposting to follow-up. Online sexual health services are one of the most mature digital public health channels in England.\n\n---\n\n## 15. Substance misuse and drug and alcohol services\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Mandated public health service • Outcome-mandated via OHID monitoring |\n| **Headline pressures** | Workforce stability • Residential rehab budget • Criminal justice interface • Family services |\n| **Headline opportunities** | AI-drafted treatment plans • NDTMS analytics • Overdose surveillance |\n\n*Treatment and support for people with drug and alcohol dependency.*\n\n### How it works\n\nReferrals come from self-referral, primary care, criminal justice, A&E, and drug- and alcohol-related deaths reviews. Providers conduct assessment, harm reduction, structured treatment (psychosocial and medication-assisted), prescribing, and recovery support. Commissioning is typically through a prime provider or consortium arrangement with specialist subcontracts for residential rehabilitation, young people, and specific cohorts. Outcomes are reported through the National Drug Treatment Monitoring System.\n\n### Legal basis\n\nNHS Act 2006 s2B; mandated public health service. Drug Strategy (Harm to Hope) national framework.\n\n### Guardrails\n\nMandated public health service. Outcome-mandated via Office for Health Improvement and Disparities monitoring.\n\n### Demand drivers\n\nRising opiate-related deaths; polydrug use; alcohol-related liver disease; increasing young people's cannabis and cocaine use.\n\n### Pressures\n\nWorkforce stability in the provider market. Residential rehabilitation budget. Interface with criminal justice (DIP, drug rehabilitation requirements). Family services for parents in treatment.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted treatment plans and outcome measures.\n- **Workflows**: digital outreach and booking; integrated prescribing with community pharmacy.\n- **Data**: cohort outcome tracking via NDTMS submissions; overdose surveillance; service access equity.\n\n### Agentic future\n\nHuman-in-the-loop. Clinical and therapeutic work is relational. Agentic support in outreach, assessment triage, and outcome tracking.\n\n---\n\n## 16. 0–19 public health services (health visiting and school nursing)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Mandated service • Process-mandated (Healthy Child Programme) |\n| **Headline pressures** | Workforce shortage • 2–25-year review compliance • Family Hubs interface |\n| **Headline opportunities** | Harmonised digital case recording • Parent app • Cohort vulnerability indicators |\n\n*Universal and targeted public health support from pregnancy through adolescence.*\n\n### How it works\n\nEvery child has a health visitor from antenatal period to age five, delivering the five mandated reviews in the Healthy Child Programme alongside targeted support for families with additional needs. School nurses take over from age five, providing universal services (vaccinations, growth monitoring) and targeted support for children with additional needs, including safeguarding and mental health. Referrals come through midwifery, GP registration, school screening, and partner agencies. The service increasingly works through Family Hubs.\n\n### Legal basis\n\nNHS Act 2006 s2B; Healthy Child Programme guidance.\n\n### Guardrails\n\nMandated service. Five universal reviews are process-mandated under the Healthy Child Programme.\n\n### Demand drivers\n\nBirth cohort size; targeted families (perinatal mental health, domestic abuse, substance misuse, children in need).\n\n### Pressures\n\nWorkforce shortage (health visitors and school nurses both under-established nationally). Mandated review compliance at the 2–25 year review. Interface with Family Hubs post-2022.\n\n### Digital and data opportunities\n\n- **Productivity**: digital case recording harmonised across health visiting and school nursing.\n- **Workflows**: parent app for appointment booking and health information.\n- **Data**: cohort vulnerability indicators aligned with CYPE early help.\n\n### Agentic future\n\nHuman-in-the-loop. Clinical service. Agentic value in administrative workflow, recall management, and analytics for early help.\n\n---\n\n## Cross-cutting themes in ASCH\n\nThree themes recur across the directorate and are worth surfacing in conversation with any council.\n\n- **The front door.** The volume and variable quality of referral triage is where most programmes find their first productivity gain and the clearest data opportunity.\n- **The NHS interface.** Hospital discharge, continuing healthcare, s117 after-care, DoLS hospital applications, and reablement all depend on shared information and shared workflow with NHS partners — and all suffer where those are weak.\n- **The provider market.** Over half of directorate spend typically goes to commissioned providers, and the data on the market is often thinner than the data on internal practice.\n\nTwo further themes are worth surfacing where relevant:\n\n- **The data-sharing constraint.** Health and adult social care data are excluded from the Digital Economy Act 2017 public service delivery powers. Cross-organisational data flows depend on consent, s75 NHS Act partnerships, Care Act and Mental Capacity Act information-sharing provisions, and common law confidentiality.\n- **Workforce and demography.** Vacancy rates, agency spend, and the changing demographics of need (ageing, working-age disability, complex co-morbidity) compound on each other.\n\n## A reimagined operating model for ASCH\n\nThe current-state entries above describe a directorate organised around episodes — referral, assessment, plan, review — each typically triggered by crisis, each producing a document, each spawning a contract, each measured by compliance with statutory timescales. A reimagined model is not faster episodes. It is a continuous evidence fabric into which episodes are drawn as the statutory decision points require, and from which most of what currently sits between those decision points disappears.\n\n### From episodes to continuous presence\n\nEvery adult who has engaged with adult social care has an active digital relationship with the council, regardless of whether they currently receive a service. Their circumstances are known through consented signals from NHS colleagues, utilities, housing, family report, care provider rotas, and pre-paid card transactions. Deterioration indicators — missed health appointments, rising arrears, changes in communication patterns, carer overload — are detected on the day the signal changes, not at the next review. A coordinating agent contacts the person first, through their preferred channel, with a specific, context-aware response. Most contacts do not escalate. The ones that do reach the social worker with an evidence pack, a risk summary, and a draft response already prepared.\n\n### What the statutory actor does\n\nThe social worker's statutory role does not change — eligibility determination, care plan sign-off, safeguarding enquiry decisions, DoLS best interests assessment — but the shape of the working week does. Less time on assembling evidence, recording visits, drafting letters, chasing partners. More time on the 15 to 20 per cent of cases where professional judgement, relationship, and advocacy genuinely change the outcome. Productive contribution is measured in complexity resolved and outcomes influenced, not in case throughput.\n\n### What combines and what stays separate\n\nSafeguarding, mental capacity, DoLS, and best interests work — currently organised as separate teams with separate caseloads — converge into a single adult protection fabric, with statutory decision points still owned by the qualified professional but supported by shared intelligence, shared scheduling, and shared evidence. Provider commissioning shifts from contract administration toward market stewardship, because most individual-level brokerage and reconciliation has become agent-managed. Reablement ceases to be a programme the person is admitted to and becomes the default response to contact with any adult likely to benefit. Public health commissioning remains distinct — its cohort-level orientation and ICB-facing posture sit uneasily inside an individual-case model — but shares the evidence base.\n\n### What remains irreducibly human\n\nThe intimate relational work. The home visit. The safeguarding conversation with someone whose trust has been broken. The moment of best interests judgement for a person who has ceased to be able to make it themselves. The holding of a care plan through the family dispute about the right nursing home. These are not interior workflow problems to be absorbed into an agent layer. They are why the profession exists. The reimagined model protects the time and attention for them.\n\n### The risks and hard constraints\n\nHealth and adult social care data are excluded from the Digital Economy Act 2017 public service delivery powers. Data-sharing depends on consent, s75 NHS Act arrangements, Care Act and Mental Capacity Act information-sharing provisions, and common law confidentiality applied carefully. This is a material constraint on how quickly the model can be assembled. Pattern-based pre-emption also works better for people whose circumstances are visible to the data fabric than for those whose are not: the socially invisible, those who have disengaged from services, those whose cultural or linguistic distance from the system means signals are absent or misread. A pre-emptive model can widen rather than narrow equity gaps if it is not consciously designed to seek out the absent signal as hard as it acts on the present one.\n","services/cype.md":"# Children and Education — services reference\n\nA directorate dominated by two statutory regimes. The Children Act 1989 and 2004 set out the framework for safeguarding, children in need, and looked after children. The Children and Families Act 2014 sets out the SEND framework. Both are in live reform. The Children's Wellbeing and Schools Act 2025 introduces new duties on family group decision-making, multi-agency child protection arrangements, and a Single Unique Identifier. The Schools White Paper (February 2026) proposes a restructured SEND system from 2029 — Individual Support Plans, Specialist Provision Packages, and a four-tier model of Universal, Targeted, Targeted Plus, and Specialist support.\n\nIn most councils this is the second largest area of directorate spending after adult social care, with the largest statutory exposure and the highest political sensitivity. High-needs block deficits in SEND are projected to reach approximately £6 billion nationally by March 2026.\n\n## Table of contents\n\n| § | Service | Agentic classification |\n|---|---|---|\n| 1 | Referral and multi-agency safeguarding (MASH) | Human-in-the-loop |\n| 2 | Child in need and child protection | Human-in-the-loop |\n| 3 | Family group decision-making | AI-assisted |\n| 4 | Looked after children | Human-in-the-loop |\n| 5 | Fostering and adoption | Human-in-the-loop |\n| 6 | Care leavers | Human-in-the-loop |\n| 7 | Early help and family support | Human-in-the-loop |\n| 8 | Youth offending | Human-in-the-loop |\n| 9 | Children with disabilities | Human-in-the-loop |\n| 10 | EHCP needs assessment (current regime) | Human-in-the-loop |\n| 11 | SEND reform — ISPs and SPPs (future regime) | Human-in-the-loop |\n| 12 | Home-to-school transport | Human-in-the-loop, with near-fully-agentic sub-processes |\n| 13 | School admissions | Fully agentic for offer-making, human-in-the-loop for appeals |\n| 14 | Attendance, exclusions, and children missing education | Human-in-the-loop, with fully-agentic sub-processes |\n| 15 | Early years sufficiency and childcare | AI-assisted |\n| 16 | Virtual school | Human-in-the-loop |\n| 17 | School place planning | AI-assisted |\n| 18 | Child death review and serious incident learning | AI-assisted |\n\nCross-cutting themes and reimagined operating model are at the end of this file.\n\n---\n\n## 1. Referral and multi-agency safeguarding (MASH)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Actor-mandated (s47) • Process-mandated • Timescale-mandated |\n| **Headline pressures** | Re-referral rates • Threshold consistency • Information-sharing • Workforce stability |\n| **Headline opportunities** | AI-assisted triage • Automated information retrieval • Demand forecasting |\n\n*The front door for child safeguarding referrals, triage, and early decision-making.*\n\n### How it works\n\nReferrals reach the MASH from schools, police, health, the public, and other council services by phone, secure portal, and automated feeds — police Public Protection Notices for domestic abuse are usually the single largest channel. A multi-agency screening team made up of social workers, police, health, and often others reviews each contact against threshold definitions and decides on action: no further action, early help, child in need, or s47 enquiry. Urgent decisions are made within hours, standard within one working day. Cases are then routed to the appropriate delivery team.\n\n### Legal basis\n\nChildren Act 1989 ss17, 47; Working Together to Safeguard Children (statutory guidance); Children's Wellbeing and Schools Act 2025 (multi-agency child protection arrangements).\n\n### Guardrails\n\nStatutory duty. Actor-mandated (s47 enquiry must be led by a qualified social worker). Process-mandated (Working Together procedures). Timescale-mandated (initial decisions within 24 hours; strategy discussions prompt).\n\n### Demand drivers\n\nReferral volumes from schools, police, health, and the public. Domestic abuse notifications from police typically the largest single source. Rising rates of contextual safeguarding concerns (CSE, CCE, county lines).\n\n### Pressures\n\nRe-referral rates. Threshold consistency. Information-sharing across partners. Workforce stability in the front door. Transition to the new multi-agency child protection units under the 2025 Act.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted referral triage; automated information retrieval from partner systems; structured risk summarisation.\n- **Workflows**: structured referral forms from schools and police; auto-routing by priority.\n- **Data**: referral source analytics; re-referral patterns; demand forecasting; thematic audit of closed cases.\n\n### Agentic future\n\nHuman-in-the-loop. Threshold decisions are statutory professional judgements. Agent roles in information assembly, chronology generation, risk flagging, and narrative drafting — substantial productivity, unchanged accountability.\n\n---\n\n## 2. Child in need and child protection\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Actor-mandated • Process-mandated • Timescale-mandated |\n| **Headline pressures** | Caseload size • Agency spend • Plan quality variability • Drift on CIN plans |\n| **Headline opportunities** | AI-drafted summaries and chronologies • Voice-captured visit notes • Practice audit at scale |\n\n*Social work intervention for children assessed as being in need or at risk of significant harm.*\n\n### How it works\n\nOnce allocated, a qualified social worker completes a single assessment within 45 working days, visiting the child, meeting parents and carers, and gathering partner information. Where risks of significant harm are identified, a strategy discussion with police and health leads to a s47 enquiry and, typically, an initial child protection conference within 15 working days. The outcome is a child in need plan, a child protection plan, or care proceedings. Cases stay open with regular visits, reviews, and plan revision until identified risks have reduced or the child has moved out of the plan.\n\n### Legal basis\n\nChildren Act 1989 ss17, 47; Working Together to Safeguard Children.\n\n### Guardrails\n\nStatutory duty. Actor-mandated (qualified social worker). Process-mandated (assessment, plan, review). Timescale-mandated (45-working-day assessment, initial child protection conference within 15 working days).\n\n### Demand drivers\n\nFlows from MASH. Dominant risk factors: neglect, domestic abuse, parental mental ill-health, substance misuse, and increasingly extra-familial harm.\n\n### Pressures\n\nCaseload size per social worker. Agency spend. Variability in plan quality. Drift on child in need plans. Pull between reactive case-holding and preventative work.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted case summaries and chronologies; voice-captured visit notes; prompt-based plan generation.\n- **Workflows**: digital family visit records; structured review templates.\n- **Data**: caseload analytics; plan progress indicators; practice audit at scale.\n\n### Agentic future\n\nHuman-in-the-loop. The relationship between social worker, child, and family is central. Agentic value is all in the administrative interior of the service — records, chronologies, reports to court, summarisation of case history. Children's services is the area where practice support tools are most likely to change how social workers spend their time without changing who makes decisions.\n\n---\n\n## 3. Family group decision-making\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | New statutory duty (2025) • Process-mandated • Coordinator role required |\n| **Headline pressures** | Coordinator workforce • Family network scheduling • Outcomes tracking |\n| **Headline opportunities** | AI-drafted family meeting minutes and plans • Coordinator scheduling tool • Care-avoidance analytics |\n\n*Structured family meetings to plan for a child's welfare before care proceedings.*\n\n### How it works\n\nWhen a child is at risk of entering care, a coordinator convenes the extended family network — often including grandparents, uncles, aunts, non-resident parents, and close friends. The social worker attends at the start to share concerns, then leaves the family to plan privately. The family's plan is tested against the council's safeguarding concerns and accepted, amended, or rejected. Implementation is monitored through ongoing social work involvement.\n\n### Legal basis\n\nChildren's Wellbeing and Schools Act 2025 (new duty to offer FGDM to parents of children at risk of entering care).\n\n### Guardrails\n\nNew statutory duty (2025). Process-mandated. Requires dedicated coordinator role.\n\n### Demand drivers\n\nCases on the care threshold. Expected to grow as the duty implements. LGA position: the duty requires new-burdens funding.\n\n### Pressures\n\nCoordinator workforce (a specialist role). Scheduling across extended family networks. Outcomes tracking against care-proceedings avoidance.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted family meeting minutes and plans; structured agenda templates.\n- **Workflows**: coordinator scheduling tool; family invitation and consent workflow.\n- **Data**: outcomes analytics on care avoidance and placement stability.\n\n### Agentic future\n\nAI-assisted. Family-facing relational work is not automatable. Preparation, minute-taking, and plan documentation are prime agentic targets.\n\n---\n\n## 4. Looked after children\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Actor-mandated (IRO, social worker) • Process-mandated • Outcome-mandated |\n| **Headline pressures** | Placement sufficiency • Independent placement cost • Out-of-borough placements • Unregistered children's homes |\n| **Headline opportunities** | AI-drafted reviews and court statements • Placement matching portals • Sufficiency modelling |\n\n*The statutory parental responsibility for children in the care of the local authority.*\n\n### How it works\n\nWhen a child becomes looked after — voluntarily under s20, by court order, or via emergency protection — the council assumes corporate parenting responsibility. A care plan is drawn up and reviewed by an Independent Reviewing Officer at 20 working days, then 3 months, then six-monthly. Placement, education, health, and permanence are planned and tracked in parallel. Day-to-day parenting happens through foster carers, residential staff, or kinship carers, with the social worker as lead professional.\n\n### Legal basis\n\nChildren Act 1989 ss20, 22–24; Care Planning Regulations 2010; Children's Wellbeing and Schools Act 2025 (Regional Care Cooperatives, profit regulation).\n\n### Guardrails\n\nStatutory duty. Actor-mandated (Independent Reviewing Officer for statutory reviews, qualified social worker as lead professional). Process-mandated (care planning, reviews, health and education). Outcome-mandated (corporate parenting duty).\n\n### Demand drivers\n\nNumbers of children entering care; length of stay; cost of placement. Unaccompanied asylum-seeking children form a significant and rising cohort in some councils.\n\n### Pressures\n\nPlacement sufficiency. Independent fostering and residential placement costs. Out-of-borough placements. Unregistered children's home problem (estimated £440 million sector-wide). Impact of Regional Care Cooperatives on commissioning strategy.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted care plan updates, review reports, and court statements.\n- **Workflows**: placement search and matching portals; digital reviews with young people's participation tools.\n- **Data**: placement cost analytics; sufficiency modelling five to ten years ahead; market intelligence on providers.\n\n### Agentic future\n\nHuman-in-the-loop. Corporate parenting is fundamentally relational. Agentic value in placement matching, cost management, review preparation, and market analytics.\n\n---\n\n## 5. Fostering and adoption\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Regulated by Ofsted |\n| **Headline pressures** | Carer recruitment and retention • Assessment timescales • IFA cost interface |\n
