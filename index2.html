n## Table of contents\n\n| § | Service | Agentic classification |\n|---|---|---|\n| 1 | Planning — development management | Human-in-the-loop |\n| 2 | Planning — policy and local plan | AI-assisted |\n| 3 | Building control | Human-in-the-loop |\n| 4 | Highways maintenance and adoption | Fully agentic for classification, human-in-the-loop for engineering |\n| 5 | Parking and traffic management | Fully agentic for routine, human-in-the-loop for contested |\n| 6 | Waste collection and street cleansing | Fully agentic for scheduling, human-in-the-loop for contract management |\n| 7 | Waste disposal | AI-assisted |\n| 8 | Environmental health | Human-in-the-loop |\n| 9 | Trading standards | Human-in-the-loop |\n| 10 | Licensing (alcohol, entertainment, taxis, gambling) | Fully agentic for renewals, human-in-the-loop for contested |\n| 11 | Parks, green spaces, and outdoor sports | AI-assisted |\n| 12 | Libraries | Fully agentic for transactional, human-in-the-loop for programmes |\n| 13 | Leisure services | Fully agentic for booking, human-in-the-loop for programme |\n| 14 | Culture, heritage and archives | AI-assisted |\n| 15 | Economic development and regeneration | AI-assisted |\n| 16 | Flood risk and coastal management | AI-assisted |\n| 17 | Emergency planning and resilience | Human-in-the-loop |\n| 18 | Civil registration (births, deaths, marriages) | Human-in-the-loop |\n\nCross-cutting themes and reimagined operating model are at the end of this file.\n\n---\n\n## 1. Planning — development management\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Timescale-mandated (8/13/16 weeks) |\n| **Headline pressures** | Validation latency • Designation risk • Major application negotiation • s106 negotiation |\n| **Headline opportunities** | AI-assisted validation • Officer report drafting • Determination-time analytics |\n\n*Processing and determining planning applications.*\n\n### How it works\n\nApplicants submit planning applications via the national Planning Portal or the council's own route. The council validates and publicises the application, consults statutory consultees (highways, environment, housing, others), neighbours, and parish councils. A planning officer assesses the application against the development plan and material considerations, negotiating amendments or s106 contributions where relevant. The decision is taken under delegated powers for most applications and by planning committee for major, controversial, or officer-recommended-refusal cases. Statutory appeals to the Planning Inspectorate follow refusals.\n\n### Legal basis\n\nTown and Country Planning Act 1990; Localism Act 2011; Levelling-up and Regeneration Act 2023; Town and Country Planning (Development Management Procedure) (England) Order 2015.\n\n### Guardrails\n\nStatutory duty. Process-mandated (consultation, publicity, determination). Timescale-mandated (8 weeks for minor, 13 weeks for major, 16 weeks with EIA).\n\n### Demand drivers\n\nDevelopment market activity; housing delivery pressure; householder applications. National speed and approval rate are performance-managed by DLUHC.\n\n### Pressures\n\nValidation and consultation response latency. Designation risk on performance. Resource cost of major application negotiation and s106 negotiation.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted application validation; officer report drafting from policy and consultation response.\n- **Workflows**: mature digital submission (Planning Portal); public consultation portals.\n- **Data**: determination-time analytics; consultation response aggregation; five-year housing land supply tracking.\n\n### Agentic future\n\nHuman-in-the-loop. Planning decisions are statutory officer or committee decisions. Agentic value in validation, consultation analysis, and report drafting. Fully agentic plausible for prior approval and permitted development confirmation.\n\n---\n\n## 2. Planning — policy and local plan\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory duty to produce plan • Process-mandated (examination in public, soundness tests) |\n| **Headline pressures** | Plan examination failure • Neighbourhood plan interaction • Housing target politics |\n| **Headline opportunities** | AI-assisted consultation thematic coding • Digital plan-making • Evidence base analytics |\n\n*Producing and maintaining the statutory development plan and supplementary documents.*\n\n### How it works\n\nA small policy team prepares and maintains the Local Plan, supplementary planning documents, and neighbourhood plans through a multi-year cycle of evidence gathering, consultation, drafting, examination in public, and adoption. LURA 2023 is reshaping plan content and cadence. Evidence base work — housing need, employment land, heritage, ecology, infrastructure — feeds into plan drafting and development management. Political sensitivity around housing numbers dominates the process in most councils.\n\n### Legal basis\n\nPlanning and Compulsory Purchase Act 2004; Levelling-up and Regeneration Act 2023 (introducing new-style plans).\n\n### Guardrails\n\nStatutory duty to produce a plan. Process-mandated (examination in public, tests of soundness).\n\n### Demand drivers\n\nFive-year plan cycle, typically, though new-style plans under LURA 2023 will change cadence.\n\n### Pressures\n\nPlan examination failure. Neighbourhood plan interaction. Politics of housing target allocation across sub-areas.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted consultation response thematic coding.\n- **Workflows**: digital plan-making tools (consultation, viewer).\n- **Data**: evidence base analytics; housing and employment land monitoring.\n\n### Agentic future\n\nAI-assisted. Plan-making is fundamentally political and policy-led. Agentic value in evidence assembly and consultation analysis.\n\n---\n\n## 3. Building control\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory regulator role (in market competition) • Process-mandated • Timescale-mandated |\n| **Headline pressures** | Approved Inspector competition (market share loss) • BSR remit for higher-risk buildings • Inspector recruitment |\n| **Headline opportunities** | AI-assisted plan checking • Digital submission • Inspector mobile working |\n\n*Regulating building works for compliance with Building Regulations.*\n\n### How it works\n\nDevelopers notify building work and submit plans, or use Approved Inspectors instead. A building control surveyor checks plans against the Regulations, then inspects at defined stages during construction — foundations, superstructure, services, completion. Compliance is certified at completion. The Building Safety Regulator has taken over higher-risk buildings, changing the service's remit.\n\n### Legal basis\n\nBuilding Act 1984; Building Regulations 2010; Building Safety Act 2022 (for higher-risk buildings).\n\n### Guardrails\n\nStatutory regulator role, though in competition with Approved Inspectors in the private sector. Process-mandated and timescale-mandated.\n\n### Demand drivers\n\nWorks notifications; plans submissions; site inspections; (for higher-risk buildings) the Gateway regime.\n\n### Pressures\n\nCompetition from Approved Inspectors (losing market share). Building Safety Regulator's expanded remit for higher-risk buildings. Inspector recruitment.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted plan checking against the Regulations.\n- **Workflows**: digital submission; inspector mobile working.\n- **Data**: compliance analytics; inspection scheduling optimisation.\n\n### Agentic future\n\nHuman-in-the-loop. Inspection is physical. Plan-checking can be substantially agent-assisted.\n\n---\n\n## 4. Highways maintenance and adoption\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for classification, human-in-the-loop for engineering |\n| **Guardrails** | Statutory duty to maintain • Process-mandated for adoption |\n| **Headline pressures** | Maintenance backlog • Tort liability of defect claims • Structures condition |\n| **Headline opportunities** | AI defect classification • Citizen reporting apps • Predictive maintenance |\n\n*Maintaining the adopted highway network and adopting new roads from development.*\n\n### How it works\n\nDefects reach the council through citizen reports via app, portal, or phone, and through planned inspection programmes driven by a risk-based hierarchy. Officers inspect and categorise, then issue works to in-house or contracted teams by priority. Planned resurfacing programmes run against capital budgets informed by condition surveys. Claims from vehicle or pedestrian damage trigger defect history searches for liability.\n\n### Legal basis\n\nHighways Act 1980 ss41 (maintenance), 38 (adoption agreements), 278 (alterations).\n\n### Guardrails\n\nStatutory duty to maintain. Process-mandated for adoption.\n\n### Demand drivers\n\nReactive (pothole reports, gully blockages, street lighting); planned (resurfacing, structures); development-driven (adoption, s278 works).\n\n### Pressures\n\nMaintenance backlog. Tort liability of defect claims. Condition of structures (bridges and retaining walls).\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted defect classification from photos.\n- **Workflows**: citizen reporting apps; contractor job orchestration.\n- **Data**: network condition analytics; claim pattern analysis; predictive maintenance.\n\n### Agentic future\n\nFully agentic for defect classification, scheduling, and claim triage. Human-in-the-loop for engineering judgement and contract management.\n\n---\n\n## 5. Parking and traffic management\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for routine, human-in-the-loop for contested |\n| **Guardrails** | Statutory framework for civil parking enforcement • PCN appeal process to TPT |\n| **Headline pressures** | Public contest on schemes • Income vs behaviour-change tension • Enforcement cost vs income |\n| **Headline opportunities** | ANPR-based enforcement • AI challenge response • Behaviour change evaluation |\n\n*Parking enforcement, on-street and off-street operation, and traffic regulation orders.*\n\n### How it works\n\nEnforcement officers patrol on-street parking and car parks, issuing Penalty Charge Notices for contraventions, supported increasingly by CCTV and ANPR. Residents and businesses apply for permits through online portals; traffic regulation orders for scheme changes go through consultation and adoption. Challenges and representations against PCNs proceed through statutory stages to the Traffic Penalty Tribunal. Policy-driven schemes — low-traffic neighbourhoods, CPZs, pavement parking restrictions — run alongside.\n\n### Legal basis\n\nTraffic Management Act 2004; Road Traffic Regulation Act 1984; local bye-laws.\n\n### Guardrails\n\nStatutory framework for civil parking enforcement. PCN appeal process via Traffic Penalty Tribunal.\n\n### Demand drivers\n\nContraventions; permit applications; car park usage; policy-driven demand (LTNs, CPZs).\n\n### Pressures\n\nPublic contest around scheme introduction. Income assumptions against actual behaviour change. Enforcement cost vs income balance.\n\n### Digital and data opportunities\n\n- **Productivity**: ANPR-based enforcement; AI-assisted challenge and appeal response.\n- **Workflows**: permit self-service; digital PCN lifecycle.\n- **Data**: revenue analytics; contravention hotspot mapping; behaviour change evaluation.\n\n### Agentic future\n\nFully agentic for PCN issue, challenge triage, and permit administration. Human-in-the-loop for contested cases and policy-level scheme design.\n\n---\n\n## 6. Waste collection and street cleansing\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for scheduling, human-in-the-loop for contract management |\n| **Guardrails** | Statutory duty • Simpler Recycling requirements • Process-mandated for some materials |\n| **Headline pressures** | Simpler Recycling weekly food waste • Vehicle replacement capital • Depot infrastructure |\n| **Headline opportunities** | AI round optimisation • Citizen app • Fly-tipping intelligence |\n\n*Household waste and recycling collection, street cleaning, and litter/fly-tipping response.*\n\n### How it works\n\nCrews on set rounds collect domestic refuse and recycling, with weekly food waste being added under Simpler Recycling. Residents report missed collections, request bin exchanges, and pay for bulky and garden waste services online. Street cleansing teams cover litter, fly-tipping removal, and graffiti; fly-tipping enforcement links to environmental crime investigation. Commercial waste is a chargeable service competing with private operators.\n\n### Legal basis\n\nEnvironmental Protection Act 1990 ss45 (collection duty), 89 (litter duty); Waste and Emissions Trading Act 2003; Simpler Recycling reforms (England).\n\n### Guardrails\n\nStatutory duty (collection frequency now subject to Simpler Recycling requirements). Process-mandated for some specified materials.\n\n### Demand drivers\n\nHousehold generation; seasonal peaks; commercial waste (chargeable).\n\n### Pressures\n\nCollection round efficiency under Simpler Recycling weekly food waste requirement. Vehicle replacement capital. Depot infrastructure.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted round optimisation.\n- **Workflows**: citizen app for bin days and missed collections; in-cab systems for crews.\n- **Data**: participation rates; contamination analytics; fly-tipping enforcement intelligence.\n\n### Agentic future\n\nFully agentic for round scheduling, reporting triage, and citizen comms. Human-in-the-loop for contract management and operational supervision. In two-tier areas, collection is a district function; disposal (below) is county-tier.\n\n---\n\n## 7. Waste disposal\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory duty (upper tier or unitary) • Long-term contractual arrangements |\n| **Headline pressures** | PFI exits • Landfill tax • ETS implications for incineration • Residual reduction targets |\n| **Headline opportunities** | AI compositional analysis • Cross-authority planning • Carbon accounting |\n\n*Disposing of, treating, or recycling waste collected by the waste collection authority.*\n\n### How it works\n\nCollected waste is tipped at transfer stations and routed to treatment — energy from waste, materials recycling facilities, anaerobic digestion, or residual landfill. Long-term disposal contracts with private operators dominate the cost and risk picture; many are legacy PFI arrangements. The disposal authority (upper tier or unitary) works with collection authorities on minimisation and recycling programmes. Residual reduction targets and carbon accounting are driving redesign of the contractual and operational model.\n\n### Legal basis\n\nEnvironmental Protection Act 1990 s51; statutory waste planning framework.\n\n### Guardrails\n\nStatutory duty (upper tier or unitary). Contractual relationships with long-term disposal partners.\n\n### Demand drivers\n\nVolume from collection authorities.\n\n### Pressures\n\nLong-term contract economics (PFI exits). Landfill tax. Emissions trading scheme implications for incineration. Residual waste reduction targets.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted compositional analysis.\n- **Workflows**: cross-authority planning.\n- **Data**: flow analytics; carbon accounting.\n\n### Agentic future\n\nAI-assisted. Policy and commercial decisions dominate.\n\n---\n\n## 8. Environmental health\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Mixed statutory duties • Process-mandated for food hygiene • Timescale norms for nuisance |\n| **Headline pressures** | Officer capacity vs risk-rated inspection • Noise complaint volume • Post-COVID inspection backlog |\n| **Headline opportunities** | AI inspection scheduling • Complaint triage • Risk-rating analytics |\n\n*Food safety, public health protection, pollution control, and statutory nuisance.*\n\n### How it works\n\nBusinesses are registered and inspected on a risk-rated cycle for food hygiene. Complaints of nuisance (noise, smell, pests), contaminated land, air quality, and public health risks trigger reactive investigation. Officers gather evidence, serve statutory notices, prosecute where warranted, and advise where that is more proportionate. Health and safety investigations are shared with HSE by remit.\n\n### Legal basis\n\nFood Safety Act 1990; Environmental Protection Act 1990 Part 3 (statutory nuisance); Health and Safety at Work Act 1974 (shared with HSE).\n\n### Guardrails\n\nMixed statutory duties. Process-mandated for food hygiene (the FSA framework). Timescale norms for statutory nuisance.\n\n### Demand drivers\n\nBusiness inspections (risk-rated); complaints (noise, smell, pests); food poisoning notifications; private water supply inspection.\n\n### Pressures\n\nOfficer capacity against risk-rated inspection expectation. Statutory nuisance noise complaint volume. Business inspection backlog post-COVID.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted inspection scheduling and report drafting.\n- **Workflows**: complaint intake with structured triage; business portal for registration and self-service.\n- **Data**: risk-rating analytics; noise complaint hotspot mapping.\n\n### Agentic future\n\nHuman-in-the-loop. Inspection is physical and judgement-based. Agentic value in scheduling, complaint triage, and data analysis.\n\n---\n\n## 9. Trading standards\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty (upper tier or unitary) • Heavily process-mandated by national framework |\n| **Headline pressures** | Officer capacity across vast portfolio • National product safety recalls • Emerging fraud (deepfakes, marketplaces) |\n| **Headline opportunities** | AI intelligence analysis • Citizens Advice integration • Product-level risk analytics |\n\n*Enforcement of consumer protection, weights and measures, and product safety legislation.*\n\n### How it works\n\nIntelligence arrives from Citizens Advice complaints, national databases, partner agencies, and test purchases. Officers investigate suspected breaches — underage sales, unsafe products, rogue trading, scams — and take enforcement action from warnings through to prosecution. Weights and measures inspection, product safety, and online marketplace issues all sit within the remit. Much of the work is coordinated with other authorities through regional and national frameworks.\n\n### Legal basis\n\nConsumer Protection from Unfair Trading Regulations 2008; Weights and Measures Act 1985; Consumer Rights Act 2015; over 250 pieces of associated legislation.\n\n### Guardrails\n\nStatutory duty (upper tier or unitary). Heavily process-mandated by national framework agreements.\n\n### Demand drivers\n\nConsumer complaints (via Citizens Advice); intelligence from national agencies; age-restricted product test purchasing.\n\n### Pressures\n\nOfficer capacity across a vast regulatory portfolio. National product safety recalls. Emerging fraud categories (deepfake scams, online marketplaces).\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted intelligence analysis from multiple data sources; automated case file assembly.\n- **Workflows**: integration with Citizens Advice referral streams.\n- **Data**: product-level risk analytics; fraud pattern analysis.\n\n### Agentic future\n\nHuman-in-the-loop for enforcement. Agentic value in intelligence, triage, and pattern recognition — trading standards is an information-heavy service where cross-source analysis at scale changes what is operationally possible.\n\n---\n\n## 10. Licensing (alcohol, entertainment, taxis, gambling)\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for renewals, human-in-the-loop for contested |\n| **Guardrails** | Statutory frameworks • Process-mandated • Decision committees |\n| **Headline pressures** | Committee scheduling • Digital uptake • Police and safeguarding interface on reviews |\n| **Headline opportunities** | AI application triage • Mature digital platforms • Gambling harm indicators |\n\n*Administration and enforcement of statutory licensing regimes.*\n\n### How it works\n\nApplicants submit applications for alcohol, entertainment, taxi, gambling, and other licences, with fees. Officers process standard applications under delegated authority and refer contested or new applications to licensing sub-committees. Police, fire, health, and safeguarding consultees can object; hearings are formal. Enforcement, reviews, and renewals run continuously.\n\n### Legal basis\n\nLicensing Act 2003; Gambling Act 2005; Local Government (Miscellaneous Provisions) Act 1976 (private hire and hackney); Scrap Metal Dealers Act 2013; others.\n\n### Guardrails\n\nStatutory frameworks. Process-mandated. Decision committees.\n\n### Demand drivers\n\nApplication volumes; renewal cycles; review activity.\n\n### Pressures\n\nLicensing committee scheduling. Digital application uptake. Interface with police and safeguarding on reviews.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted application triage and report drafting.\n- **Workflows**: mature digital licensing platforms (Uniform, Tascomi).\n- **Data**: licensed premises analytics; taxi driver concentration; gambling harm indicators.\n\n### Agentic future\n\nFully agentic for routine renewals and variations. Human-in-the-loop for contested applications and reviews.\n\n---\n\n## 11. Parks, green spaces, and outdoor sports\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Largely discretionary • Public trust obligations on some specific spaces |\n| **Headline pressures** | Capital maintenance backlog • Volunteer sustainability • Commercial event income targets |\n| **Headline opportunities** | AI asset condition monitoring • Digital booking • Biodiversity monitoring |\n\n*Maintenance and operation of parks, recreation grounds, and outdoor sports facilities.*\n\n### How it works\n\nOperational teams — direct or contracted — maintain grounds: mowing, horticulture, tree work, litter, and play area inspections. Community events, sports bookings, and concessions are administered by a small team. Friends groups, volunteers, and partnership working are significant. Capital investment cycles run on a longer cadence than revenue maintenance.\n\n### Legal basis\n\nPublic Health Acts; local legislation for specific spaces.\n\n### Guardrails\n\nLargely discretionary. Public trust obligations on some specific spaces.\n\n### Demand drivers\n\nUsage; community events; sports hire; formal commissioning by public health for physical activity.\n\n### Pressures\n\nCapital maintenance backlog. Volunteer and friends-of-group sustainability. Commercial event income targets.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted asset condition monitoring.\n- **Workflows**: digital booking for sports pitches and events.\n- **Data**: usage analytics; biodiversity monitoring.\n\n### Agentic future\n\nAI-assisted. Core work is physical. Agentic value in booking, operations, and reporting.\n\n---\n\n## 12. Libraries\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for transactional, human-in-the-loop for programmes |\n| **Guardrails** | Statutory duty (comprehensive and efficient service) • Outcome test |\n| **Headline pressures** | Budget pressure → contested closures • Digital transition • Digital inclusion role |\n| **Headline opportunities** | AI reader advisory • Mature LMS platforms • Community-of-interest analysis |\n\n*Statutory public library service.*\n\n### How it works\n\nLibrary staff operate branches and mobile services, managing lending, reference enquiries, and programmes — children's reading, adult learning, digital inclusion. Customers access the service through branch visits, self-service kiosks, and digital platforms for e-books, audio, and press. Programming is planned at local and service level. Partnership work with health, VCSE, and education embeds libraries in wider community offers.\n\n### Legal basis\n\nPublic Libraries and Museums Act 1964 s7 (comprehensive and efficient service duty).\n\n### Guardrails\n\nStatutory duty. Outcome test (comprehensive and efficient). Discretionary in form — subject to legal challenge on reduction.\n\n### Demand drivers\n\nLoans (physical and digital); information enquiries; programme activity (children, adults, community); use as public space.\n\n### Pressures\n\nBudget pressure leading to contested closure decisions. Digital transition. Role of libraries in digital inclusion and wellbeing.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted reader advisory.\n- **Workflows**: mature LMS platforms; digital lending (e-books, audio, press).\n- **Data**: usage analytics; community-of-interest analysis.\n\n### Agentic future\n\nFully agentic for transactional services (reservations, loans, renewals). Human-in-the-loop for programme delivery and professional advisory work.\n\n---\n\n## 13. Leisure services\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for booking, human-in-the-loop for programme |\n| **Guardrails** | Discretionary • Delivered in-house, via trust, or via operator contract |\n| **Headline pressures** | Operator contract viability post-COVID • Energy cost (pool heating) • Capital backlog |\n| **Headline opportunities** | AI scheduling • Membership platforms • Health outcome tracking |\n\n*Operation or commissioning of leisure centres, pools, and sport development.*\n\n### How it works\n\nLeisure centres — in-house, trust, or operator-contracted — run memberships, pay-as-you-go activities, schools programmes, and commissioned public health activity. Bookings arrive via online, app, and reception. Programming — classes, pool sessions, pitch hire, courses — is set at operator level. Capital investment, energy costs, and contract management are the dominant strategic concerns.\n\n### Legal basis\n\nLocal Government Act 1972; discretionary.\n\n### Guardrails\n\nDiscretionary. Delivered in-house, via trust, or via operator contract.\n\n### Demand drivers\n\nMembership; pay-as-you-go use; schools programme; public health commissioning.\n\n### Pressures\n\nOperator contract viability post-COVID. Energy cost inflation (pool heating). Capital investment backlog.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted scheduling.\n- **Workflows**: membership and booking platforms.\n- **Data**: participation analytics; health outcome tracking for commissioned activity.\n\n### Agentic future\n\nFully agentic for booking, membership, and payments. Human-in-the-loop for programme design and facility management.\n\n---\n\n## 14. Culture, heritage and archives\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Largely discretionary • Statutory obligation on archives (Public Records Act 1958) |\n| **Headline pressures** | Collection care and conservation • Digitisation backlog • Demonstrating cultural value |\n| **Headline opportunities** | AI cataloguing • Digital collections platforms • Audience analytics |\n\n*Museums, galleries, archives, arts, and cultural programme.*\n\n### How it works\n\nCurators and archivists manage collections — cataloguing, conservation, display, access. Public engagement comes through visits, school programmes, online access, and research services. Archives receive deposits of official records from the council and partner organisations. Funding bids, exhibition programming, and digitisation programmes sit alongside day-to-day access.\n\n### Legal basis\n\nLocal Government Act 1972; Public Records Act 1958 (archives).\n\n### Guardrails\n\nLargely discretionary. Statutory obligation on archives.\n\n### Demand drivers\n\nVisitor numbers; research enquiries; schools engagement; partnership events.\n\n### Pressures\n\nCollection care and conservation. Digitisation backlog. Demonstrating cultural value in financial terms.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted cataloguing and descriptions.\n- **Workflows**: digital collections platforms; visitor booking.\n- **Data**: audience analytics; collection usage patterns.\n\n### Agentic future\n\nAI-assisted. Curatorial judgement is human. Agentic value in cataloguing, metadata, transcription, and translation.\n\n---\n\n## 15. Economic development and regeneration\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Largely discretionary • Constrained by funding programme rules |\n| **Headline pressures** | Funding programme complexity • Outcome measurement vs growth goals • Time horizon vs electoral cycle |\n| **Headline opportunities** | AI business case drafting • Business portal • Local economic analytics |\n\n*Supporting local economic growth, inward investment, and place-based regeneration.*\n\n### How it works\n\nA small team delivers business support, inward investment enquiry handling, regeneration programme management, and capital project delivery against external funding (UKSPF, Levelling Up, Freeports). Relationships with local businesses, anchor institutions, LEP successors, and combined authorities are core. Outcomes are long-term — jobs, GVA, investment — but programme reporting is short-cycle.\n\n### Legal basis\n\nLocalism Act 2011 (general power of competence); specific legislation for UK Shared Prosperity Fund, Levelling Up Partnerships, Freeports.\n\n### Guardrails\n\nLargely discretionary. Constrained by funding programme rules.\n\n### Demand drivers\n\nInward investment enquiries; business support; high street regeneration; capital project delivery.\n\n### Pressures\n\nFunding programme complexity. Outcome measurement against growth goals. Longer time horizon of regeneration against electoral cycles.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted business case drafting.\n- **Workflows**: business portal for support.\n- **Data**: local economic analytics; intervention evaluation.\n\n### Agentic future\n\nAI-assisted. Policy and investment decisions are political. Agentic value in evidence assembly, evaluation, and programme reporting.\n\n---\n\n## 16. Flood risk and coastal management\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory duty as LLFA (upper tier or unitary) • Defined cooperation with EA and IDBs |\n| **Headline pressures** | Climate change incident frequency • Capital scheme cost • SuDS approval burden |\n| **Headline opportunities** | AI-assisted modelling • SuDS application workflow • Flood incident database |\n\n*Lead Local Flood Authority functions and coastal protection.*\n\n### How it works\n\nA Lead Local Flood Authority team maintains the local flood risk management strategy, responds to flood incidents, investigates significant floods, and delivers capital schemes jointly with the Environment Agency, Internal Drainage Boards, and water companies. Schedule 3 SuDS approvals, once commenced, will add an application-processing duty. Planning advice on flood risk runs alongside development management.\n\n### Legal basis\n\nFlood and Water Management Act 2010; Land Drainage Act 1991; Coast Protection Act 1949.\n\n### Guardrails\n\nStatutory duty as LLFA (upper tier or unitary). Defined cooperation with Environment Agency and Internal Drainage Boards.\n\n### Demand drivers\n\nFlood incidents; SuDS approvals (post-schedule 3 commencement); coastal erosion response.\n\n### Pressures\n\nClimate change-driven incident frequency. Capital scheme cost. SuDS approval resource burden.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted modelling.\n- **Workflows**: SuDS application workflow.\n- **Data**: flood incident database; climate projection overlays.\n\n### Agentic future\n\nAI-assisted. Engineering and planning judgement required.\n\n---\n\n## 17. Emergency planning and resilience\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty (Category 1 responder) • Joint arrangements via LRF |\n| **Headline pressures** | Planning assumptions maintenance • Partner interoperability • Wider council mobilisation |\n| **Headline opportunities** | AI incident log-keeping • Resilience Direct integration • Risk register analytics |\n\n*Category 1 responder duties under the Civil Contingencies Act 2004.*\n\n### How it works\n\nResilience officers maintain risk registers, plans, and arrangements; exercise with partners through the Local Resilience Forum; and coordinate council response to incidents. Activation is event-driven — flooding, severe weather, public health, fire, major accident — with a duty rota covering out of hours. Recovery work (rehousing, business support, public inquiry preparation) can run for months or years after the initial response.\n\n### Legal basis\n\nCivil Contingencies Act 2004; Local Government Act 1972 s138 (emergencies).\n\n### Guardrails\n\nStatutory duty. Joint arrangements via the Local Resilience Forum.\n\n### Demand drivers\n\nPlanned exercises; real incidents (flooding, severe weather, public health, CBRN); post-incident recovery.\n\n### Pressures\n\nPlanning assumptions maintenance. Interoperability with partners. Mobilisation of wider council capacity during a response.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted incident log-keeping.\n- **Workflows**: Resilience Direct integration; mobilisation workflow.\n- **Data**: risk register analytics.\n\n### Agentic future\n\nHuman-in-the-loop. Command-and-control is a human function. Agentic value in log, intelligence assembly, and after-action analysis.\n\n---\n\n## 18. Civil registration (births, deaths, marriages)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory • Process-mandated • Timescale-mandated (42 days births, 5 days deaths) |\n| **Headline pressures** | CReST programme migration (2026–2028) • Major operating model change |\n| **Headline opportunities** | Online death and birth registration • Births caseworking portal • Public-facing online registration |\n\n*Statutory registration service — births, deaths, marriages, civil partnerships, citizenship.*\n\n### How it works\n\nRegistrars hold statutory individual office and conduct registrations in person — of births (42-day duty), deaths (now with medical examiner scrutiny before release), marriages, and civil partnerships. Ceremonies (marriage, civil partnership, citizenship) are booked and conducted at registered venues. The CReST programme from 2026 to 2028 is introducing online death registration, birth caseworking portals, and public-facing online registration — materially changing the ratio of appointment work to back-office casework.\n\n### Legal basis\n\nBirths and Deaths Registration Act 1953; Marriage Act 1949; Civil Partnership Act 2004; Registration Service Act 1953.\n\n### Guardrails\n\nStatutory. Process-mandated (the registration schemes). Timescale-mandated (42 days for births, 5 days for deaths, though now with medical examiner interface).\n\n### Demand drivers\n\nBirth cohort (falling in many places); death cohort (rising); marriage and partnership bookings (ceremonial income).\n\n### Pressures\n\nThe CReST (Civil Registration Service Transformation) programme is introducing telephone death registration, a births caseworking portal, and full public-facing online registration by 2027. Major operating model change.\n\n### Digital and data opportunities\n\n- **Productivity**: online death and birth registration.\n- **Workflows**: CReST migration.\n- **Data**: volume and demand analytics.\n\n### Agentic future\n\nHuman-in-the-loop. Registrar remains the statutory actor. The CReST changes fundamentally reshape the work — appointment volume contracts, back-office caseworking becomes the central task, and the human registrar's role concentrates on complex cases and ceremonial work.\n\n---\n\n## Cross-cutting themes in Place\n\nTwo themes are worth surfacing.\n\n- **Income coupling.** Place contains many of the council services where income and cost are most closely coupled — licensing, parking, commercial waste, building control, leisure, and parts of planning all operate with fee income expectations that have to be managed alongside service design. A transformation proposal that breaks the income model without a replacement is a non-starter.\n- **Two-tier displacement risk.** Place contains the services most at risk of displacement by unitary reorganisation in two-tier areas — collection/disposal integration, planning policy and development management integration, and environmental health/trading standards integration are three of the most significant integration opportunities in LGR.\n\nA third theme is worth flagging where relevant:\n\n- **The regulatory cluster.** Environmental health, trading standards, licensing, building control, and PRS enforcement (which sits in Housing) share an intelligence and enforcement methodology that increasingly invites cross-service operating models. Specialist professional depth is retained per regime; the supporting infrastructure — intelligence, case management, civil penalties, prosecution — is shared.\n\n## A reimagined operating model for Place\n\nPlace contains the council's regulatory functions, infrastructure services, and place-shaping activities. From the inside these look like separate disciplines with different legal regimes and different professional cultures. From the outside — the resident's, the business's, the visitor's — they are often indistinguishable. The reimagined model unifies sensing, intelligence, and response across the directorate while preserving the specific statutory decision authorities within each regime.\n\n### From reactive inspection to continuous sensing\n\nThe highway network, the waste collection round, the PRS, the food business estate, the licensed premises landscape — each today is known through inspection cycles, complaint reports, and compliance returns. Each in the reimagined model is known through continuous sensing: vehicle-mounted cameras, resident reporting apps, satellite imagery, business data flows, complaint patterns, cross-council intelligence. The inspector's role shifts from discovering defects to resolving the hardest cases the sensing layer has already identified.\n\n### From application queues to continuous conversation\n\nPlanning, building control, and licensing share a workflow shape — a proposal, a determination, conditions, enforcement. Each today is experienced by applicants as a submission followed by a long wait for a decision. Each in the reimagined model is a continuous conversation: pre-application iteration with immediate policy feedback, validation and consultation in parallel, determination against the outcome-tests of the statutory frame. The officer's attention reserves for the negotiation of complex major schemes, controversial applications, and enforcement judgements.\n\n### From scheme design as policy event to scheme management as continuous optimisation\n\nParking schemes, low-traffic neighbourhoods, controlled parking zones, waste rounds, bus routes, and licensing policies are today designed episodically, consulted on publicly, implemented, and then largely left in place until the next review. The reimagined model runs each as a continuously optimised system against intended outcomes, with periodic members' decisions on policy parameters. The political decision remains political; the operational optimisation that follows becomes continuous rather than annual.\n\n### What combines\n\nThe regulatory services — environmental health, trading standards, licensing, PRS enforcement, building control — share enough in intelligence, inspection methodology, and enforcement tools that a unified regulatory fabric makes sense, with specialist teams retained for the professional depth each regime requires. Planning and building control share technical review of built proposals. Waste collection, waste disposal, and street cleansing become one street-scene operation. Emergency planning, resilience, and incident response become continuous monitoring rather than event-triggered activation.\n\n### What remains irreducibly human\n\nThe s70 planning decision on a controversial application. The licensing committee hearing of a contested premise. The environmental health prosecution in court. The emergency response command decision. The scheme design conversation between officers, members, and communities. The member-facing judgement on a politically live site.\n\n### The risks and hard constraints\n\nSensing systems create intrusion risks. A council that knows where every vehicle is, when every bin is presented, whose premises produce complaints — this is a city dashboard that is useful to the council and can be opaque to the resident. The public legitimacy of the reimagined Place directorate depends on transparency, proportionality, and a clear line between what is sensed for operational reasons and what would amount to surveillance. This is a design question with political answers, not a technical one. The income-coupling constraint also binds: reimagined Place services must preserve or redesign the fee bases that currently fund them.\n"};

function getSkillSlice(skillFiles, includeServicesFile, directorate) {
  const parts = [];
  for (const f of skillFiles) {
    if (SKILL_CONTENT[f]) {
      parts.push('# Reference: ' + f + '\n\n' + SKILL_CONTENT[f]);
    }
  }
  if (includeServicesFile && directorate) {
    const serviceFile = 'services/' + directorate + '.md';
    if (SKILL_CONTENT[serviceFile]) {
      parts.push('# Reference: ' + serviceFile + '\n\n' + SKILL_CONTENT[serviceFile]);
    }
  }
  return parts.join('\n\n---\n\n');
}

function buildSystemPrompt(section) {
  // Returns array of content blocks: a cacheable common prefix + section-specific suffix
  // The cacheable prefix includes the full operating model skill so it's identical across all sections.
  // First call pays full price; calls 2-11 hit cache for the cached portion at ~10% of cost.
  
  // Build the cacheable common prefix (style guide + all skill files)
  const allSkillKeys = Object.keys(SKILL_CONTENT);
  const allSkillContent = allSkillKeys.map(function(f) {
    return '# Reference: ' + f + '\n\n' + SKILL_CONTENT[f];
  }).join('\n\n---\n\n');
  
  const cacheablePrefix = STYLE_GUIDE + '\n\n# Operating model reference content (all files)\n\n' + allSkillContent;
  
  // Build the section-specific suffix
  // CRITICAL: Output format goes FIRST so the model sees it before the task description
  var sectionSpecific = '';
  
  if (section.format === 'json' && section.schema) {
    sectionSpecific += '# CRITICAL: Output format\n\n';
    sectionSpecific += 'You MUST return ONLY a valid JSON object matching this exact schema. No prose narrative outside the JSON. No markdown fences. No preamble or explanation. Just the JSON object:\n\n';
    sectionSpecific += section.schema + '\n\n';
    sectionSpecific += 'Any narrative content you write must go INSIDE the JSON fields (e.g. inside a "narrative" string field), not outside the JSON object.\n\n';
    sectionSpecific += '---\n\n';
  } else if (section.format === 'markdown') {
    sectionSpecific += '# Output format\n\n';
    sectionSpecific += 'Return markdown prose. No JSON. No preamble like "Here is the section...". Just the content.\n\n';
    sectionSpecific += '---\n\n';
  }
  
  sectionSpecific += '# Section: ' + section.title + '\n\n';
  sectionSpecific += section.sectionInstructions.trim() + '\n\n';
  
  // Hint which reference files are most relevant for this section
  if (section.skillFiles.length > 0 || section.includeServicesFile) {
    var relevant = section.skillFiles.slice();
    if (section.includeServicesFile && S.directorate) {
      relevant.push('services/' + S.directorate + '.md');
    }
    sectionSpecific += '# Most relevant reference files for this section\n\n' + relevant.join(', ') + '\n\n';
  }
  
  // Final reminder of format (reinforces the top instruction)
  if (section.format === 'json' && section.schema) {
    sectionSpecific += '\n# REMINDER\n\nWrap your entire output in the JSON schema shown at the top. Do not write prose outside the JSON. Start your response with { and end with }.\n\n';
  }
  
  return [
    { type: 'text', text: cacheablePrefix, cache_control: { type: 'ephemeral' } },
    { type: 'text', text: sectionSpecific }
  ];
}

      if (m.rationale) line += ' — ' + m.rationale;
      parts.push(line);
    }
  }
  parts.push('');

  // Reform
  parts.push('## Reform context responses');
  const reformResponses = [];
  for (const reformId in S.reform) {
    if (reformId === 'other') continue;
    const r = S.reform[reformId];
    if (r && (r.relevance || r.readiness || r.note)) {
      let line = '- ' + reformId + ':';
      if (r.relevance) line += ' relevance=' + r.relevance;
      if (r.readiness) line += ', readiness=' + r.readiness;
      if (r.note) line += ' — ' + r.note;
      reformResponses.push(line);
    }
  }
  if (reformResponses.length === 0) {
    parts.push('(No reform context responses captured.)');
  } else {
    parts.push(reformResponses.join('\n'));
  }
  if (S.reform && S.reform.other) {
    parts.push('Other reform context: ' + S.reform.other);
  }
  parts.push('');

  // Earlier generated sections (for downstream sections to reference)
  const earlierKeys = Object.keys(S.generatedSections || {});
  if (earlierKeys.length > 0) {
    parts.push('## Earlier sections generated in this Design Pack');
    parts.push('Use these for synthesis. Do not duplicate; build on them.');
    parts.push('');
    for (const secId of earlierKeys) {
      const content = S.generatedSections[secId];
      let display;
      if (typeof content === 'string') {
        display = content;
      } else {
        display = JSON.stringify(content, null, 2);
      }
      parts.push('### ' + secId);
      parts.push(display);
      parts.push('');
    }
  }

  parts.push('## TASK');
  parts.push('Generate the "' + section.title + '" section for this Design Pack, following the section instructions and output format in the system prompt.');
  if (section.format === 'json') {
    parts.push('');
    parts.push('REMEMBER: Return ONLY the JSON object. Start with { and end with }. No prose preamble. No markdown fences.');
  }

  return parts.join('\n');
}

// ── JSON parsing with fence stripping ────────────────────────────────────────

function parseJsonResponse(text) {
  // Log raw response so we can inspect when things go wrong
  if (typeof console !== 'undefined' && console.log) {
    console.log('[parseJsonResponse] raw response length:', text ? text.length : 0);
    if (text && text.length < 500) console.log('[parseJsonResponse] full text:', text);
    else if (text) console.log('[parseJsonResponse] first 300 chars:', text.substring(0, 300));
  }
  
  if (!text || typeof text !== 'string') {
    throw new Error('Empty or invalid response from API (got ' + typeof text + ')');
  }
  
  let cleaned = text.trim();
  if (cleaned.length === 0) {
    throw new Error('Response was empty after trim. Original length: ' + text.length);
  }
  
  // Use fromCharCode to avoid any escape-character ambiguity with backticks
  const TICK = String.fromCharCode(96);
  const FENCE = TICK + TICK + TICK;
  
  // Strip leading markdown code fence
  if (cleaned.indexOf(FENCE + 'json') === 0) {
    cleaned = cleaned.substring(FENCE.length + 4);
  } else if (cleaned.indexOf(FENCE) === 0) {
    cleaned = cleaned.substring(FENCE.length);
  }
  // Strip trailing markdown code fence
  if (cleaned.length >= FENCE.length && cleaned.lastIndexOf(FENCE) === cleaned.length - FENCE.length) {
    cleaned = cleaned.substring(0, cleaned.length - FENCE.length);
  }
  cleaned = cleaned.trim();
  
  // Find the JSON object boundaries
  const firstBrace = cleaned.indexOf('{');
  const lastBrace = cleaned.lastIndexOf('}');
  
  if (firstBrace === -1) {
    // No JSON object in response — the model returned prose
    const preview = text.substring(0, 400).replace(/\n/g, ' ');
    throw new Error('Model returned prose instead of JSON. Response started with: "' + preview + (text.length > 400 ? '...' : '') + '"');
  }
  
  if (lastBrace === -1 || lastBrace < firstBrace) {
    // Found { but no matching }, likely truncated mid-object
    const preview = text.substring(0, 400).replace(/\n/g, ' ');
    throw new Error('Response appears truncated — JSON object never closed. First 400 chars: "' + preview + '"');
  }
  
  // Slice to just the JSON object
  if (firstBrace > 0 || lastBrace < cleaned.length - 1) {
    cleaned = cleaned.substring(firstBrace, lastBrace + 1);
  }
  
  if (cleaned.length === 0) {
    throw new Error('Content empty after JSON boundary extraction');
  }
  
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    const preview = cleaned.substring(0, 400).replace(/\n/g, ' ');
    throw new Error('JSON.parse failed: ' + e.message + '. Cleaned content: "' + preview + (cleaned.length > 400 ? '...' : '') + '"');
  }
}

// ── Section generation with retry ────────────────────────────────────────────

async function generateSection(sectionId) {
  const section = SYNTHESIS_SECTIONS.find(s => s.id === sectionId);
  if (!section) throw new Error('Unknown section: ' + sectionId);

  if (!S.synthesisStatus) S.synthesisStatus = {};
  if (!S.synthesisErrors) S.synthesisErrors = {};

  S.synthesisStatus[sectionId] = 'generating';
  S.synthesisErrors[sectionId] = null;
  updateSynthDisplay();

  const system = buildSystemPrompt(section);
  const user = buildUserMessage(section);

  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const response = await callClaude(
        [{ role: 'user', content: user }],
        system,
        section.maxTokens
      );

      let parsed;
      if (section.format === 'json') {
        parsed = parseJsonResponse(response);
      } else {
        parsed = response.trim();
      }

      S.generatedSections[sectionId] = parsed;
      S.synthesisStatus[sectionId] = 'complete';
      S.synthesisErrors[sectionId] = null;
      saveSession();
      updateSynthDisplay();
      return parsed;
    } catch (e) {
      console.error('Section ' + sectionId + ' attempt ' + attempt + ' failed:', e.message);
      if (attempt === 3) {
        S.synthesisStatus[sectionId] = 'failed';
        S.synthesisErrors[sectionId] = e.message;
        saveSession();
        updateSynthDisplay();
        throw e;
      }
      await new Promise(r => setTimeout(r, 2000 * attempt));
    }
  }
}

// ── Run all sections sequentially ────────────────────────────────────────────

let synthesisRunning = false;

async function runSynthesis() {
  if (synthesisRunning) return;
  synthesisRunning = true;
  updateSynthDisplay();

  try {
    for (const section of SYNTHESIS_SECTIONS) {
      if (S.synthesisStatus && S.synthesisStatus[section.id] === 'complete') continue;
      try {
        await generateSection(section.id);
      } catch (e) {
        console.error('Continuing despite ' + section.id + ' failure:', e.message);
      }
    }
    
    // After all AI sections complete, generate methodology from template
    S.generatedSections.methodologyAppendix = generateMethodologyTemplated();
    saveSession();
  } finally {
    synthesisRunning = false;
    updateSynthDisplay();
  }
}

async function retrySection(sectionId) {
  if (synthesisRunning) return;
  synthesisRunning = true;
  updateSynthDisplay();
  try {
    await generateSection(sectionId);
  } catch (e) {
    alert('Section "' + sectionId + '" failed again: ' + e.message);
  } finally {
    synthesisRunning = false;
    updateSynthDisplay();
  }
}

// ── Synthesis stage UI ───────────────────────────────────────────────────────

function renderSynth() {
  if (!S.synthesisStatus) S.synthesisStatus = {};
  if (!S.synthesisErrors) S.synthesisErrors = {};

  const parts = [];
  const dirName = DIRECTORATES[S.directorate] ? DIRECTORATES[S.directorate].name : S.directorate;

  parts.push('<div class="card">');
  parts.push('<div class="card-label">Stage 6 of 8 &middot; Synthesis</div>');
  parts.push('<h1>Synthesis</h1>');
  parts.push('<p class="lead">The design pack will be generated using the diagnostic inputs you captured, the council-operating-model skill, and the council-croydon adapter. Each section is reviewable in the next stage before you download the Word document.</p>');
  
  // Timing expectation-setting alert (prominent)
  parts.push('<div class="alert alert-warning">');
  parts.push('<div class="alert-icon" aria-hidden="true">&#9888;</div>');
  parts.push('<div class="alert-body">');
  parts.push('<div class="alert-title">This may take 2&ndash;3 minutes</div>');
  parts.push('Sections generate one after another. Keep this page open and do not refresh while it runs. Each section turns green with a tick as it completes. If a section fails you can retry it individually without restarting the whole synthesis.');
  parts.push('</div></div>');

  // Captured summary
  const inScope = (S.context.servicesInScope || []).length;
  let exceptions = 0;
  for (const sId in S.pressures) {
    for (const dId in S.pressures[sId]) {
      const r = S.pressures[sId][dId].rating;
      if (r === 'critical' || r === 'elevated') exceptions++;
    }
  }
  const maturityCount = Object.keys(S.maturity).filter(k => S.maturity[k].score).length;
  let reformCount = 0;
  for (const k in S.reform) {
    if (k === 'other') continue;
    const r = S.reform[k];
    if (r && (r.relevance || r.readiness)) reformCount++;
  }

  parts.push('<div class="alert alert-info">');
  parts.push('<div class="alert-icon" aria-hidden="true">&#9432;</div>');
  parts.push('<div class="alert-body">');
  parts.push('<div class="alert-title">Captured for synthesis</div>');
  parts.push(inScope + ' services in scope &middot; ' + exceptions + ' pressure exceptions flagged &middot; ' + maturityCount + '/' + MATURITY_DIMENSIONS.length + ' maturity dimensions scored &middot; ' + reformCount + ' reform responses');
  parts.push('</div></div>');

  // Sections list
  parts.push('<div class="synth-sections">');
  for (let i = 0; i < SYNTHESIS_SECTIONS.length; i++) {
    const section = SYNTHESIS_SECTIONS[i];
    const status = (S.synthesisStatus && S.synthesisStatus[section.id]) || 'waiting';

    let icon;
    if (status === 'waiting') icon = '&#9675;';
    else if (status === 'generating') icon = '&#9680;';
    else if (status === 'complete') icon = '&#10003;';
    else if (status === 'failed') icon = '&#10007;';

    parts.push('<div class="synth-section synth-status-' + status + '">');
    parts.push('<div class="synth-section-header">');
    parts.push('<span class="synth-section-icon synth-icon-' + status + '">' + icon + '</span>');
    parts.push('<div class="synth-section-info">');
    parts.push('<div class="synth-section-title">' + escapeHtml((i + 1) + '. ' + section.title) + '</div>');
    parts.push('<div class="synth-section-desc">' + escapeHtml(section.description) + '</div>');
    parts.push('</div>');
    parts.push('<div class="synth-section-actions">');
    if (status === 'failed' && !synthesisRunning) {
      parts.push('<button class="btn btn-ghost btn-small" onclick="retrySection(\'' + section.id + '\')">Retry</button>');
    }
    if (status === 'complete') {
      parts.push('<button class="btn btn-ghost btn-small" onclick="togglePreview(\'' + section.id + '\')">Preview</button>');
    }
    parts.push('</div>');
    parts.push('</div>');
    if (S.synthesisErrors && S.synthesisErrors[section.id]) {
      parts.push('<div class="synth-section-error">' + escapeHtml(S.synthesisErrors[section.id]) + '</div>');
    }
    parts.push('<div class="synth-section-preview" id="preview-' + section.id + '" style="display:none;"></div>');
    parts.push('</div>');
  }
  parts.push('</div>');

  // Navigation buttons
  const allComplete = SYNTHESIS_SECTIONS.every(s => S.synthesisStatus[s.id] === 'complete');
  const anyComplete = SYNTHESIS_SECTIONS.some(s => S.synthesisStatus[s.id] === 'complete');

  parts.push('<div class="stage-nav">');
  parts.push('<button class="btn btn-ghost" onclick="go(\'reform\')">&larr; Back to reform context</button>');
  parts.push('<div class="stage-nav-right">');
  if (allComplete && !synthesisRunning) {
    parts.push('<button class="btn btn-primary" onclick="finishSynthesis()">Continue to review &rarr;</button>');
  } else if (synthesisRunning) {
    parts.push('<button class="btn btn-primary" disabled>Generating&hellip;</button>');
  } else if (!anyComplete) {
    parts.push('<button class="btn btn-primary" onclick="runSynthesis()">Generate Design Pack</button>');
  } else {
    parts.push('<button class="btn btn-primary" onclick="runSynthesis()">Continue generation</button>');
  }
  parts.push('</div>');
  parts.push('</div>');

  parts.push('</div>');
  return parts.join('');
}

function bindSynth() {
  // No event handlers needed beyond inline onclick — interactions delegated through render
}

function updateSynthDisplay() {
  if (S.view === 'synth') {
    const main = document.getElementById('main-content');
    if (main) {
      main.innerHTML = renderSynth();
      bindSynth();
    }
  }
}

function togglePreview(sectionId) {
  const div = document.getElementById('preview-' + sectionId);
  if (!div) return;
  if (div.style.display === 'none' || !div.style.display) {
    const content = S.generatedSections[sectionId];
    let html = '';
    if (typeof content === 'string') {
      html = '<pre style="white-space: pre-wrap; font-family: inherit; font-size: 13px; margin:0;">' + escapeHtml(content) + '</pre>';
    } else {
      html = '<pre style="white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; margin:0;">' + escapeHtml(JSON.stringify(content, null, 2)) + '</pre>';
    }
    div.innerHTML = html;
    div.style.display = 'block';
  } else {
    div.style.display = 'none';
  }
}

function finishSynthesis() {
  markStageDone('synth');
  go('review');
}
