| **Headline opportunities** | AI-drafted assessments • End-to-end digital application • Recruitment funnel analysis |\n\n*Recruiting, assessing, and supporting foster carers and adopters, and placing children.*\n\n### How it works\n\nFostering enquiries come through advertising, word of mouth, and existing carer networks; adopters increasingly enter through Regional Adoption Agencies. Applicants go through information sessions, initial checks, a Form F (or equivalent) full assessment, and approval by a fostering or adoption panel. Approved carers or adopters are then matched to children — directly when a looked after child needs a placement, or via family-finding for adopters after a placement order. Post-approval support, training, and annual reviews continue throughout.\n\n### Legal basis\n\nAdoption and Children Act 2002; Fostering Services Regulations 2011; Care Standards Act 2000.\n\n### Guardrails\n\nStatutory duty. Process-mandated (assessment and approval processes). Regulated by Ofsted.\n\n### Demand drivers\n\nChildren requiring placements, set against recruitment and retention of foster carers. Regional Adoption Agencies (RAAs) have consolidated most adoption activity.\n\n### Pressures\n\nCarer recruitment (historically slow, cumulative decline in net carer numbers in many councils). Assessment timescales. Commissioned interface with independent fostering agencies (higher cost per placement).\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted carer assessments and annual reviews.\n- **Workflows**: end-to-end digital application and assessment from enquiry; structured matching platform.\n- **Data**: carer diversity analytics; placement success prediction; recruitment funnel analysis.\n\n### Agentic future\n\nHuman-in-the-loop. Carer assessment is a regulated professional judgement. Recruitment funnel (enquiry to approval) is highly suitable for agent-assisted workflow and may be one of the higher-yield targets for conversion rate improvement.\n\n---\n\n## 6. Care leavers\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated (pathway plan, PA) • Outcome-mandated |\n| **Headline pressures** | Suitable accommodation for 16–18 cohort • Pathway plan quality • Hard-to-reach engagement |\n| **Headline opportunities** | AI-drafted pathway plans • Young-person-facing app • EET and accommodation outcomes tracking |\n\n*Support for young people leaving the care of the local authority, typically from 16 to 25.*\n\n### How it works\n\nFrom 16, children in care are allocated a Personal Adviser alongside their social worker, and at 18 responsibility transitions to the leaving care team. A pathway plan is reviewed six-monthly covering accommodation, education, employment and training, health, relationships, finances, and identity. The Personal Adviser holds the primary relationship through moves, crises, and milestones. The council's published local offer sets out the specific support available (setting-up costs, council tax exemption, bursaries, and the extended Staying Close duty).\n\n### Legal basis\n\nChildren Act 1989 ss23A–D; Children and Social Work Act 2017 (local offer, corporate parenting principles); Children's Wellbeing and Schools Act 2025 (extended Staying Close duty to 25).\n\n### Guardrails\n\nStatutory duty. Process-mandated (pathway plan, Personal Adviser). Outcome-mandated (corporate parenting).\n\n### Demand drivers\n\nFlows from looked after children cohort. The 2025 Act extends the staying close duty to 25, which will materially expand the cohort receiving structured support.\n\n### Pressures\n\nSuitable accommodation for 16–18 cohort (the unregulated semi-independent accommodation ban). Pathway plan quality. Engagement with the harder-to-reach fifth of care leavers.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted pathway plans.\n- **Workflows**: young-person-facing app for the local offer, PA diary, and communication.\n- **Data**: outcomes tracking against education, employment, training, health, and accommodation indicators.\n\n### Agentic future\n\nHuman-in-the-loop. The Personal Adviser relationship is the heart of the service. Agentic tools support administration, young-person-facing information, and outcome tracking.\n\n---\n\n## 7. Early help and family support\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Largely discretionary • Anchored by Children Act 1989 s17 (children in need) |\n| **Headline pressures** | Budget pressure • Outcomes against thresholds • Family Hubs integration |\n| **Headline opportunities** | Parent-facing self-referral • Predictive escalation analytics • Family Hub booking |\n\n*Preventative, multi-agency support for families below statutory thresholds.*\n\n### How it works\n\nFamilies are identified by schools, health visitors, Family Hubs, and GPs, or self-refer through the council's front door. A lead practitioner completes an Early Help Assessment with the family and convenes a Team Around the Family meeting to agree a plan. Interventions are delivered by family workers, parenting programmes, Family Hub services, and voluntary sector partners. Cases close when outcomes are met, step down from statutory services, or step up if concerns escalate.\n\n### Legal basis\n\nDiscretionary, but underpinned by Children Act 1989 s17 (children in need) and emerging Family Help framework.\n\n### Guardrails\n\nLargely discretionary — the main statutory anchor is the children in need duty, with early help as prevention of escalation. Family Help funding is being consolidated.\n\n### Demand drivers\n\nReferrals stepped down from MASH; direct referrals from schools and health; Family Hub footfall. Demand is elastic to offer.\n\n### Pressures\n\nBudget pressure (universal services often the first cut). Demonstrating outcomes against statutory thresholds. Integration of Family Hubs with early help team structures.\n\n### Digital and data opportunities\n\n- **Productivity**: structured assessment and review tools; AI-drafted plans.\n- **Workflows**: parent-facing self-referral and self-assessment; Family Hub booking and resource access.\n- **Data**: predictive analytics on escalation risk; outcome tracking against child in need conversion rates.\n\n### Agentic future\n\nHuman-in-the-loop. Core family work is relational. Agentic value concentrates in outcome measurement, resource navigation for families, and early-warning analytics. A stronger case than almost any other CYPE service for self-service digital channels for universal advice.\n\n---\n\n## 8. Youth offending\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty to establish YOT • Process-mandated by YJB • Actor-mandated for court work |\n| **Headline pressures** | Concentration of high-risk cases • Extra-familial harm • MH/neurodiversity prevalence • Secure estate crisis |\n| **Headline opportunities** | AI-drafted court reports • Structured AssetPlus tools • Disproportionality analytics |\n\n*Multi-agency team working with children in the criminal justice system.*\n\n### How it works\n\nMost low-level youth offending is diverted by police to community resolutions; remaining cases reach the YOT through out-of-court disposals or court convictions. A YOT officer completes an AssetPlus risk and needs assessment, drafts pre-sentence reports for court, and case-manages community sentences through to completion. The YOT combines social work, police, probation, health, and education expertise in a single team. Custodial transitions, resettlement, and through-care are the highest-risk part of the work.\n\n### Legal basis\n\nCrime and Disorder Act 1998 s39 (Youth Offending Teams); Legal Aid, Sentencing and Punishment of Offenders Act 2012.\n\n### Guardrails\n\nStatutory duty to establish a YOT. Process-mandated by YJB frameworks. Actor-mandated for court work (qualified YOT officer).\n\n### Demand drivers\n\nPolice referrals; out-of-court disposals; court orders; custody transitions. National trend has been falling first-time entrants, though concentrated cohorts (high-risk, complex, exploited) remain.\n\n### Pressures\n\nConcentration of very high-risk cases. Extra-familial harm (county lines, serious youth violence). Mental health and neurodiversity prevalence in the cohort. Secure estate crisis affecting remand and custody transitions.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted pre-sentence reports and court reports; structured risk assessment tools (AssetPlus).\n- **Workflows**: joined-up intervention planning across partners.\n- **Data**: cohort analytics; desistance tracking; disproportionality analysis.\n\n### Agentic future\n\nHuman-in-the-loop. Statutory work in the criminal justice system requires human professional judgement and accountability. Agentic tools for reports, risk summarisation, and analytics.\n\n---\n\n## 9. Children with disabilities\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Outcome-mandated |\n| **Headline pressures** | Short breaks commissioning • Transitions planning • DFG interface |\n| **Headline opportunities** | CYPE→ASCH transitions tools • Family-facing short breaks portal • Equipment lifecycle analytics |\n\n*Social work service for disabled children and their families, and specialist short breaks.*\n\n### How it works\n\nA specialist team holds the cohort, with referrals from education (mostly at 14+), health, and parents. Needs assessments proceed under s17 of the Children Act with specialist expertise in medical complexity and disability. Care packages combine short breaks, direct payments, personal assistants, and specialist health input. Transitions to adult services from 14 onwards are a core and growing part of the work.\n\n### Legal basis\n\nChildren Act 1989 s17 and schedule 2 para 6; Chronically Sick and Disabled Persons Act 1970; Children and Families Act 2014 part 3 (SEND).\n\n### Guardrails\n\nStatutory duty. Process-mandated (assessment). Outcome-mandated (meeting needs).\n\n### Demand drivers\n\nPrevalence of complex disability and medical complexity has risen sharply over 15 years. Transitions demand concentrated at 14+.\n\n### Pressures\n\nShort breaks commissioning. Transitions planning quality (frequently a source of complaint). Equipment/adaptations interface with Housing DFG.\n\n### Digital and data opportunities\n\n- **Productivity**: structured transitions planning tools spanning CYPE–ASCH.\n- **Workflows**: family-facing short breaks booking portal.\n- **Data**: transitions demand forecasting; equipment lifecycle; outcomes.\n\n### Agentic future\n\nHuman-in-the-loop. Relational service. Agentic value in transitions coordination and resource matching.\n\n---\n\n## 10. EHCP needs assessment (current regime)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Timescale-mandated (20 weeks) • Outcome-mandated |\n| **Headline pressures** | 20-week compliance • Plan quality • Independent school placement cost (£61.5k avg) • Tribunal volume • High-needs deficit |\n| **Headline opportunities** | AI-drafted plans from advice • EHC hub for professionals • Demand and Tribunal analytics |\n\n*Statutory assessment of whether a child needs an Education, Health and Care Plan.*\n\n### How it works\n\nA parent, school, or young person submits a request for an EHC needs assessment. The council decides within six weeks whether to assess. If it proceeds, statutory advice is sought from six parties — parent, educational psychologist, school or early years setting, health, social care, and the young person — over the following weeks. A draft plan is issued, parents have 15 days to name a preferred school, and the final plan is issued within 20 weeks end-to-end. Contested decisions proceed to the First-tier Tribunal.\n\n### Legal basis\n\nChildren and Families Act 2014 ss36, 37; SEND Regulations 2014; SEND Code of Practice.\n\n### Guardrails\n\nStatutory duty. Process-mandated (request, decision to assess, advice gathering from six statutory parties, finalisation). Timescale-mandated (20 weeks end-to-end). Outcome-mandated (Plan must specify need and provision).\n\n### Demand drivers\n\nRequests for EHCP have more than doubled since 2014. Autism, social, emotional and mental health, and speech, language and communication are the largest categories. Tribunal appeal rates are high (over 90% found in favour of parents nationally).\n\n### Pressures\n\nStatutory 20-week compliance. Quality and consistency of Plans. Cost of independent school placements (averaging £61,500 per pupil per year for top-up). Tribunal costs. High-needs block deficit.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted plans from advice documents; structured advice templates for educational psychology, health, and social care; automated compliance tracking.\n- **Workflows**: parent portal for request, advice upload, and plan consultation; EHC hub for professional collaboration.\n- **Data**: demand forecasting by cohort; placement cost analytics; Tribunal outcome patterns.\n\n### Agentic future\n\nHuman-in-the-loop. Draft-to-final workflow is tractable for agent-assisted drafting given structured advice inputs. The decisions (to assess, on provision, on placement) remain with qualified professionals and, in some cases, with elected members via delegation. One of the highest-value targets in CYPE for practical AI assistance.\n\n---\n\n## 11. SEND reform — Individual Support Plans and Specialist Provision Packages (future regime)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | To be legislated • Proposed: ISPs statutory, school-led, digital |\n| **Headline pressures** | Transition from 576k EHCPs • Reassessment at phase transitions • Workforce implications |\n| **Headline opportunities** | Standardised digital ISP authoring • Experts at Hand integration • Tier-based cohort analytics |\n\n*The four-tier SEND model proposed in the Schools White Paper, February 2026.*\n\n### How it works\n\nUnder the proposed regime, schools author Individual Support Plans for every child with identified SEND, drawing on the refreshed areas of development and an Experts at Hand service for specialist input. Where complex needs justify a Specialist Provision Package, the local authority determines the package and writes it into an EHCP. The Tribunal's role narrows to reviewing LA decisions for reasonableness rather than naming schools. Implementation begins from 2029 with a six-year transition; no EHCP changes begin before September 2030.\n\n### Legal basis\n\nProposed amendments to Children and Families Act 2014 via future primary legislation. Consultation closes 18 May 2026; implementation from 2029; no EHCP changes before September 2030.\n\n### Guardrails\n\nTo be legislated. Proposed: ISPs are statutory, school-led, digital, and do not carry the full Tribunal appeal rights of current EHCPs. Specialist Provision Packages become the route to an EHCP, determined by the local authority.\n\n### Demand drivers\n\nExpected to expand — every child with identified SEND gets an ISP, including the approximately 1.4 million currently without an EHCP.\n\n### Pressures\n\nTransition from 576,000 active EHCPs to the new model. Reassessment at phase transitions from 2029. Workforce implications (SEND coordinators, EHC writers, Tribunal officers). High-needs deficit resolution.\n\n### Digital and data opportunities\n\n- **Productivity**: digital ISP template (the White Paper explicitly proposes a standardised digital ISP).\n- **Workflows**: school-led authoring with LA visibility; Experts at Hand service integration.\n- **Data**: cohort analytics by tier; outcomes tracking against support provided.\n\n### Agentic future\n\nHuman-in-the-loop. The reform's intent to standardise ISPs creates the conditions for agent-assisted authoring at scale. Likely to become one of the most significant single agentic workflow opportunities in CYPE by the end of the decade, though the detailed design will be shaped by the consultation.\n\n---\n\n## 12. Home-to-school transport\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with near-fully-agentic sub-processes |\n| **Guardrails** | Statutory duty for eligible children • Discretionary beyond eligibility |\n| **Headline pressures** | SEND transport demand (£3.4bn projected by 2030/31) • Specialist placement dispersion • Contract cost escalation |\n| **Headline opportunities** | AI-assisted route optimisation • Parent portal • Cost-per-pupil analytics |\n\n*Statutory transport provision for children meeting eligibility criteria.*\n\n### How it works\n\nParents apply for transport via online or paper application, typically in the spring before the academic year starts. The council checks eligibility against the statutory distance, age, route safety, and SEND criteria. Transport is procured via taxi, minibus, or bus operator frameworks, with route optimisation software matching pupils to vehicles. Passenger assistants are rostered where needed. Appeals and in-year route changes run continuously alongside contract management.\n\n### Legal basis\n\nEducation Act 1996 ss508A–F; School Travel (Pupils with Dual Registration) (England) Regulations 2007.\n\n### Guardrails\n\nStatutory duty for eligible children (based on distance, age, route safety, and SEND). Discretionary beyond eligibility.\n\n### Demand drivers\n\nExpanding SEND transport demand is the largest cost driver — CCN projects SEND transport costs could reach £3.4 billion sector-wide by 2030/31, potentially 85% of councils' school transport budgets.\n\n### Pressures\n\nSpecialist placement dispersion leading to longer journeys. Contract cost escalation with taxi and minibus operators. Safeguarding on transport (passenger assistants). Eligibility disputes.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted route optimisation and vehicle matching.\n- **Workflows**: parent portal for applications, reviews, and journey monitoring.\n- **Data**: cost-per-pupil analytics; route optimisation; demand forecasting tied to EHCP demand.\n\n### Agentic future\n\nHuman-in-the-loop for eligibility decisions. Near-fully agentic for route planning, scheduling, and contract optimisation — these are operational research problems well-suited to automation.\n\n---\n\n## 13. School admissions\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for offer-making, human-in-the-loop for appeals |\n| **Guardrails** | Statutory duty • Process-mandated (Admissions Code) |\n| **Headline pressures** | Appeal panel workload • Falling rolls reorganisation • Fair Access Panel caseload |\n| **Headline opportunities** | AI-assisted appeal drafting • Mature digital admissions platforms • Sufficiency forecasting |\n\n*Administering applications and offers for school places in line with the council's admissions scheme.*\n\n### How it works\n\nParents submit co-ordinated applications for the normal round via the council's online portal, ranking their school preferences. The admissions team validates applications and schools apply their oversubscription criteria — typically distance, catchment, sibling, and faith where relevant. National Offer Day confirms offers; appeal panels hear disputes over the following months. In-year admissions, Fair Access Panel placements for hard-to-place children, and managed moves run continuously outside the normal round.\n\n### Legal basis\n\nSchool Standards and Framework Act 1998; School Admissions Code (statutory); Children's Wellbeing and Schools Act 2025 (extended LA powers over academies).\n\n### Guardrails\n\nStatutory duty to administer; the 2025 Act extends LA powers to direct academies to admit and to object to published admission numbers.\n\n### Demand drivers\n\nNormal round applications across primary and secondary; in-year admissions; appeals; pupils new to the country. Falling primary rolls in many councils are reshaping the sufficiency challenge.\n\n### Pressures\n\nAppeal panel workload. Falling rolls requiring school place reorganisation. Fair Access Panel caseload for hard-to-place children. Managing the politics of school preference outcomes.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted appeal statement drafting.\n- **Workflows**: mature digital admissions platforms (Synergy, Capita One, and others) are well-established.\n- **Data**: demand forecasting against dwelling completions; sufficiency planning; Fair Access Panel analytics.\n\n### Agentic future\n\nFully agentic for offer-making (it already largely is, under equal preference algorithms). Human-in-the-loop for appeals and in-year placement of complex cohorts.\n\n---\n\n## 14. Attendance, exclusions, and children missing education\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with fully-agentic sub-processes |\n| **Guardrails** | Statutory duty • New 2025 Act provisions (CME register, EHE consent) |\n| **Headline pressures** | Persistent absence rates • EHE growth • CME tracking gap • New register duty |\n| **Headline opportunities** | Automated cross-referencing for CME • EHE consent workflow • Predictive absence models |\n\n*Statutory support for school attendance and identification of children not in education.*\n\n### How it works\n\nSchools record attendance and report persistent absence to the council; the council cross-references school rolls, council tax, health, and DWP data to identify children not known to be in education. Attendance officers contact families, use legal sanctions (penalty notices, prosecutions), and work with schools on re-engagement. Elective home education sits with a separate team who conduct welfare visits and, under the 2025 Act, maintain a compulsory register. CME follow-up can run for weeks before a child is located or confirmed as lost to the area.\n\n### Legal basis\n\nEducation Act 1996 s437 (duty); Education Act 2002 s175; Children's Wellbeing and Schools Act 2025 (compulsory Children Not in School register, consent to withdraw).\n\n### Guardrails\n\nStatutory duty. The 2025 Act introduces the Children Not in School register and a new requirement for parental consent (from the LA) to withdraw certain children from school.\n\n### Demand drivers\n\nPost-pandemic persistent absence rates remain elevated. Elective home education numbers have grown sharply. Children missing education lists in every council.\n\n### Pressures\n\nIdentifying and tracking CME (a known data gap). Delivering the new register duty without a data platform. Resourcing attendance officer workforce. Managing contested home education decisions.\n\n### Digital and data opportunities\n\n- **Productivity**: automated cross-referencing of school rolls, council tax, health data, and DWP data to identify CME.\n- **Workflows**: home education consent workflow; parent-facing register submission.\n- **Data**: absence pattern analytics; school-level attendance dashboards; predictive models for children at risk of becoming CME.\n\n### Agentic future\n\nHuman-in-the-loop for consent decisions. Fully agentic for the data-matching that identifies CME — a structural use case that is essentially impossible without automation at council scale.\n\n---\n\n## 15. Early years sufficiency and childcare\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory sufficiency duty • Funding formula |\n| **Headline pressures** | Provider market stability • Childcare workforce crisis • Deprivation-weighted supply gaps |\n| **Headline opportunities** | Automated headcount/funding reconciliation • Parent entitlement checker • Sufficiency mapping |\n\n*Ensuring sufficient childcare places to enable parents to work, learn, or train.*\n\n### How it works\n\nParents check their funded entitlement eligibility and choose a provider — a childminder, nursery, or school-based setting. The council pays providers via headcount funding based on termly returns, applying the national funding formula and monitoring provider quality alongside Ofsted. The sufficiency duty requires annual assessment of supply against demand and intervention where gaps emerge. Provider market management — recruitment support, business advice, specialist grants — runs alongside.\n\n### Legal basis\n\nChildcare Act 2006 s6 (sufficiency duty); funded entitlement regulations (9 months to 3-year-olds, 3- to 4-year-olds, 30 hours).\n\n### Guardrails\n\nStatutory sufficiency duty; administered through the Early Years national funding formula.\n\n### Demand drivers\n\nExtension of funded childcare entitlement to under-3s (phased, full rollout from September 2025) has substantially increased demand and provider viability scrutiny. Birth cohort size in decline in many areas.\n\n### Pressures\n\nProvider market stability. Workforce crisis in the childcare sector. Deprivation-weighted supply gaps. Administrative burden of provider funding.\n\n### Digital and data opportunities\n\n- **Productivity**: automated provider headcount and funding calculation.\n- **Workflows**: parent entitlement checker and booking.\n- **Data**: sufficiency mapping; provider stability indicators; demand forecasting.\n\n### Agentic future\n\nLargely AI-assisted. Some fully agentic potential for headcount/funding reconciliation. Sufficiency planning and market management are policy decisions.\n\n---\n\n## 16. Virtual school\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Virtual School Head named statutory role |\n| **Headline pressures** | Resource against expanded scope (2025 Act) • PEP quality • Pupil Premium Plus utilisation |\n| **Headline opportunities** | AI-drafted PEP reviews • Digital PEP shared across LA, school, carer • Attainment tracking |\n\n*Promoting the educational achievement of looked after children and, increasingly, children in need.*\n\n### How it works\n\nThe Virtual School Head holds responsibility for the educational achievement of looked after children across all their placements, including out of borough. Personal Education Plans are drawn up and reviewed termly with school, carer, and social worker. The team allocates Pupil Premium Plus funding, supports school admissions and exclusions decisions, and advocates for the cohort in wider education forums. The 2025 Act extends the statutory remit to children in need and formal kinship carers.\n\n### Legal basis\n\nChildren and Families Act 2014 s22(3A); Children's Wellbeing and Schools Act 2025 (extending virtual school head to children in need and formal kinship).\n\n### Guardrails\n\nStatutory duty. Virtual School Head is a named statutory role.\n\n### Demand drivers\n\nLooked after children cohort; extension to all children in need will materially expand reach.\n\n### Pressures\n\nResource against expanded scope. Personal Education Plan quality. Pupil Premium Plus utilisation for positive outcomes.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted PEP reviews.\n- **Workflows**: digital PEP shared across LA, school, and carer.\n- **Data**: attainment tracking against national comparators.\n\n### Agentic future\n\nHuman-in-the-loop. Relational and advocacy work. Agentic support in PEP drafting, tracking, and analytics.\n\n---\n\n## 17. School place planning\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory duty • Discretionary on means |\n| **Headline pressures** | School closures and amalgamations • Capital pressure • DfE free school constraint |\n| **Headline opportunities** | Automated roll forecasting • Consultation platforms • Multi-source demographic modelling |\n\n*Planning and securing sufficient primary and secondary school places across the local authority area.*\n\n### How it works\n\nA planning team combines demographic projections, birth data, NHS registration, dwelling completion data, and school census information to forecast demand five to ten years ahead. Where supply is insufficient, options — expansion of existing schools, free school presumption competition, or new maintained schools under the 2025 Act — are appraised and consulted on. Cabinet takes decisions following consultation. Capital programme delivery, through schools' own governance or the council's estates team, completes the cycle.\n\n### Legal basis\n\nEducation Act 1996 s14 (sufficiency duty); School Standards and Framework Act 1998.\n\n### Guardrails\n\nStatutory duty. Discretionary on means (expansion of existing schools, free school presumption, new maintained schools — the 2025 Act reopens this route).\n\n### Demand drivers\n\nDemographic projection; dwelling completions; migration. Falling primary rolls in many urban boroughs reshaping the task from expansion to consolidation.\n\n### Pressures\n\nSchool closures and amalgamations are politically difficult. New provision requires capital. DfE free school process constrains council choice. The 2025 Act changes the academy order regime.\n\n### Digital and data opportunities\n\n- **Productivity**: automated roll forecasting.\n- **Workflows**: consultation platforms for proposals.\n- **Data**: demographic modelling from multiple data sources (births, NHS registration, school census, dwelling completions).\n\n### Agentic future\n\nAI-assisted. Statutory decisions are political, taken by cabinet or members. Forecasting, option appraisal, and consultation analysis are tractable agent tasks.\n\n---\n\n## 18. Child death review and serious incident learning\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Statutory duty on safeguarding partners • Process-mandated |\n| **Headline pressures** | Partner consensus on learning • Translating reviews into practice • Review fatigue |\n| **Headline opportunities** | AI thematic analysis across reviews • Structured templates • Pattern analysis at scale |\n\n*Statutory arrangements for reviewing child deaths and serious safeguarding incidents.*\n\n### How it works\n\nEvery child death is reviewed by a Child Death Overview Panel convened with health partners, with learning fed into local practice. Serious safeguarding incidents are notified to the national Child Safeguarding Practice Review Panel, and a local Child Safeguarding Practice Review is commissioned where the criteria are met. Reviews are led by an independent reviewer, involve all relevant agencies, and produce a published report. Learning dissemination and embedding follow through the safeguarding partnership.\n\n### Legal basis\n\nChildren Act 2004 ss16L–16Q; Working Together; Child Death Review statutory guidance.\n\n### Guardrails\n\nStatutory duty on safeguarding partners. Process-mandated (Child Safeguarding Practice Review, Child Death Review).\n\n### Demand drivers\n\nEvery child death. Serious incidents notified to the Child Safeguarding Practice Review Panel.\n\n### Pressures\n\nReaching partner consensus on learning. Translating reviews into practice change. Avoiding review-fatigue.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted thematic analysis across case reviews; automated extraction of learning themes.\n- **Workflows**: structured review templates; dissemination platform for practitioners.\n- **Data**: pattern analysis across cohorts of reviews.\n\n### Agentic future\n\nAI-assisted. The meaning-making of a review is human. The retrieval, summarisation, and pattern analysis can be substantially automated.\n\n---\n\n## Cross-cutting themes in Children and Education\n\nThree threads run through the directorate.\n\n- **The unresolved reform pipeline.** The Children's Wellbeing and Schools Act 2025 and the Schools White Paper 2026 together represent the most substantial legislative reshaping of children's services since the Children Act 1989 and the Children and Families Act 2014 respectively. Almost every conversation with a council touches one or both.\n- **The cost structure.** Placements (residential, foster, independent school) and home-to-school transport dominate non-salary spend and are the source of most high-needs block pressure.\n- **The data opportunity.** The Single Unique Identifier, the Children Not in School register, and the digital ISP are three separate policy commitments pointing at the same latent capability — a consolidated child-level data view across education, social care, and health. Councils that build that view over the next three years will have a different operating model from those that do not.\n\n## A reimagined operating model for Children and Education\n\nToday a child's life intersects the council through multiple unconnected systems: a school attendance record, a GP record, a social care file, a SEND assessment, an EHCP, a housing tenancy, a family benefit. Each professional sees a slice; no one sees the picture. A reimagined model places the child, with appropriate consent and appropriate professional access, at the centre of a coherent view. The Single Unique Identifier in the Children's Wellbeing and Schools Act 2025 is the legal anchor for this shift.\n\n### From organisational silos to a coherent child view\n\nFor a child, the reimagined model means school attendance, health engagement, safeguarding concerns, SEND support, early help, home address, housing circumstances, and family composition are visible to the professionals supporting them and, age-appropriately, to themselves and their parents. Red flags surface from the pattern across agencies, not from any one of them in isolation. A child whose attendance drops, whose GP attendance spikes, whose household has become eligible for Council Tax Support, whose parent has been notified to the council by police under domestic abuse protocols — this pattern reaches a coordinating agent in days, not months.\n\n### What combines\n\nMASH and early help converge, because the distinction between above threshold and below threshold depends on a judgement that can only be made well with the full picture, and the interventions on either side of the threshold are increasingly similar in shape. SEND, EHCP, ISP, SEND transport, and short breaks move from four processes to one view of one child's additional needs. The virtual school function, extended by the 2025 Act to children in need and formal kinship, becomes a persistent educational presence that follows the child through placement, school, and phase changes rather than starting over at each one. Care leavers' Personal Advisers hold the relationship; the underlying casework is carried by an agent that remembers everything the PA cannot.\n\n### What the statutory actor does\n\nThe qualified social worker's statutory decisions remain: threshold for s47, care proceedings, EHCP determinations. The change is in the work around those decisions. Evidence gathering, chronology drafting, court statement preparation, partner agency chasing, parent and carer communication — all this shifts to the agent layer. The social worker's practitioner time reallocates to direct work with children and families, reflective supervision, and the complex relational judgement at which humans remain uniquely capable.\n\n### What remains irreducibly human\n\nThe relationship with a traumatised child who has disclosed abuse. The decision to remove a baby from its mother. The mediation between contending parents over a disabled child's placement. The honesty required in a statutory review that has to tell parents their parenting is harming their child. These are the reasons the profession requires qualification, supervision, and statutory protection. The reimagined model's purpose is to give practitioners the time and preparation to do them well.\n\n### The risks and hard constraints\n\nCross-system data integration creates new forms of power. A family whose every signal is visible to the state is in a different relationship with the state than one whose is not. Consent frameworks, transparency to families, and the right to contest the inferences drawn must be designed alongside the model, not retrofitted. The legitimate use cases — earlier help, better protection — are clear. So are the risks of illegitimate ones. The SEND reform timeline adds a structural constraint: no EHCP changes before September 2030, a six-year transition, and a consultation still in flight. Designs that presume the future regime are exposed; designs that can operate across both current and future regimes are robust.\n","services/housing.md":"# Housing — services reference\n\nHousing sits in two related but distinct places. Statutory homelessness and the allocation of social housing are upper-tier and unitary functions under the Housing Act 1996. Management of the council's own housing stock — where it has retained one — is governed by the Landlord and Tenant Act 1985, Housing Act 1985, and the regulatory framework set by the Regulator of Social Housing. Private sector housing enforcement and HMO licensing sit with the local housing authority. In two-tier areas these are typically district council functions; this document uses the unitary frame but flags two-tier distinctions where they matter.\n\nThe Renters' Rights Act 2025 represents the most significant expansion of local housing authority enforcement responsibilities in a generation. Phase 1 commences on 1 May 2026; the new investigatory powers for councils are already in force from 27 December 2025. Awaab's Law commenced for social landlords in October 2025; PRS extension is expected in due course.\n\n## Table of contents\n\n| § | Service | Agentic classification |\n|---|---|---|\n| 1 | Homelessness prevention and relief | Human-in-the-loop |\n| 2 | Temporary accommodation | Human-in-the-loop |\n| 3 | Housing register and allocations | Fully agentic for routine, human-in-the-loop for discretionary |\n| 4 | Tenancy management (HRA stock) | Human-in-the-loop, with fully-agentic transactional sub-processes |\n| 5 | Rent collection and income management | Fully agentic for routine, human-in-the-loop for possession and vulnerability |\n| 6 | Responsive repairs | Fully agentic for scheduling, human-in-the-loop for diagnostic |\n| 7 | Planned maintenance and capital works | AI-assisted |\n| 8 | Anti-social behaviour (tenancy and community) | Human-in-the-loop |\n| 9 | Private sector housing enforcement | Human-in-the-loop |\n| 10 | HMO licensing | Fully agentic for routine, human-in-the-loop for inspection and enforcement |\n| 11 | Disabled Facilities Grants (DFGs) | Human-in-the-loop, with near-fully-agentic sub-processes |\n| 12 | Housing advice and options | Fully agentic for routine, human-in-the-loop for complex |\n| 13 | Supported housing commissioning | Human-in-the-loop |\n| 14 | Gypsy, Roma and Traveller sites | Human-in-the-loop |\n| 15 | Leasehold services | Human-in-the-loop, with fully-agentic transactional sub-processes |\n\nCross-cutting themes and reimagined operating model are at the end of this file.\n\n---\n\n## 1. Homelessness prevention and relief\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Timescale-mandated (56-day relief duty) |\n| **Headline pressures** | TA cost • PHP quality • Prevention duty throughput • s184 review and appeal volume |\n| **Headline opportunities** | AI-drafted PHPs • Decision letter drafting • Self-service triage • Prevention analytics |\n\n*Duties to prevent homelessness, then relieve it, for people threatened with or actually homeless.*\n\n### How it works\n\nHouseholds approach the council in person, by phone, or through the online homelessness portal — typically triggered by a Section 21 notice (until Phase 1 RRA commencement on 1 May 2026), a relationship breakdown, a prison release, a friends-and-family placement ending, or domestic abuse. A housing options officer completes an assessment, issues a Personalised Housing Plan, and starts the 56-day relief duty clock. Where homelessness cannot be prevented or relieved, a s184 decision on priority need, intentionality, and local connection determines whether the main housing duty is owed. Emergency and temporary accommodation may be arranged in parallel, and reviews and appeals follow contested decisions.\n\n### Legal basis\n\nHousing Act 1996 Part 7 (as substantially amended by the Homelessness Reduction Act 2017); Homelessness Code of Guidance.\n\n### Guardrails\n\nStatutory duty. Process-mandated (assessment, Personalised Housing Plan, prevention duty, relief duty, main housing duty). Timescale-mandated (relief duty runs for 56 days).\n\n### Demand drivers\n\nPrivate sector evictions (s21 notices, until 1 May 2026); mortgage arrears; domestic abuse (with priority need status); relationship breakdown; prison releases. No Section 21 removal is expected to reshape demand volume and timing.\n\n### Pressures\n\nTemporary accommodation cost. PHP quality. Prevention duty throughput. s184 decision quality that drives review and appeal volumes.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted PHPs; decision letter drafting against statutory tests; case file assembly for reviews.\n- **Workflows**: self-service triage; digital application with eligibility pre-check; document upload.\n- **Data**: prevention outcome analytics; demand forecasting from DWP and court data; TA cost per case.\n\n### Agentic future\n\nHuman-in-the-loop. The s184 decision is a statutory duty requiring trained officers. Agentic value extends across triage, PHP drafting, decision letter generation, review pack assembly, and case tracking. One of the richest opportunity spaces in Housing for visible productivity improvement.\n\n---\n\n## 2. Temporary accommodation\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty • Process-mandated • Outcome-mandated (suitable accommodation) |\n| **Headline pressures** | Market-rate procurement pressure • Out-of-borough placement risk • HRA subsidy cap • UC interface |\n| **Headline opportunities** | AI-assisted suitability matching • Provider portal • Forward demand modelling |\n\n*Securing accommodation for households owed a homelessness duty, often before permanent offer.*\n\n### How it works\n\nWhere a household is owed an interim or main housing duty and cannot stay where they are, the council secures accommodation from its own stock, leased units, nightly-paid providers, or bed and breakfast (used as a last resort with statutory time limits for families). A placement officer matches household to property considering suitability — size, location, access to schools and work, medical needs. Households may stay weeks or years; the council monitors suitability through periodic reviews and moves households when better options become available. Permanent allocation via the housing register, a private rented offer, or move-on supported housing ends the placement.\n\n### Legal basis\n\nHousing Act 1996 ss188, 193, 199A; Homelessness (Suitability of Accommodation) Order 2012.\n\n### Guardrails\n\nStatutory duty. Process-mandated (suitability assessment). Outcome-mandated (accommodation must be suitable).\n\n### Demand drivers\n\nNational TA numbers have reached historic highs; costs are one of the largest single pressures on general fund budgets across London and beyond. Nightly-paid TA (including B&B) the most expensive category.\n\n### Pressures\n\nMarket-rate pressure on TA procurement. Use of out-of-borough placement (legal and political risk). HRA subsidy cap. Interface with Universal Credit housing element.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted suitability matching; automated property reference maintenance.\n- **Workflows**: provider portal for offers; landlord self-serve for property details.\n- **Data**: TA placement cost and length-of-stay analytics; provider performance; forward demand modelling.\n\n### Agentic future\n\nHuman-in-the-loop. Matching and placement decisions remain with officers. Agentic support in suitability screening, availability matching, and financial reporting. Property sourcing (acquiring or leasing stock) is fundamentally a commissioning and capital question that technology alone does not solve.\n\n---\n\n## 3. Housing register and allocations\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for routine, human-in-the-loop for discretionary |\n| **Guardrails** | Statutory duty • Process-mandated (scheme binds the authority) • Outcome-mandated (reasonable preference) |\n| **Headline pressures** | Scheme complexity • Applicant verification • Voids turnaround • Refusals and suspensions |\n| **Headline opportunities** | AI-verified evidence • Automated banding • Mature online platforms • Equity analytics |\n\n*Maintaining the register and allocating social housing in line with the published scheme.*\n\n### How it works\n\nApplicants apply online, providing household, income, and need information. The council verifies eligibility under the Act and the published scheme, then places applicants in bands reflecting need (statutory reasonable preference categories plus local priorities). Applicants bid on properties advertised weekly, or are direct-allocated, with offers verified and accepted or refused. A successful acceptance leads to a tenancy sign-up with the landlord, whether that is the council itself or a partner registered provider.\n\n### Legal basis\n\nHousing Act 1996 Part 6 (ss159–174); scheme published under s166A.\n\n### Guardrails\n\nStatutory duty to have a scheme. Process-mandated (the scheme binds the authority). Outcome-mandated on reasonable preference categories.\n\n### Demand drivers\n\nRegister size typically exceeds annual relet supply by 10x or more. Rising as TA numbers rise.\n\n### Pressures\n\nScheme complexity. Applicant verification (evidence of local connection, need, eligibility). Voids turnaround from landlords. Managing refusals and suspensions.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-verified applicant evidence (ID, tenancy documents, medical); automated banding and review; chatbot-style applicant support.\n- **Workflows**: mature online allocations portals (Locata, Home Connections, and others).\n- **Data**: supply vs demand analytics by bedroom size and area; equity analysis of allocations; bidding behaviour.\n\n### Agentic future\n\nFully agentic potential for routine scheme application (eligibility, banding, offer matching). Human-in-the-loop for discretionary elements (medical assessment, exceptional circumstances). One of the strongest cases in Housing for substantive automation because the scheme is the decision rule.\n\n---\n\n## 4. Tenancy management (HRA stock)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with fully-agentic transactional sub-processes |\n| **Guardrails** | Regulated by RSH consumer standards • Ombudsman jurisdiction |\n| **Headline pressures** | Rent collection vs UC volatility • Stock condition (Decent Homes) • Awaab's Law response • Damp and mould |\n| **Headline opportunities** | AI-triage of tenant contacts • Tenant portal • Arrears predictive analytics |\n\n*Management of council-owned social housing under a secure or assured tenancy.*\n\n### How it works\n\nA housing officer holds a patch of tenancies and is the primary relationship with residents. Day-to-day tenancy management covers sign-ups, transfers, mutual exchanges, successions, welfare visits, and ending tenancies. The officer triages repair reporting, ASB, arrears, safeguarding concerns, and complex household needs. Regulatory consumer standards on tenant voice, transparency, and responsiveness shape the way the work is organised and measured.\n\n### Legal basis\n\nHousing Act 1985 (secure tenancies); Landlord and Tenant Act 1985; Equality Act 2010; Housing Ombudsman's Complaint Handling Code (mandatory from 2024); Social Housing (Regulation) Act 2023.\n\n### Guardrails\n\nRegulated by the Regulator of Social Housing under consumer standards (Safety and Quality, Tenancy, Transparency, Influence and Accountability, Neighbourhood and Community). Ombudsman jurisdiction.\n\n### Demand drivers\n\nTenancy sign-ups; transfers; mutual exchanges; succession; ending tenancies. Resident enquiry volume is the operational driver.\n\n### Pressures\n\nRent collection against Universal Credit volatility. Stock condition under the new Decent Homes regime. Awaab's Law response times. Damp and mould reporting pipelines.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-triage of tenant contacts; automated statement and rent account queries.\n- **Workflows**: tenant portal for tenancy self-service, repair reporting, and payment.\n- **Data**: arrears predictive analytics; damp and mould concern tracking; complaint pattern analysis.\n\n### Agentic future\n\nHuman-in-the-loop for complex case and ASB; fully agentic for transactional self-service. Tenancy management is one of the areas where the new regulatory consumer standards (especially transparency, influence, accountability) are accelerating investment in tenant-facing digital services.\n\n---\n\n## 5. Rent collection and income management\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for routine, human-in-the-loop for possession and vulnerability |\n| **Guardrails** | Operational duty to HRA • Pre-Action Protocol • UC managed payment regulations |\n| **Headline pressures** | UC alternative payment arrangements • Time-to-court • Sustainment vs recovery balance |\n| **Headline opportunities** | Automated payment matching • AI-drafted comms • Predictive arrears risk scoring |\n\n*Collecting HRA rent and service charges, managing arrears, and supporting tenants to sustain tenancies.*\n\n### How it works\n\nRent charges are billed weekly or monthly; most payments arrive automatically by direct debit or the housing element of Universal Credit. An income management team monitors arrears daily, contacts tenants at defined thresholds, offers repayment plans, and coordinates UC alternative payment arrangements where tenancies are at risk. Where arrangements fail, the process escalates through notice of seeking possession, court proceedings, and ultimately eviction — used as a genuine last resort under tenancy sustainment policy.\n\n### Legal basis\n\nHousing Act 1985; Rent Arrears Pre-Action Protocol; Universal Credit regulations for managed payments.\n\n### Guardrails\n\nNot statutory as such; operational duty to the HRA.\n\n### Demand drivers\n\nArrears driven by UC transition volatility, cost-of-living pressures, and household composition change.\n\n### Pressures\n\nUC alternative payment arrangements. Time-to-court for possession proceedings. Balancing arrears recovery with tenancy sustainment.\n\n### Digital and data opportunities\n\n- **Productivity**: automated payment matching; AI-drafted arrears communications.\n- **Workflows**: tenant app with arrears dashboard; payment plan self-service.\n- **Data**: predictive arrears risk scoring; outcome analysis of intervention types.\n\n### Agentic future\n\nFully agentic for routine arrears communication and payment plan administration. Human-in-the-loop for possession decisions and vulnerability triage.\n\n---\n\n## 6. Responsive repairs\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for scheduling, human-in-the-loop for diagnostic |\n| **Guardrails** | Statutory duty to repair • Awaab's Law timescales (in force October 2025) |\n| **Headline pressures** | Contractor capacity • Appointment attendance • Awaab's Law compliance • Recurring failures |\n| **Headline opportunities** | AI triage of repair reports • Photo-based diagnosis • Operative mobile working |\n\n*Day-to-day repairs to the council's housing stock.*\n\n### How it works\n\nTenants report repairs by phone, portal, or app, describing the problem and often uploading photos. A repair is classified by priority — emergency within 24 hours, urgent within 7 days, routine within 28 days — with Awaab's Law now imposing shorter timescales on damp, mould, and other serious hazards. Jobs are despatched to in-house operatives or contractors, scheduled against tenant availability, and completed with post-inspection where indicated. Tenant feedback and completion data feed back into contract management and stock investment planning.\n\n### Legal basis\n\nLandlord and Tenant Act 1985 s11; Homes (Fitness for Human Habitation) Act 2018; Awaab's Law (Social Housing (Regulation) Act 2023) — in force from October 2025.\n\n### Guardrails\n\nStatutory duty to repair. Awaab's Law imposes timescales on response to damp and mould and other serious hazards.\n\n### Demand drivers\n\nStock age; tenure change; weather events. Awaab's Law has materially increased the priority and visibility of damp and mould reports.\n\n### Pressures\n\nContractor capacity. Appointment attendance rates. Repair completion time against the new statutory timescales. Interface with asset management on recurring failures.\n\n### Digital and data opportunities\n\n- **Productivity**: AI triage of repair reports (voice-to-job classification); photo-based diagnosis.\n- **Workflows**: tenant reporting via app; automated scheduling; operative mobile working.\n- **Data**: repair volume analytics by property and component; early warning on systemic issues in archetypes.\n\n### Agentic future\n\nFully agentic for routine repair scheduling and job classification. Human-in-the-loop for diagnostic judgement and complex trade work — though AI-assisted diagnostics are improving rapidly. Repairs is the clearest single operational productivity opportunity in HRA services.\n\n---\n\n## 7. Planned maintenance and capital works\n\n| | |\n|---|---|\n| **Agentic classification** | AI-assisted |\n| **Guardrails** | Regulatory standard (Safety and Quality) • Building safety regime for higher-risk buildings |\n| **Headline pressures** | HRA capital constraint • Construction cost inflation • s20 leaseholder consultation • Decant logistics |\n| **Headline opportunities** | AI-assisted survey review • Resident engagement platforms • Building safety golden thread |\n\n*Stock investment planning, delivery of major works, and the Decent Homes programme.*\n\n### How it works\n\nAsset management teams maintain a stock condition database populated by cyclical surveys, works histories, and tenant-reported defects. Annual programmes (kitchens, bathrooms, roofs, heating, windows) and building safety works are scheduled against budget, with s20 leaseholder consultation where leaseholders are affected. Contractors are procured by framework; residents are consulted, temporary decant arranged where needed, and works monitored to completion. Post-completion handover and defects liability close the cycle.\n\n### Legal basis\n\nLandlord and Tenant Act 1985; Building Safety Act 2022; Decent Homes Standard (revised under the Social Housing (Regulation) Act 2023).\n\n### Guardrails\n\nRegulatory standard (Safety and Quality). Building safety regime for higher-risk buildings.\n\n### Demand drivers\n\nCyclical lifecycle replacement; building safety remediation; fire safety; Future Homes Standard retrofit.\n\n### Pressures\n\nCapital constraint on the HRA. Cost inflation in construction. Leaseholder consultation (s20). Resident decant logistics.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted asset condition survey review.\n- **Workflows**: resident engagement platforms; leaseholder s20 consultation portals.\n- **Data**: stock condition analytics; predictive lifecycle modelling; building safety golden thread records.\n\n### Agentic future\n\nAI-assisted. Capital programme decisions are political and financial. Agent roles in surveying, planning, and resident engagement.\n\n---\n\n## 8. Anti-social behaviour (tenancy and community)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Multiple powers (injunctions, CBOs, CPNs, closures) • Process-mandated |\n| **Headline pressures** | Multi-agency coordination • Repeat reporting • Community trigger obligations |\n| **Headline opportunities** | AI-structured case recording • Shared police case view • Hotspot analytics |\n\n*Response to ASB affecting tenants, residents, and communities.*\n\n### How it works\n\nReports reach the council by phone, portal, police referral, and via housing officers. A caseworker logs the report, contacts the reporter, and coordinates the response — evidence gathering, warnings, mediation, formal action (injunctions, CPNs, closures, possession), and victim support. Partnership working with police and environmental health is constant. The Community Trigger allows victims to request a multi-agency review where they feel the response has been inadequate.\n\n### Legal basis\n\nAnti-social Behaviour, Crime and Policing Act 2014; Housing Act 1985 schedule 2 (grounds for possession); various tenancy conditions.\n\n### Guardrails\n\nMultiple powers (injunctions, CBOs, CPNs, closures). Process-mandated.\n\n### Demand drivers\n\nNoise complaints (the largest single category); neighbour disputes; drug-related ASB; perpetrator concentration in a small cohort.\n\n### Pressures\n\nMulti-agency coordination with police. Repeat reporting on the same cases. Community trigger obligations.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-structured case recording; automated community trigger tracking.\n- **Workflows**: shared case view with police; victim self-service.\n- **Data**: hotspot analytics; repeat victim identification; perpetrator concentration analysis.\n\n### Agentic future\n\nHuman-in-the-loop. ASB response is a relational intervention, including into victim support and perpetrator work. Agentic support in data assembly and coordination.\n\n---\n\n## 9. Private sector housing enforcement\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty (RRA 2025 converts powers to duties) • Actor-mandated • Timescale-mandated for some notices |\n| **Headline pressures** | Officer capacity vs expanded duty • Civil penalty appeals • New investigatory powers learning curve |\n| **Headline opportunities** | AI HHSRS scoring from photos • Automated notice drafting • PRS database integration |\n\n*Enforcement against hazards, disrepair, and non-compliance in privately rented and owned homes.*\n\n### How it works\n\nComplaints reach Environmental Health or Private Sector Housing teams from tenants, neighbours, MPs, and referrals from homelessness casework. Officers inspect against the Housing Health and Safety Rating System, identify hazards, and issue notices — improvement, prohibition, emergency remedial action — or civil penalties (now up to £40,000 under the Renters' Rights Act 2025). Serious cases proceed to prosecution. From 1 May 2026, landlord legislation enforcement becomes a statutory duty rather than a power.\n\n### Legal basis\n\nHousing Act 2004 Parts 1–4 (HHSRS, enforcement, HMO licensing); Renters' Rights Act 2025 (new enforcement duties and investigatory powers).\n\n### Guardrails\n\nThe Renters' Rights Act 2025 converts many of these functions from powers into duties. Local housing authorities now have a duty to enforce the \"landlord legislation\". Actor-mandated (authorised officers). Timescale-mandated for some notice service.\n\n### Demand drivers\n\nTenant complaints; housing enforcement referrals from fire service and environmental health; from 2026, the PRS database will be a new source of intelligence.\n\n### Pressures\n\nOfficer capacity against the expanded duty. Civil penalty issuance and appeal to First-tier Tribunal. Learning curve on new investigatory powers (business and residential entry with and without warrant).\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted HHSRS scoring from photographic evidence; automated notice drafting.\n- **Workflows**: shared enforcement case view; civil penalty workflow; integration with the PRS database once live.\n- **Data**: enforcement activity reporting to the Secretary of State (new duty); landlord concentration analysis; repeat-offender identification.\n\n### Agentic future\n\nHuman-in-the-loop. Enforcement decisions and court proceedings are officer-led. Agentic value in intelligence, case assembly, notice drafting, and the new statutory reporting to the Secretary of State.\n\n---\n\n## 10. HMO licensing\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for routine, human-in-the-loop for inspection and enforcement |\n| **Guardrails** | Mandatory licensing statutory • Additional and selective licensing require consultation |\n| **Headline pressures** | Licensing backlog • Fee-income vs enforcement balance • Five-year scheme renewal |\n| **Headline opportunities** | AI-assisted application review • Landlord self-service • Compliance analytics |\n\n*Licensing houses in multiple occupation to ensure minimum standards and enforcement.*\n\n### How it works\n\nLandlords apply for mandatory HMO licensing (5+ occupants sharing amenities) or, in scheme areas, additional or selective licensing. Officers verify applications, inspect premises, issue or refuse licences with conditions, and monitor compliance through follow-up inspections and complaints. Enforcement against unlicensed operation includes civil penalties and prosecution. Renewals run on a five-year cycle.\n\n### Legal basis\n\nHousing Act 2004 Parts 2 and 3 (mandatory licensing above 5 occupants, selective and additional licensing at LA discretion).\n\n### Guardrails\n\nMandatory HMO licensing is statutory. Additional and selective licensing require consultation and (for larger schemes) Secretary of State confirmation.\n\n### Demand drivers\n\nPRS conversion to HMO; student concentration areas; migration-driven concentrations of HMO demand.\n\n### Pressures\n\nLicensing backlog. Fee-income vs enforcement cost balance. Scheme renewal cycle (five-year schemes).\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted application review and inspection scheduling.\n- **Workflows**: landlord self-service application and renewal; inspector mobile working.\n- **Data**: licensing income analytics; compliance status by ward; inspection risk-scoring.\n\n### Agentic future\n\nFully agentic for routine application processing and renewal. Human-in-the-loop for inspection, enforcement, and complex licensing decisions.\n\n---\n\n## 11. Disabled Facilities Grants (DFGs)\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with near-fully-agentic sub-processes |\n| **Guardrails** | Statutory duty to pay where eligible • Process-mandated (OT assessment, means test) |\n| **Headline pressures** | OT-to-completion cycle (often 9–12 months) • Means test complexity • Contractor capacity |\n| **Headline opportunities** | AI-drafted specifications from OT assessments • Automated means-test • Single-entry pathway |\n\n*Grants to adapt dwellings for disabled occupants to support independent living.*\n\n### How it works\n\nAn occupational therapist in ASCH identifies the need for an adaptation during a needs assessment and refers to the DFG team. The grants officer means-tests the household and commissions a technical survey and works specification. A contractor is procured and the works delivered, with the officer managing payment against milestones. End-to-end cycle typically runs 6 to 12 months; the OT, grants, and works teams often sit in different parts of the council, making orchestration the central design problem.\n\n### Legal basis\n\nHousing Grants, Construction and Regeneration Act 1996; Better Care Fund policy framework.\n\n### Guardrails\n\nStatutory duty to pay DFG where eligible (mandatory grant up to statutory cap). Process-mandated (OT assessment, means test).\n\n### Demand drivers\n\nAgeing population; learning disability; rising complexity. Heavily linked to ASCH OT waiting lists.\n\n### Pressures\n\nProcessing time from OT referral to works completion (often 9–12 months). Means test complexity. Contractor market capacity.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted specifications from OT assessments; automated means-test calculation.\n- **Workflows**: single-entry pathway covering OT, grants, and works (usually fragmented across ASCH, Housing, and Property).\n- **Data**: end-to-end cycle-time analytics; complex case bottleneck identification.\n\n### Agentic future\n\nHuman-in-the-loop for OT assessment; near-fully agentic for means-test administration and works ordering. The hidden opportunity is often in orchestration across the three teams that together deliver the service.\n\n---\n\n## 12. Housing advice and options\n\n| | |\n|---|---|\n| **Agentic classification** | Fully agentic for routine, human-in-the-loop for complex |\n| **Guardrails** | Statutory duty to provide advice • Discretionary in scope |\n| **Headline pressures** | Referral volumes • Channel strategy • Escalation to statutory homelessness |\n| **Headline opportunities** | AI chatbot for routine advice • Digital self-diagnostic • Unmet need analysis |\n\n*Advice and casework to enable people to access housing options, including social, private, and low-cost home ownership.*\n\n### How it works\n\nPeople seeking help with housing contact the council through the phone, online advice tools, drop-in sessions, and referrals from partner agencies. A housing adviser gives information on the local housing market, eligibility for social housing, private renting options, low-cost home ownership, and available support. Complex cases route to statutory homelessness assessment; simpler enquiries are resolved on the spot or with a follow-up. The service sits at the front of the homelessness duty.\n\n### Legal basis\n\nHomelessness Reduction Act 2017 s2 (duty to provide advice); discretionary in scope beyond minimum.\n\n### Guardrails\n\nStatutory duty to provide an advice service. Scope is discretionary.\n\n### Demand drivers\n\nPeople threatened with homelessness; those wishing to move; those looking for low-cost home ownership.\n\n### Pressures\n\nReferral volumes without defined threshold. Channel strategy (digital, phone, face-to-face). Appropriate escalation to statutory homelessness assessment.\n\n### Digital and data opportunities\n\n- **Productivity**: AI chatbot for routine housing advice.\n- **Workflows**: digital self-diagnostic to route to the right pathway.\n- **Data**: unmet need analysis; signposting effectiveness.\n\n### Agentic future\n\nFully agentic for routine self-service advice. Human-in-the-loop for complex cases. A service well-suited to conversational AI augmented by structured rules on eligibility.\n\n---\n\n## 13. Supported housing commissioning\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Care Act (where applicable) • Supported Housing (Regulatory Oversight) Act 2023 (new licensing) |\n| **Headline pressures** | \"Exempt accommodation\" market quality • New regulatory regime • Housing Benefit subsidy interface |\n| **Headline opportunities** | AI-assisted quality monitoring • Provider portal • Unit cost and outcome analytics |\n\n*Commissioning housing-related support for vulnerable adults, often jointly with ASCH.*\n\n### How it works\n\nCommissioning teams identify need through the JSNA and pathway reviews (care leavers, mental health, rough sleeping, domestic abuse, learning disability, offending). Contracts are procured with specialist providers, often with housing management separated from support provision. Housing Benefit subsidy at enhanced rates underpins viability. The Supported Housing (Regulatory Oversight) Act 2023 introduces new licensing to address quality concerns in the 'exempt accommodation' market.\n\n### Legal basis\n\nCare Act 2014 (where it includes accommodation with support for care needs); Supported Housing (Regulatory Oversight) Act 2023.\n\n### Guardrails\n\nThe 2023 Act introduces a new licensing regime for supported housing, to be brought in via regulations.\n\n### Demand drivers\n\nCare leavers; people with mental ill-health; people with learning disabilities; domestic abuse (Part 4 of the Domestic Abuse Act 2021 places a duty on upper tier/unitary authorities); rough sleepers.\n\n### Pressures\n\nMarket quality (the \"exempt accommodation\" problem in some cities). New regulatory regime. Housing Benefit subsidy interface.\n\n### Digital and data opportunities\n\n- **Productivity**: AI-assisted quality monitoring from visit reports.\n- **Workflows**: provider portal for vacancy reporting.\n- **Data**: unit cost analytics; outcome analytics.\n\n### Agentic future\n\nHuman-in-the-loop. Commissioning is human; agentic value in monitoring, intelligence, and data.\n\n---\n\n## 14. Gypsy, Roma and Traveller sites\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop |\n| **Guardrails** | Statutory duty to assess need • Provision discretionary but heavily policy-constrained |\n| **Headline pressures** | Unauthorised encampments (Place/Planning interface) • Site conditions • Site expansion politics |\n| **Headline opportunities** | Digital site management • Resident self-service • Need assessment analytics |\n\n*Provision of and management of council-owned GRT sites.*\n\n### How it works\n\nResidents apply to live on the council's sites and are allocated pitches through the council's allocation policy. A site manager maintains the site, collects rent, manages utilities, and responds to maintenance and neighbour issues. Unauthorised encampments on other land are handled through a Place-led team under s61 and s62 of the Criminal Justice and Public Order Act 1994. Site expansion proposals trigger planning and community engagement processes that are typically politically complex.\n\n### Legal basis\n\nCaravan Sites and Control of Development Act 1960; Caravan Sites Act 1968; Housing Act 2004 ss225, 226 (needs assessment duty).\n\n### Guardrails\n\nStatutory duty to assess need. Provision is discretionary but heavily policy-constrained.\n\n### Demand drivers\n\nGRT accommodation assessment identifies local need. Supply typically lags demand.\n\n### Pressures\n\nUnauthorised encampments (a Place/Planning interface). Site conditions. Political sensitivity of site expansion.\n\n### Digital and data opportunities\n\n- **Productivity**: digital site management; automated rent and utilities reconciliation.\n- **Workflows**: resident self-service.\n- **Data**: need assessment analytics.\n\n### Agentic future\n\nHuman-in-the-loop. Small-volume, relational service. Agentic value limited.\n\n---\n\n## 15. Leasehold services\n\n| | |\n|---|---|\n| **Agentic classification** | Human-in-the-loop, with fully-agentic transactional sub-processes |\n| **Guardrails** | Process-mandated for service charges and consultation • First-tier Tribunal jurisdiction |\n| **Headline pressures** | Service charge disputes • s20 consultation accuracy • Building safety remediation cost recovery |\n| **Headline opportunities** | AI-drafted s20 notices • Leaseholder portal • Dispute pattern analytics |\n\n*Managing leaseholders in the council's housing stock, including service charges and major works consultation.*\n\n### How it works\n\nLeaseholders — mostly former Right to Buy tenants — pay ground rent and service charges for their share of estate and block services. A leasehold team administers accounts, issues service charge demands with supporting information, and handles disputes. Major works consultation under s20 is a defined procedure with prescribed timeframes and tenant response provisions. Building safety remediation post-Grenfell and post-Building Safety Act 2022 has introduced significant cost recovery disputes.\n\n### Legal basis\n\nLandlord and Tenant Act 1985 ss18–20 (service charges, s20 consultation); Commonhold and Leasehold Reform Act 2002; Leasehold and Freehold Reform Act 2024.\n\n### Guardrails\n\nProcess-mandated for service charges and consultation. First-tier Tribunal jurisdiction on disputes.\n\n### Demand drivers\n\nRight to Buy cohort has created substantial leaseholder populations on council estates.\n\n### Pressures\n\nService charge disputes. s20 major works consultation accuracy. Building safety remediation cost allocation (post-Grenfell and post-Building Safety Act 2022).\n\n### Digital and data opportunities\n\n- **Productivity**: AI-drafted s20 consultation notices; automated service charge account queries.\n- **Workflows**: leaseholder portal for account, statements, and consultation responses.\n- **Data**: dispute pattern analytics; s20 compliance.\n\n### Agentic future\n\nHuman-in-the-loop for dispute resolution. Fully agentic for routine account queries and statement generation.\n\n---\n\n## Cross-cutting themes in Housing\n\nThree themes dominate conversations with councils on Housing.\n\n- **The temporary accommodation cost pressure.** In many councils TA spend has become the single largest general fund risk, and the operating model implications (stock acquisition, PRS leasing schemes, prevention investment) run far beyond the homelessness team.\n- **The regulatory step-change for social landlords.** The consumer standards, Awaab's Law, and the Housing Ombudsman's Complaint Handling Code have pushed tenant voice, transparency, and response-time data into the centre of stock management in a way that was not true five years ago.\n- **The Renters' Rights Act enforcement expansion.** Local housing authorities now carry a duty to enforce landlord legislation, backed by new investigatory powers, with an expected increase in caseload that will need commensurate investment in systems, intelligence, and officer capacity.\n\n## A reimagined operating model for Housing\n\nHousing today is experienced by most residents as a series of transactions — apply for something, wait, receive a decision, apply for something else. A reimagined model is a continuous relationship between the household and the council on matters of housing, from prevention through crisis response through tenancy management to move-on. The distinctions between homelessness, allocations, tenancy management, and PRS engagement blur from the resident's perspective; the statutory duties remain clearly distinguished in the legal frame.\n\n### From reactive crisis to preventive contact\n\nMost households who approach the council as homeless were known to be at risk weeks or months before. Section 21 notice patterns (until Phase 1 RRA commencement), DWP arrears signals, court lists, prison release schedules, care-leaver transition dates, domestic abuse referral flags, school moves, health attendance patterns — these together describe a landscape of imminent homelessness risk that is invisible to any one team but legible in aggregate. The reimagined model reaches the household at the point of signal, not at the point of crisis. DEA 2017 provides a substantial legal basis for the public service delivery and debt-related data flows that this requires.\n\n### From matching problem to continuous optimisation\n\nTemporary accommodation, housing register allocation, and private rented sector placement are, at heart, matching problems — households to units — against suitability and cost criteria. Today they are done episodically, in offices, by officers. In the reimagined model they are done continuously, by agents, against real-time inventory and real-time household need. The scarce resource is still units; the wait is still long. What changes is the friction, the hand-off cost, and the officer hours consumed by matching rather than by resolving the hardest cases.\n\n### From stock reports to digital twin\n\nThe council's HRA stock — where it still has one — becomes a live digital twin. Damp and temperature sensors, usage patterns, resident reports, and inspection data flow continuously. Issues are identified before reports are made, scheduled against operative availability, and closed against verified resolution. Awaab's Law compliance becomes architectural rather than paper-based. The HRA's economics shift as preventative maintenance displaces reactive repair and as resident-reported issues receive quicker, better-documented resolution.\n\n### From complaint-driven enforcement to intelligence-led compliance\n\nThe Renters' Rights Act 2025 makes enforcement a duty. The reimagined model treats the PRS as a regulated sector requiring intelligence, not a complaint backlog requiring processing. The PRS database combines with tenant complaint history, housing benefit claims, council tax records, planning data, and licensing data to create a picture of landlord compliance that supports risk-based enforcement at scale. New civil penalty regimes (up to £40,000 for serious offences) make enforcement both a duty and a fiscal instrument.\n\n### What combines\n\nHomelessness prevention, allocations, and PRS options become a single housing need fabric from the resident's perspective. Stock management, repairs, and tenancy become a single \"your home with the council\" relationship. PRS enforcement, HMO licensing, and other regulatory functions share an intelligence layer. DFG delivery becomes a single case across OT, grants, and works — three teams, one orchestrating agent, one visible case to the household.\n\n### What remains irreducibly human\n\nThe s184 decision. The allocation of a limited resource against competing claims in contested circumstances. The eviction decision. The tenant sustainment conversation with a vulnerable household. The professional judgement of an officer inspecting a property where children may be at risk.\n\n### The risks and hard constraints\n\nProactive outreach to households identified as at risk requires real care with consent, trust, and household autonomy. A pattern flag is not a verdict, and a household's right to decline help remains. The model must be robust to the risk of early-warning systems that disproportionately surveil particular communities, tenures, or household compositions. The architecture matters; the design of who gets flagged, for what, and with what response is a political and ethical question, not a technical one. Supply is the binding constraint on allocations and TA; no reimagined operating model manufactures units, and the risk of conflating process improvement with outcome improvement is real.\n","services/place.md":"# Place — services reference\n\nThe widest directorate in scope, covering the council's regulatory, environmental, infrastructure, cultural, and economic development functions. Three characteristics make Place distinctive: first, many services are subject to specific regulatory regimes with prescribed process and timescale; second, many are income-generating (fees, charges, licences); third, many operate at the boundary between the council and the regulated economy, with active public and commercial interest in decisions. In two-tier areas, several services are split between counties (highways, waste disposal, libraries, trading standards) and districts (planning, building control, waste collection, licensing, environmental health) — noted below where relevant.\n\nThis is the council-agnostic reference for the Place archetype. Council-specific naming (Croydon's SCRER — Sustainable Communities, Regeneration & Economic Recovery — and equivalent directorate names elsewhere) and council-specific divisional structures sit in the relevant council adapter.\n\
